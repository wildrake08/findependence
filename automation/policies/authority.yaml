version: 1

# Outcome, Capability, Function, Mechanism entries and Requirement.accept enacted 2026-09-25
# by ACT-001 (REV-003, CP-002 option B, CHG-008). "specify" covers proposed -> coherent -> specified.
# An AI condition is enforced by scripts/check I-012.
# Evidence.qualify and Assessment.issue enacted 2026-09-26 by ACT-001 (REV-004, CP-004 option B).

policies:
  Subject:
    propose: {ai: allow, human: allow}
    canonicalize: {ai: deny, human: ratification_required}
  Telos:
    propose: {ai: allow, human: allow}
    canonicalize: {ai: deny, human: ratification_required}
  Purpose:
    propose: {ai: allow, human: allow}
    canonicalize: {ai: deny, human: ratification_required}
  Outcome:
    propose: {ai: allow, human: allow}
    specify: {ai: deny, human: allow}
    canonicalize: {ai: deny, human: ratification_required}
  Capability:
    propose: {ai: allow, human: allow}
    specify: {ai: deny, human: allow}
    canonicalize: {ai: deny, human: ratification_required}
  Function:
    propose: {ai: allow, human: allow}
    specify: {ai: {condition: parent_specified_and_check_trace_pass}, human: allow}
    canonicalize: {ai: deny, human: ratification_required}
  Mechanism:
    propose: {ai: allow, human: allow}
    specify: {ai: {condition: parent_specified_and_check_trace_pass}, human: allow}
    canonicalize: {ai: deny, human: ratification_required}
  Requirement:
    propose: {ai: allow, human: allow}
    accept: {ai: {condition: parent_specified_and_check_trace_pass}, human: allow}
  Evidence:
    qualify: {ai: {condition: reproducible_test_or_check}, human: allow}
  Assessment:
    issue: {ai: {condition: implementation_level_claim}, human: allow}
  ImplementationElement:
    implement:
      ai: {condition: authorized_work_item}
      human: allow

constitutional_change:
  ai: {propose: allow, approve: deny}
  human: {approve: constitutional_authority_required}
