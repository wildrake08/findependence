version: 1
artifacts:
  - id: REV-106
    type: Review
    kind: human_ratification
    reviewer: ACT-001
    at: 2026-09-30
    response_verbatim: "Mitigate all findings"
    context: >
      ACT-002 assessed v0.8.1-alpha's security and privacy at the implementation level (ASSESS-001, 22 findings,
      FND-01..FND-22; not an independent review) and asked ACT-001 three questions before mitigating: the F-01
      design for FND-01 and FND-04 (DEF-028's decision), how to record the Requirement changes FND-03 and FND-06
      need, and what to do about FND-22 (the hosted operator can read what signed-in members can read). ACT-001
      then said "Continue" twice after interruptions.
    decisions:
      instruction: {decision: "mitigate every finding of ASSESS-001"}
      f01_design:
        question: "FND-01 and FND-04 fall under DEF-028's F-01 design decision. How should the local form's vault be hardened?"
        answer_verbatim: "Verify seals + sign boxes (Recommended)"
        decision: >
          extend keys only to readers whose existing seal the saving member can verify (seal commitments), and
          sign every content box, history entry, and reading with the author's pinned Ed25519 key, derived from
          their X25519 key; existing vaults gain signing keys at each member's next unlock and older boxes are
          shown as written before signing. Forged consents, removals, and rollback (F-01 attacks 3 and 4, F-03)
          stay open until SELF-REVIEW option (a). DEF-028 remains open for that remainder.
      governance:
        question: "FND-03 changes REQ-184 and FND-06 changes REQ-190. How should I record this work?"
        answer_verbatim: "Your instruction approves it (Recommended)"
        decision: "this instruction approves CP-023 (the Requirement changes), the Defeaters for the findings, and WI-079, recorded by ACT-002; nothing is merged, released, or deployed by it"
      fnd_22:
        question: "FND-22: the hosted server holds a signed-in member's private key, so the operator can read what they can. What should I do?"
        answer_verbatim: "Open a ChangeProposal"
        decision: "no code change; CP-024 is opened to consider decrypting in the browser, which would reverse ARCH-003's decision"
    provenance: {source: "ACT-001 responses in session, 2026-09-30", created_by: ACT-002, authority: "recording of human decision", inputs: [project/assurance/security-review/ASSESS-001-implementation-assessment.md], created_at: 2026-09-30}
