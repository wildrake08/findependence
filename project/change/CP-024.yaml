version: 1
artifacts:
  - id: CP-024
    type: Change
    kind: ChangeProposal
    state: open
    title: Consider decrypting in the member's browser, so the hosted operator can't read members' information
    addresses: [ASSESS-001 FND-22, ARCH-003]
    context: >
      ASSESS-001 FND-22: while a member is signed in to the hosted form, the server holds their unwrapped private
      key in memory, so the operator (or anyone with a console on the node) can read everything that member can.
      This is ARCH-003's stated design and REQ-180 discloses it; GATE-016 asks whether US financial-privacy rules
      apply to such a service. ACT-001 asked for a ChangeProposal rather than a code change (REV-106).
    options:
      - {id: A, change: "keep the design: the operator is trusted while members are signed in, disclosed at sign-up; operator console connections stay audited (WI-077)"}
      - {id: B, change: "decrypt and encrypt in the browser (WebCrypto or a WebAssembly build of the envelope), so the server stores and relays only ciphertext; reverses ARCH-003's no-JavaScript-crypto decision, needs script delivery the operator can't alter (the operator serves the script), and changes the hosted form's architecture"}
      - {id: C, change: "a native or installed client for members who need to exclude the operator, keeping the hosted web form as disclosed"}
    impact_analysis: >
      B or C would change Purpose-level trade-offs (who must be trusted), ARCH-003, REQ-180's disclosure, and most of
      the hosted form; a decision belongs to ACT-001, after the GATE-016 legal check.
    recommendation: "decide after GATE-016's professional check answers whether operator access is acceptable at all; until then option A, as disclosed"
    provenance: {source: ASSESS-001, created_by: ACT-002, authority: "REV-106; proposal_only", inputs: [project/assurance/security-review/ASSESS-001-implementation-assessment.md, project/assurance/design/ARCH-003-platform-reference.md], created_at: 2026-09-30}
