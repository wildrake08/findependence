    name: ux001_necessary_corrections
    enacted_at: 2026-09-26
    actor: ACT-002
    authority: "REV-013 (ACT-001)"
    impact_analysis: >
      WI-021 implements UX-001 R2, R5, R4, and R3. Amounts are now integer cents with an explicit
      direction and strict validation; items saved earlier in whole units are converted in memory
      (stored content is unchanged). Field borders meet WCAG 1.4.11. Idle locks are explained. Only
      ownership actions that can succeed are offered, and joint Stop owning is confirmed. IE-203 and
      IE-205 changed; the Money module is added to IE-205's paths. No Requirement or core change.
      REV-013 also merged findependence/security-review-package and findependence/ux-assessment into
      main (102e283).
    created: [REV-013, WI-021]
    modified: [IE-203, IE-205, project/manifest.yaml]
