artifacts:
  - id: CP-029
    type: Change
    kind: ChangeProposal
    state: accepted
    decision: {review: REV-114, choice: "the recommendation"}
    title: Resolve ASSESS-002's flagged items that can be built now
    addresses: [DEF-077, DEF-080, ASSESS-002 FND-209, ASSESS-002 FND-210, ASSESS-002 FND-211, ASM-020, REQ-115, REQ-182, REQ-186, REQ-187, REQ-198]
    context: >
      The ASSESS-002 re-run (2026-10-02) found a whole-household rollback from a database copy (FND-209), one member
      filling another's item limit by giving items unasked (FND-210), and account rows outside the records' code
      (FND-211), and flagged accepted items including plaintext structure (ASM-020).
    impact_analysis: >
      REQ-115's generalization changes core and both forms: nobody becomes an owner of any item without agreeing,
      so giving an item away waits for the receiver; testers need a new release (v0.8.3-alpha), and the local
      form's wording says so. The hosted form stores each household as one encrypted block with a change counter
      also kept outside the database, encrypts display names, and refuses a key that doesn't match its account;
      it needs HOUSEHOLD_LEDGER_PATH, and a migration removes development data. The counter is not shown to members:
      it would count other members' private changes (REQ-106). No Claim changes.
    options:
      - {id: build_now, change: "items 4, 8, FND-211, and the hosted part of item 5, as one WorkItem", recommendation: true}
      - {id: separately, change: "item 3 (client-side encryption) and item 6 (cooling-off period)"}
      - {id: after_review, change: "item 2 (DESIGN-002) and the local part of item 5"}
    decision_requested_of: ACT-001
    provenance: {source: "ACT-001 request, 2026-10-02: resolve each item with practical highest security and privacy options", created_by: ACT-002, authority: proposal_only, inputs: [project/assurance/security-review/ASSESS-002-implementation-assessment.md], created_at: 2026-10-02}
