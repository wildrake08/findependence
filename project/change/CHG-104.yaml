    impact_analysis: >
      WI-076 builds the rest of the hosted form's pages (IE-210): plans and requests, goals and set-asides,
      retirement, export, bring-in, and the leave checklist, with their words in shared/. With WI-075's pages and the
      contract suite, every criterion of CLM-038's Requirements not excluded as local holds for the hosted form:
      REQ-188 and REQ-190 are satisfied, REQ-124 is satisfied for the hosted form over a member's whole visit, and
      REQ-191 waits only for operator access in a deployment. DEF-061 is fixed in the shared envelope for both forms
      (the only change to the local form's behaviour; its captured pages, suites, and e2e are unchanged) and
      resolved; CLM-038, a Claim about commit 2608198, is weakened by ASMT-028. The hosted gate's sobelow honours
      reviewed skips; there is one, a false positive on the upload's path, reviewed in place.
