    authority: "REV-046 (ACT-001); UX-002; CP-004 option B"
    impact_analysis: >
      UX-002 assessed the v0.5.0-alpha interface. Its five small recommendations are built in WI-042 as
      interface wording and presentation within the existing Requirements: a joint account's view names
      whose items it leaves out; a debt's rate and minimum are prefilled; a plan's outcome is stated in a
      sentence with its months folded; retirement estimates are rounded to $100 with "about"; what a
      file brings in is counted by kind. GATE-030 re-verifies IE-205 on REPRO-RUN-010. The two
      architectural recommendations are proposed as CP-014 (what a joint account's running balance
      counts) and CP-015 (how an item's amount changes), awaiting ACT-001. CLM-028 remains the Claim for
      the released interface at b82bb1f; the next release's Claim will cover these changes.
