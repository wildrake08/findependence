version: 1
artifacts:
  - id: CP-028
    type: Change
    kind: ChangeProposal
    state: accepted
    decision: {review: REV-113, choice: "all three, with random request identifiers"}
    title: Mitigate ASSESS-002's findings in the hosted form (stage 1) and extend DESIGN-002 to it (stage 2)
    addresses: [DEF-077, DEF-078, DEF-079, ASSESS-002 FND-203, ASSESS-002 FND-208, REQ-190, REQ-193, DEF-028]
    context: >
      ASSESS-002 found the hosted form's access records forgeable by whoever writes the database (FND-201), offline
      passphrase guessing from a database copy (FND-202), two counting channels between members (FND-204, FND-205),
      item names in an unencrypted cookie (FND-206), an unused socket (FND-207), and the trusted operator's reach
      (FND-203, accepted by REV-111).
    impact_analysis: >
      Stage 1 changes the hosted form only, except three lines in shared/ (the refusal for a member's full item
      list, and the confirmation wording's reading of a request identifier); core and the local form are unchanged.
      Two new server keys (PASSPHRASE_PEPPER, HOUSEHOLD_STATE_KEY), required in production and checked by the
      preflight check. A migration removes development households (the hosted form is not in service). No Claim
      changes: no hosted Claim exists. Stage 2 is DESIGN-002 for both forms, after the independent review.
    options:
      - {id: D1, change: "REQ-190 AC-4: at most 2,000 items per member (the household at most 2,000 per member); REQ-197: the passphrase key also depends on a pepper held outside the database, and the most common passphrases are refused; REQ-198: each household's records carry a code under a key held outside the database, checked at every read and written at every change; REQ-193 AC-3: the console only with an approved request's reference, recorded", recommendation: true}
      - {id: D2, change: "REQ-199: request identifiers members see are random-looking, household-specific, and not sequential (derived from the request number under a server key, so stored formats and core don't change)", recommendation: true}
      - {id: D3, change: "DESIGN-002 covers the hosted form: members sign access-state changes, so neither the database nor the server can forge an agreement; rollback detected per member", recommendation: true}
    decision_requested_of: ACT-001
    provenance: {source: "ACT-001 question, 2026-10-01: What's recommended to mitigate all findings", created_by: ACT-002, authority: proposal_only, inputs: [project/assurance/security-review/ASSESS-002-implementation-assessment.md, project/assurance/security-review/ASSESS-002-findings.json], created_at: 2026-10-01}
