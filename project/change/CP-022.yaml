version: 1
artifacts:
  - id: CP-022
    type: Change
    kind: ChangeProposal
    state: proposed
    title: Give REQ-191 (and REQ-188, REQ-190) a justification path to the Subject
    addresses: [DEF-063, REQ-191, REQ-188, REQ-190]
    context: >
      REQ-188, REQ-190, and REQ-191 were accepted (REV-095) derived only from CTX-001. Trace needs every
      ImplementationElement to reach the Subject through what it satisfies; IE-211 satisfies only REQ-191 and so
      fails (DEF-063), which blocks WI-077's required checks and the release WI-078 would prepare.
    impact_analysis: >
      Adding a derived_from relationship changes no Requirement's statement or acceptance criteria; it records why
      the Requirement exists. REQ-191 would reach the Subject through PRI-003 -> PUR-001. No Claim or
      implementation changes. Until decided, trace fails and the release can't pass its checks.
    options:
      - {id: A, change: "derive REQ-191 from PRI-003 (delegation chosen and revocable: the audit of operator access and of each member's security events is what keeps the delegation to the operator accountable, as REQ-180 discloses it); derive REQ-190 from PRI-003 too (limits protect a member's account from others acting as them); derive REQ-188 from CAP-001..CAP-013's Requirements' own paths by relating it to PRI-003 as well (the hosted form preserves the same agency the local form does)", recommendation: true}
      - {id: B, change: "derive REQ-191 only, from PRI-003, and leave REQ-188 and REQ-190 as they are (they pass trace through IE-210 today)"}
    provenance: {source: WI-077, created_by: ACT-002, authority: proposal_only, inputs: [project/assurance/defeaters.yaml, project/realization/requirements-hosted.yaml], created_at: 2026-09-30}
