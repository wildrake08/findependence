  - id: CP-026
    type: Change
    kind: ChangeProposal
    state: accepted
    decision: {review: REV-108, choice: "No email: account number"}
    title: Sign in with an account number instead of an email address
    addresses: [DEF-069, REQ-181, REQ-184, REQ-190, REQ-191]
    context: >
      ASSESS-001 FND-06: hosted sign-up told anyone whether an email address had an account. With no email channel
      (by design), sign-up can't answer a taken address the same as a new one. WI-080 left this as a gap.
    impact_analysis: >
      REQ-181's statement and AC-1, AC-2, REQ-184's statement and AC-2, REQ-190's statement and AC-1, and REQ-191's
      AC-2 name an account number in place of an email address. Members keep their account number with their
      recovery key; their household page shows it while signed in. Existing hosted accounts (development data only;
      the hosted form is not in service) are removed by the migration. No Claim covers these Requirements.
    options:
      - {id: A, change: "account number in place of email (chosen)"}
      - {id: B, change: "sign-up only with an invitation or operator-issued code"}
      - {id: C, change: "accept and record the residual"}
    provenance: {source: REV-108, created_by: ACT-002, authority: "REV-108", inputs: [project/realization/requirements-hosted.yaml], created_at: 2026-10-01}
