version: 1
artifacts:
  - id: CP-002
    type: Change
    kind: ChangeProposal
    state: proposed
    title: Authority policy for semantic levels below Purpose
    addresses: DEF-018
    options:
      A_conservative: >
        ACT-001 accepts (proposed -> coherent -> specified) and canonicalizes every Outcome,
        Capability, Function, Mechanism, and Requirement individually. AI authority is unchanged.
      B_delegated_below_capability: >
        ACT-001 accepts and canonicalizes Outcomes and Capabilities. ACT-002 may advance Functions,
        Mechanisms, and Requirements to specified (Requirements recorded as accepted) when their parent
        is specified or canonical and check and trace pass, and must record each transition with
        history and authority CP-002. Canonicalization of Function and Mechanism stays with ACT-001;
        Requirement canonicalization follows the framework's deterministic gate.
    recommendation: B, because it keeps human authority over what matters to the Subject (Outcomes, Capabilities) and puts derivation under deterministic checks.
    proposed_diff: |
      automation/policies/authority.yaml, policies (option B):
      +  Outcome:    {propose: {ai: allow, human: allow}, specify: {ai: deny, human: allow}, canonicalize: {ai: deny, human: ratification_required}}
      +  Capability: {propose: {ai: allow, human: allow}, specify: {ai: deny, human: allow}, canonicalize: {ai: deny, human: ratification_required}}
      +  Function:   {propose: {ai: allow, human: allow}, specify: {ai: {condition: parent_specified_and_check_trace_pass}, human: allow}, canonicalize: {ai: deny, human: ratification_required}}
      +  Mechanism:  {propose: {ai: allow, human: allow}, specify: {ai: {condition: parent_specified_and_check_trace_pass}, human: allow}, canonicalize: {ai: deny, human: ratification_required}}
      ~  Requirement: add accept: {ai: {condition: parent_specified_and_check_trace_pass}, human: allow}
    impact_analysis: >
      Option B expands ACT-002's authority, so under GOVERNANCE.md#Self-amendment it needs ACT-001's
      approval. I-012 would then cover Outcome and Capability canonicalization. It changes no existing
      artifact. Option A changes no policy.
    authority_required: ACT-001 (governance policy change; expansion of automation authority)
    justification: "GOVERNANCE.md#Self-amendment; GOVERNANCE.md#AI-agent implementation authority"
    provenance: {source: DEF-018, created_by: ACT-002, authority: proposal_only, inputs: [GOVERNANCE.md, automation/policies/authority.yaml], created_at: 2026-09-25}
