    name: wi_073_hosted_foundation
    enacted_at: 2026-09-29
    actor: ACT-002
    authority: "REV-097, REV-098 (ACT-001)"
    impact_analysis: >
      WI-073 builds the hosted form's foundation on PostgreSQL (IE-207): accounts with the address kept only as a
      keyed hash, the private key wrapped by the passphrase and by a recovery key shown once, sessions holding keys
      only in server memory, households and one-time invitation codes, database-backed tenancy, attempt limits,
      and content-free audit records, with Petal pages under the shared design language. REQ-180, REQ-181, and
      REQ-182 are satisfied by IE-207; REQ-183..REQ-186, REQ-190, and REQ-191 keep outstanding dispositions naming
      the criteria left for WI-074; REQ-187..REQ-189's reasons are corrected to name WI-074 (they named WI-072).
      The hosted egress test resolves DEF-057 (TEST-RUN-019). DEF-060 asks ACT-001 how REQ-191 AC-2's "telemetry
      event" is meant. Four defects found during the work are fixed, including request parameters and query
      parameters in the development log. No Claim is created or changed; the local-first form is unchanged.
