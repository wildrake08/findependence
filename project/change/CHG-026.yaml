version: 1
artifacts:
  - id: CHG-026
    type: ChangeEvent
    name: security_review_package_and_self_review_fixes
    enacted_at: 2026-09-26
    actor: ACT-002
    authority: "ACT-001 request; bootstrap.yaml autonomy[bounded_implementation_repair]"
    impact_analysis: >
      WI-020 self-review found that the plaintext access state is unauthenticated (F-01): an edited file
      could make an honest owner's save seal keys to an attacker. This was confirmed by test, then
      mitigated (keys go only to readers the session added, plus detection and a UI warning). Also:
      public-key pinning (F-02), file mode 0600 (F-06), and a crash-dump warning (F-07). IE-202, IE-203,
      and IE-205 changed. DEF-028 is opened for the F-01 residual. The security-review package is added
      under project/assurance/security-review/. The participant information sheet gains a placeholder
      pending the review. Vaults made before this change (including ACT-001's demo.vault) have no pins.
      DEF-026 remains open.
    created: [WI-020, DEF-028]
    modified: [IE-202, IE-203, IE-205, project/assurance/plans/study-001-materials/1-information-sheet.md, project/manifest.yaml]
    provenance: {source: WI-020, created_by: ACT-002, authority: "bootstrap.yaml autonomy", inputs: [project/lifecycle/WI-020.yaml], created_at: 2026-09-26}
