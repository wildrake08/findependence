artifacts:
  - id: CHG-084
    type: ChangeEvent
    name: wi_065_dp_001_drafted
    enacted_at: 2026-09-29
    actor: ACT-002
    authority: "REV-084 (ACT-001)"
    impact_analysis: >
      WI-065 (CP-020 U2) drafts DP-001, Findependence's domain profile under ARCH-003 37, for ACT-001's
      ratification: vocabulary; seven domain contexts (Households, Items, Values, Balances, Cash flow,
      Planning, Portability) over core/'s modules, with Identity and Tenancy as the only platform contexts;
      canonical state per form; the invariants, transitions, and calculations already fixed by specified
      Requirements; domain authorization (no roles, no household administrator, the operator not a domain
      actor, delegation only as PRI-003 allows); privacy data classes and DEF-056's design as REV-083 D5
      decided; content-free platform audit; the local-first exception (REV-083 D2); assurance evidence; and
      open items. Of ARCH-002's candidate names, Identity and Households are adopted, Ledger is part of Items,
      and Budgets and Institutions are excluded until a ratified Requirement supports them. DP-001 is a draft:
      it changes no Requirement and is not in force until ratified; DEF-056 stays open until then.
    created: [REV-084, WI-065, project/assurance/design/DP-001-domain-profile.md]
    modified: [project/assurance/design/README.md, project/manifest.yaml]
    provenance: {source: WI-065, created_by: ACT-002, authority: "REV-084", inputs: [project/lifecycle/WI-065.yaml, project/assurance/design/DP-001-domain-profile.md], created_at: 2026-09-29}
