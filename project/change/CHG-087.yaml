    impact_analysis: >
      WI-066 (CP-020 U3) gives today's domain its public context API (ARCH-003 4, 5, 8, 34): Scope, the
      failure categories, the local form's persistence coordination (Operation, over Store), the platform
      context Identity, and the seven domain contexts DP-001 names. The local-first router's writes and the
      rendering layer's reads go only through them, enforced by test/boundary_test.exs; the add-item, name, and
      plan-step rules move out of the router; Money's limits come from core's Import. Behaviour is unchanged
      (TEST-RUN-016: suites unedited, 69 of 69 pages identical, e2e 54/54). REV-087 records the read-scope
      interpretation. DEF-058 records the field rules still in the router. IE-205 and IE-109 carry change
      notes and need re-verification by the next release's gate. No Requirement or Claim changes.
