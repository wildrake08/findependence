version: 1
artifacts:
  - id: CHG-079
    type: ChangeEvent
    name: arch_002_target_structure
    enacted_at: 2026-09-29
    actor: ACT-002
    authority: "REV-081 (ACT-001)"
    impact_analysis: >
      Records ARCH-002, ACT-001's reference structure for the target application, and REV-081. No
      Requirement, Claim, or code changes, and nothing is built from it yet. What ARCH-002 settles: one entry
      boundary (the public contexts) for LiveView, the JSON API, Alexa, and webhooks, so no client has its own
      path to the domain; one Repo and transaction per operation; Oban jobs written in the same transaction as
      the state they follow from; PubSub only after commit. What it leaves open (REV-081): the trust model,
      the local-first interface, the new external parties, whether the twelve contracts are acceptance
      criteria, and where per-member encryption sits (DEF-056). Not shown in ARCH-002, and needed for the
      twelve contracts: how API clients and Alexa authenticate (tokens, account linking) beside LiveView
      sessions under one identity contract; a domain-event model (Ledger's ownership events are the only
      events today) and where projections are computed; audit events (ARCH-001 9.9); and how core/, a pure
      domain library with no Ecto, relates to the diagram's schemas, changesets, and queries.
      Numbering: WI-062's branch also used CHG-075 and UI-RUN-010 for its own records; they will be
      renumbered there so this branch's IDs stand.
    created: [REV-081, project/assurance/design/ARCH-002-target-structure.md]
    modified: [project/assurance/design/README.md, project/manifest.yaml]
    provenance: {source: REV-081, created_by: ACT-002, authority: "REV-081", inputs: [project/governance/REV-081.yaml], created_at: 2026-09-29}
