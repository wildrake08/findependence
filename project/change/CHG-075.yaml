artifacts:
  - id: CHG-075
    type: ChangeEvent
    name: arch_001_hosted_edition
    enacted_at: 2026-09-28
    actor: ACT-002
    authority: "REV-078 (ACT-001)"
    impact_analysis: >
      ACT-001 supplied ARCH-001, a reference architecture for a secure SaaS application on Phoenix, LiveView,
      Petal Components, and PostgreSQL, and chose to record it, propose its stack-independent parts as
      Requirements, and adopt it as the target now (REV-078). ARCH-001 is stored unedited. CP-019 adopts it
      for a hosted edition beside the local-first interface, maps it onto the project, and drafts the
      restatements of REQ-124 (an egress allowlist), SYS-001, and CTX-001 for ACT-001's ratification; none of
      those three is changed here. CP-018 is accepted with option B (trusted operator). DEF-056 records that
      ARCH-001 does not cover per-member encryption inside a household (REQ-121, PRI-002). REQ-175..REQ-179
      are proposed for the local-first interface. WI-063 (the hosted app's skeleton) is drafted for approval.
      WI-062 continues unchanged. No code, specified Requirement, or Claim changes.
    created: [REV-078, CP-019, DEF-056, REQ-175, REQ-176, REQ-177, REQ-178, REQ-179, WI-063, project/assurance/design/ARCH-001-reference-architecture.md]
    modified: [CP-018, project/manifest.yaml, project/assurance/design/README.md]
    provenance: {source: REV-078, created_by: ACT-002, authority: "REV-078", inputs: [project/assurance/design/ARCH-001-reference-architecture.md, project/change/CP-018.yaml], created_at: 2026-09-28}
