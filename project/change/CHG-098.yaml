  - id: CHG-098
    type: ChangeEvent
    name: wi_074_hosted_domain_storage
    enacted_at: 2026-09-29
    actor: ACT-002
    authority: "REV-099 (ACT-001)"
    impact_analysis: >
      WI-074 moves the sealing code both forms need into shared/ (FindependenceShared.Envelope, G2) without changing
      the local form, and builds the hosted form's domain storage on PostgreSQL (IE-208): the same sealed pieces as
      the vault, as rows tied to their household by constraint, with a persistence that locks the household for
      each operation (G5) and pins members' public keys (G4). Leaving and account deletion are added. One contract
      suite runs every shared context against both forms (CT-001). REQ-183..REQ-187 and REQ-189 are satisfied;
      REQ-188, REQ-190, and REQ-191 keep outstanding dispositions for WI-075. DEF-061 (REQ-150 AC-9, both forms) is
      raised for ACT-001 and bears on CLM-038's claim on REQ-150, which is not changed here; DEF-062 (messages lost
      with the session, a WI-073 defect) is resolved and WI-073's record carries a correction. G3 was not needed;
      core/ is unchanged.
