    impact_analysis: >
      CP-014 A enacted: a member says, privately, which cash account an item they can see goes through
      (MEC-023, REQ-160), and the running balance and the next twelve months count attached items and the
      member's own unattached items. REQ-138 and REQ-141 are superseded by REQ-161 and REQ-162, which
      restate them with that rule (ACT-001, REV-047). Realized in core (IE-110, with changes to IE-106 and
      IE-107) and the app (IE-202, IE-205), re-verified by GATE-031 on REPRO-RUN-011. CP-015 A is accepted
      to be built after the independent security review; REQ-163 stays proposed, and item pages say how
      to record a new amount meanwhile. UX-002 J1's outcome failure is resolved for households that share
      what goes through a joint account; others are told whose items aren't counted. CLM-027 and CLM-028
      remain the Claims for the released code at b82bb1f; the next release's Claims will cover these
      changes.
