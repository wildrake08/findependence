    authority: "REV-032 (ACT-001)"
    impact_analysis: >
      CP-012: items can recur every two months, every three months, twice a year, or irregularly (the
      amount being a yearly total), alongside the earlier choices. Every recurring frequency is stored as an
      interval, so a free 'every N' needs no data conversion later. REQ-128 and REQ-129 supersede REQ-126
      and REQ-127; items stored earlier read as the same intervals. The vault's permitted atoms now come
      from core. Found while checking: the JSON export could not encode intervals; fixed. The researcher
      checklist notes items participants couldn't enter. IE-105, IE-202, and IE-205 changed and re-verified
      (GATE-024).
    created: [REV-032, CP-012, REQ-128, REQ-129, WI-033, GATE-024]
