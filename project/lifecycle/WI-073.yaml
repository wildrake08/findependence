version: 1
artifacts:
  - id: WI-073
    type: WorkItem
    name: hosted_foundation
    status: proposed
    objective: >
      CP-020 U4 step 2 of 3 (REV-096): the hosted form's foundation on PostgreSQL and Ecto, meeting REQ-180..REQ-186
      and REQ-190, REQ-191 for everything but the domain data (which is WI-074's): the disclosure before sign-up;
      accounts, sign-in, and sign-out; key material wrapped by the passphrase and by a recovery key shown once
      (shared/'s Crypto, REQ-118's derivation); sessions holding keys only in server memory, with the idle sweep
      and revocation on a passphrase change or leaving; recovery with the recovery key only (REQ-184 AC-4);
      households and one-time invitation codes; tenancy carried by server state and backed by database constraints;
      limits on sign-in, recovery, and invitations; and content-free audit records. Pages are LiveView with Petal
      under the shared design language (WI-070). The runtime egress test is extended to the hosted form, whose
      allowlist is empty, closing DEF-057.
    target_requirements: [REQ-180, REQ-181, REQ-182, REQ-183, REQ-184, REQ-185, REQ-186, REQ-190, REQ-191, REQ-124]
    addresses: [CP-020, DEF-057]
    authority: "pending ACT-001's approval of this draft (REV-096)"
    authority_scope:
      may_modify_upstream_semantics: false
      excludes: [app/**, core/**, automation/**, framework/**]
      may_not: ["store a passphrase, a recovery key, an unwrapped key, or an email address in a log, an audit record, or telemetry", "make an outbound connection or add a destination to an egress allowlist", "add a dependency other than ecto_sql and postgrex (ARCH-001 1.2's stack); limits and sessions use OTP and the database", "store item content, readings, or private records (WI-074)", "deploy, or bind to anything but the loopback address", "merge into main or release"]
    decisions_for_act_001:
      - {id: F1, question: "A member's identity inside the domain rules", recommendation: "an opaque identifier per membership, not the person's name or email; each member chooses a display name when they create or join a household, unique within it, and pages show that name"}
      - {id: F2, question: "How email addresses are stored", recommendation: "as a keyed hash (HMAC-SHA256 with a server secret from the runtime configuration) for sign-in and recovery lookups, so a copy of the database does not reveal who has an account; the address itself is not kept"}
    retires: "hosted/test/findependence_hosted/no_persistence_test.exs, whose purpose (REV-080: no Repo until DEF-056's design) is met by DP-001's ratification (REV-085)"
    environment_note: "PostgreSQL 17 already runs as the dev container's compose service db (reachable, 17.11), which meets REV-094 H5 without a container change"
    branch: findependence/wi-073-hosted-foundation (from findependence/wi-072-shared-layer at a7de7f6)
    canonical_inputs:
      - {path: project/realization/requirements-hosted.yaml, sha256: 1e034a554e9d8db9e131f848492de96fda7d5dd0f4c716eb6bf762953177f41d}
      - {path: shared/lib/findependence_shared/crypto.ex, sha256: efc37db9b089eb37fd2da292ecad60af67485f012c61700c6f6363b963e6b722}
    allowed_files: [hosted/**, app/test/egress_test.exs, project/**]
    postconditions:
      - "Each acceptance criterion of REQ-180..REQ-186, REQ-190, and REQ-191 that does not need domain data has a test that asserts it, run against PostgreSQL; the others are listed for WI-074"
      - "Database inspection tests find no passphrase, recovery key, unwrapped key, or email address in any table, and the tenancy constraint refuses a row joining two households"
      - "The hosted gate passes (hex.audit, format, compile --warnings-as-errors, tests, sobelow), with the production build; the new pages pass axe-core with 0 violations, geometry, and a Tab walk with focus at least 3:1, at 1200 and 390 px, in both themes"
      - "The runtime egress test covers the hosted form with an empty allowlist and reports planted calls; DEF-057 resolved"
      - "The local-first form is untouched: its suites and pagecompare unchanged; check and trace pass"
    required_checks: [tests, check, trace]
    provenance: {source: REV-096, created_by: ACT-002, authority: proposal_only, inputs: [project/realization/requirements-hosted.yaml, project/lifecycle/WI-072.yaml], created_at: 2026-09-29}
