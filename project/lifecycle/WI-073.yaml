version: 1
artifacts:
  - id: WI-073
    type: WorkItem
    name: hosted_foundation
    status: completed
    completed_at: 2026-09-29
    objective: >
      CP-020 U4 step 2 of 3 (REV-096): the hosted form's foundation on PostgreSQL and Ecto, meeting REQ-180..REQ-186
      and REQ-190, REQ-191 for everything but the domain data (which is WI-074's): the disclosure before sign-up;
      accounts, sign-in, and sign-out; key material wrapped by the passphrase and by a recovery key shown once
      (shared/'s Crypto, REQ-118's derivation); sessions holding keys only in server memory, with the idle sweep
      and revocation on a passphrase change or leaving; recovery with the recovery key only (REQ-184 AC-4);
      households and one-time invitation codes; tenancy carried by server state and backed by database constraints;
      limits on sign-in, recovery, and invitations; and content-free audit records. Pages are LiveView with Petal
      under the shared design language (WI-070). The runtime egress test is extended to the hosted form, whose
      allowlist holds only its own database (REV-098), closing DEF-057.
    target_requirements: [REQ-180, REQ-181, REQ-182, REQ-183, REQ-184, REQ-185, REQ-186, REQ-190, REQ-191, REQ-124]
    addresses: [CP-020, DEF-057]
    authority: "REV-097 and REV-098 (ACT-001), under REV-096"
    authority_scope:
      may_modify_upstream_semantics: false
      excludes: [app/**, core/**, automation/**, framework/**]
      may_not: ["store a passphrase, a recovery key, an unwrapped key, or an email address in a log, an audit record, or telemetry", "make an outbound connection other than to the deployment's database, or add any other destination to an egress allowlist (REV-098)", "add a dependency other than ecto_sql and postgrex (ARCH-001 1.2's stack); limits and sessions use OTP and the database", "store item content, readings, or private records (WI-074)", "deploy, or bind to anything but the loopback address", "merge into main or release"]
    decisions_for_act_001:
      - {id: F1, question: "A member's identity inside the domain rules", recommendation: "an opaque identifier per membership, not the person's name or email; each member chooses a display name when they create or join a household, unique within it, and pages show that name"}
      - {id: F2, question: "How email addresses are stored", recommendation: "as a keyed hash (HMAC-SHA256 with a server secret from the runtime configuration) for sign-in and recovery lookups, so a copy of the database does not reveal who has an account; the address itself is not kept"}
    retires: "hosted/test/findependence_hosted/no_persistence_test.exs, whose purpose (REV-080: no Repo until DEF-056's design) is met by DP-001's ratification (REV-085)"
    environment_note: "PostgreSQL 17 already runs as the dev container's compose service db (reachable, 17.11), which meets REV-094 H5 without a container change"
    branch: findependence/wi-073-hosted-foundation (from findependence/wi-072-shared-layer at a7de7f6)
    canonical_inputs:
      - {path: project/realization/requirements-hosted.yaml, sha256: f8268c943b8edc51c5185c6ac4d4807352168f2b5e9f13655737703ead2ba5a1, note: "re-pinned after REV-098 corrected REQ-185 AC-4 and the header (was 1e034a55)"}
      - {path: shared/lib/findependence_shared/crypto.ex, sha256: efc37db9b089eb37fd2da292ecad60af67485f012c61700c6f6363b963e6b722}
    allowed_files: [hosted/**, app/test/egress_test.exs, project/**]
    postconditions:
      - "Each acceptance criterion of REQ-180..REQ-186, REQ-190, and REQ-191 that does not need domain data has a test that asserts it, run against PostgreSQL; the others are listed for WI-074"
      - "Database inspection tests find no passphrase, recovery key, unwrapped key, or email address in any table, and the tenancy constraint refuses a row joining two households"
      - "The hosted gate passes (hex.audit, format, compile --warnings-as-errors, tests, sobelow), with the production build; the new pages pass axe-core with 0 violations, geometry, and a Tab walk with focus at least 3:1, at 1200 and 390 px, in both themes"
      - "The runtime egress test covers the hosted form: every connect and name lookup goes to the configured database's host and port and nowhere else, and planted calls are reported; DEF-057 resolved"
      - "The local-first form is untouched: its suites and pagecompare unchanged; check and trace pass"
    required_checks: [tests, check, trace]
    postcondition_results:
      - {postcondition: "Each acceptance criterion of REQ-180..REQ-186, REQ-190, and REQ-191 that does not need domain data has a test that asserts it, run against PostgreSQL; the others are listed for WI-074", result: met, evidence: TEST-RUN-019, note: "32 tests in foundation_test.exs, one describe per Requirement; REQ-180, REQ-181, REQ-182 satisfied in full (IE-207); the criteria left for WI-074 are in for_wi_074 and in each Requirement's disposition"}
      - {postcondition: "Database inspection tests find no passphrase, recovery key, unwrapped key, or email address in any table, and the tenancy constraint refuses a row joining two households", result: met, evidence: TEST-RUN-019, note: "every value of every table, after sign-up, sign-in, a change, and a recovery; the codes are also found only hashed; invitations_creator_in_household refuses a raw insert"}
      - {postcondition: "The hosted gate passes (hex.audit, format, compile --warnings-as-errors, tests, sobelow), with the production build; the new pages pass axe-core with 0 violations, geometry, and a Tab walk with focus at least 3:1, at 1200 and 390 px, in both themes", result: met, evidence: "TEST-RUN-019, UI-RUN-013", note: "48 tests; 14 pages: axe 0 violations and 0 needing review, geometry 0 failures, focus at least 15.02:1; two axe findings fixed (heading order, a prohibited aria-label)"}
      - {postcondition: "The runtime egress test covers the hosted form: every connect and name lookup goes to the configured database's host and port and nowhere else, and planted calls are reported; DEF-057 resolved", result: met, evidence: TEST-RUN-019, note: "all 17 routes, a fresh database connection inside the trace, and loopback HTTP; DEF-057 resolved; REQ-124 is not claimed for the hosted form, whose export and bring-in come with WI-074"}
      - {postcondition: "The local-first form is untouched: its suites and pagecompare unchanged; check and trace pass", result: met, evidence: TEST-RUN-019, note: "no file under app/, core/, shared/, or design/ differs from a7de7f6 (TEST-RUN-018's pagecompare); core 200, app 348, shared 6 passed; check and trace as run for CHG-096"}
    findings:
      - "Limits counted failures in an ETS bag, which merges identical rows: failures in the same millisecond counted once. Fixed (duplicate_bag) and tested"
      - "Field errors were hidden when a refused form did not send the field back (Petal shows errors only for submitted fields). Fixed"
      - "Phoenix's default parameter filter covers only password, and Ecto logs query parameters: in development the log held addresses, passphrases, recovery keys, codes, and names. Fixed for every environment; the log test, which had passed without testing this, now runs at debug and failed before the fix"
      - "An ended session wrote no audit record. Fixed in Sessions"
      - "DEF-060 raised: REQ-191 AC-2's 'telemetry event', read literally, cannot be met by Phoenix and Ecto, whose events carry the request in memory; ACT-001 decides the reading"
    for_wi_074: ["REQ-183 AC-2 for leaving", "REQ-184 AC-2: every item, reading, and private record readable after recovery", "REQ-185 AC-3: a new member reads nothing unshared", "REQ-186 AC-1 for items, readings, proposals, plans, and members; AC-2 for the domain tables", "REQ-190 AC-3: uploads at most 1 MB", "REQ-191 AC-1: export, bring-in, leaving, account deletion (operator access: deployment)", "REQ-187, REQ-188, REQ-189", "the hosted egress test's routes and REQ-124 for the hosted form", "MEC-013's personal symmetric key; MEC-014"]
    evidence_candidates: "TEST-RUN-019 and UI-RUN-013: the hosted form's foundation (REQ-180..REQ-182 in full; REQ-183..REQ-186, REQ-190, REQ-191 in part) and its egress bounded to its own database"
    provenance: {source: REV-096, created_by: ACT-002, authority: proposal_only, inputs: [project/realization/requirements-hosted.yaml, project/lifecycle/WI-072.yaml], created_at: 2026-09-29}
