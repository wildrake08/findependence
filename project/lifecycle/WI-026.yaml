version: 1
artifacts:
  - id: WI-026
    type: WorkItem
    name: f16_stale_write_detection
    status: completed
    completed_at: 2026-09-26
    postcondition_results:
      - {postcondition: "two stores", result: met, note: "both directions tested: the second copy's change is refused with :file_changed, the file keeps the first copy's change, the refused session already shows it, and a retry keeps both"}
      - {postcondition: "reads", result: met, note: "Store.vault and page GETs reload when the fingerprint differs; tested through the Store and over HTTP"}
      - {postcondition: "temp files", result: met, note: "random temporary names; 20 simultaneous writers all succeed and leave no temporary files; mode stays 0600"}
      - {postcondition: "tests and review", result: met, note: "108 app tests pass; SELF-REVIEW F-16 updated, with the remaining check-then-rename window stated"}
    mutations: 'all 5 detected once two tests were added (no change detection; own write not remembered; reads not synced; refused session not refreshed; shared temporary name). The first run missed the second and fifth; the added tests for consecutive writes and simultaneous writers catch them'
    objective: >
      Close security self-review F-16 (two servers on one file: last writer wins). The Store keeps a
      fingerprint of the file it last read or wrote; before every change it compares the file on disk,
      and if another process changed it, the change is refused (nothing saved), the Store reloads, and
      the member sees the latest version and can retry. Reads also pick up outside changes. Temporary
      files get unique names so two writers can't collide on them.
    target_requirements: [REQ-123]
    target_note: "Data-integrity repair in IE-204 (store) and IE-202 (vault write); no Requirement, core, or crypto change. Authority: REV-022 continue; bootstrap.yaml autonomy[bounded_implementation_repair]."
    authority: "REV-022 (ACT-001); bootstrap.yaml autonomy[bounded_implementation_repair]"
    authority_scope: {may_modify_upstream_semantics: false, excludes: [core/**, automation/**, framework/**, "app/lib/findependence_app/{crypto,session}.ex"]}
    canonical_inputs:
      - {path: project/assurance/security-review/SELF-REVIEW.md, sha256: 440b4bb055f47b4756443b3041f968ff0ead0b1eeb9c9bd152c561c6631ca3de}
      - {path: project/realization/requirements-prototype.yaml, sha256: a745d9367f9d5ddf9142122272a491eb79b24d28a1ee2920dc4d0f9c5a510fdf}
    allowed_files: [app/lib/findependence_app/store.ex, app/lib/findependence_app/vault.ex, app/lib/findependence_app/web.ex, app/lib/findependence_app/web/**, app/test/**, project/**]
    postconditions:
      - "Two Stores on one file: a change made through the second after the first wrote is refused with a plain message, nothing is lost, the file keeps the first change, and a retry succeeds with both"
      - "A Store serving pages picks up a change written by another process"
      - "Unique temporary file names; the file stays mode 0600"
      - "All existing tests pass; F-16 status updated in SELF-REVIEW with what remains (a narrow check-then-rename window)"
    required_checks: [tests, check, trace]
    provenance: {source: REV-022, created_by: ACT-002, authority: "REV-022", inputs: [project/assurance/security-review/SELF-REVIEW.md], created_at: 2026-09-26}
