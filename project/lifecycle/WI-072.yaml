version: 1
artifacts:
  - id: WI-072
    type: WorkItem
    name: shared_application_layer
    status: proposed
    objective: >
      CP-020 U4, second half, step 1 of 3 (REV-095): move the layer both forms must share out of app/, so the
      hosted form reuses it rather than copying it (REV-083 D2; ARCH-003 5 and 41: one semantic implementation
      per capability, one definition per rule). A new Mix project, shared/ (application findependence_shared),
      depending on core/ only, takes from app/: Scope, Failure, the Identity-independent domain contexts
      (Households, Items, Values, Balances, CashFlow, Planning, Portability), and Crypto (key derivation,
      AEAD, X25519 sealing). The contexts reach canonical state through a behaviour, FindependenceShared.Persistence,
      with run/2, refresh/1, and new_id/0; the local-first form's Operation (over Store) becomes its first
      implementation, and the hosted form's Ecto implementation comes in WI-074. app/ depends on shared/ and
      keeps its router, rendering, Store, Sessions, Session, Vault, Money's decoding, and Identity (the local
      unlock). No behaviour changes.
    target_requirements: [REQ-188]
    addresses: [CP-020, REQ-188]
    authority: "pending ACT-001's approval of this draft (REV-095)"
    authority_scope:
      may_modify_upstream_semantics: false
      excludes: [hosted/**, automation/**, framework/**]
      may_not: ["change behaviour, pages, messages, or the vault format", "edit an existing test's assertions; a test may change only its module names or aliases where the module it uses moved", "add a dependency to any form other than the new path dependency on shared/", "merge into main or release"]
    later_steps:
      - "WI-073: the hosted form's foundation on PostgreSQL and Ecto: accounts, disclosure, sign-in, key material, sessions, recovery, households and invitations, tenancy constraints, limits, and audit (REQ-180..REQ-186, REQ-190, REQ-191), using shared/'s Crypto; retires hosted/test/findependence_hosted/no_persistence_test.exs, whose purpose (REV-080: until DEF-056's design) is met; adds PostgreSQL to the dev container (REV-094 H5)"
      - "WI-074: the hosted form's domain operations and storage: shared/'s contexts over an Ecto implementation of Persistence with DP-001 8.2's encryption, contract tests run against both forms, the hosted pages, leaving and account deletion (REQ-187..REQ-189)"
    design_notes:
      - "The Persistence behaviour is justified by two concrete forms (REV-083 D2), not symmetry (ARCH-003 36); it has three callbacks and no generic repository functions"
      - "Identity stays per form: the local unlock and the hosted accounts differ (REQ-181..REQ-184)"
      - "Module names move from FindependenceApp.* to FindependenceShared.*; the boundary test and the design-token test keep working, with the allowed module list updated"
    branch: findependence/wi-072-shared-layer (from findependence/wi-071-hosted-requirements)
    canonical_inputs:
      - {path: project/realization/requirements-hosted.yaml, sha256: 1e034a554e9d8db9e131f848492de96fda7d5dd0f4c716eb6bf762953177f41d}
      - {path: project/governance/REV-083.yaml, sha256: ec813ded7af039b9bd37084b5e801fbccb242e32efbb0dc8148e48eaa4e7ef77}
      - {path: project/assurance/design/DP-001-domain-profile.md, sha256: 9f72d8dc6417a28a2625218dedb086a051cd32f645c372a8822b045b1fd229d4}
    allowed_files: [shared/**, app/**, project/**]
    postconditions:
      - "shared/ holds Scope, Failure, the seven domain contexts, Crypto, and the Persistence behaviour; it depends on core/ only, and its own tests pass"
      - "app/ uses them from shared/ through its Operation implementation; the boundary test holds"
      - "Behaviour unchanged: the app and core suites pass with no assertion edited; pagecompare shows every captured page identical (69 of 69 and 32 of 32); the e2e driver passes 54 of 54; the egress test passes"
      - "check and trace pass; implementation elements list the moved files"
    required_checks: [tests, check, trace]
    provenance: {source: REV-095, created_by: ACT-002, authority: proposal_only, inputs: [project/realization/requirements-hosted.yaml, project/governance/REV-083.yaml, app/lib/findependence_app/crypto.ex], created_at: 2026-09-29}
