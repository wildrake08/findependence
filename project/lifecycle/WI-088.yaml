    type: WorkItem
    name: cooling_off
    status: in_progress
    objective: >
      CP-030 option A (REV-115): a 72-hour cooling-off for changes that widen another member's access or take an item
      away (grants, owner changes including giving away, sole-owner deletions), from the moment every current owner
      has agreed; nothing disclosed or sealed before it ends; cancellable alone by the member whose agreement it rests
      on; protective changes immediate, and leaving never delayed. In core and both forms, with the waiting words and
      a way to cancel on every page. Each part with a test that fails without it.
    target_requirements: [REQ-201, REQ-202, REQ-103, REQ-107, REQ-108, REQ-115]
    addresses: [DEF-016, CP-030]
    authority: "REV-115 (ACT-001)"
    authority_scope:
