version: 1
artifacts:
  - id: WI-051
    type: WorkItem
    name: ux_005_state_visibility
    status: proposed
    start_condition: "ACT-001's go-ahead (REV-060 build_now); not started before it"
    objective: >
      UX-005 S1 and S2, presentation only. S1: a forced-colours rule block that draws each state with a
      border, the property forced colours keep: invalid controls, result messages, the "Below zero" pill,
      the waiting badge, the attention card, and the primary button against the outline one. S2: the
      "Waiting for you" card's indicator at 3:1 or more against the card and the page ground, and heavier
      than ordinary card borders.
    target_requirements: []
    addresses: [UX-005 V1, UX-005 V2]
    authority: "REV-060 (ACT-001), an exception to REV-056's order; UX-005; CP-004 option B for evidence"
    authority_scope: {may_modify_upstream_semantics: false, excludes: [core/**, automation/**, framework/**]}
    canonical_inputs:
      - {path: project/assurance/analysis/UX-005-visual-language-assessment.html, sha256: 6c737b849ab41bf0aab5d36d074a54e3591d6aacc8f152061e49f0e1b83c795e}
    allowed_files: [app/lib/findependence_app/web.ex, app/test/**, project/**]
    postconditions:
      - "Under emulated forced colours, invalid and valid controls differ in border; each .msg, .below, and .badge has a visible border; the attention card's border is at least 3 px; the primary and outline buttons differ (tested by computed style, with deliberate-break checks)"
      - "The attention indicator is at least 3:1 against --card and --bg and at least 2 px wider than other card borders; no page's height changes"
      - "Nothing changes in the default theme except the attention card; geometry.py 0 failures and axe-core 0 violations at 1200 and 390 px; the Tab walk's focus contrast stays at or above 3:1"
      - "One pass in real Windows High Contrast, or recorded as not done"
      - "Check and trace pass"
    required_checks: [tests, check, trace]
    provenance: {source: REV-060, created_by: ACT-002, authority: "REV-060", inputs: [project/assurance/analysis/UX-005-visual-language-assessment.html], created_at: 2026-09-27}
