artifacts:
  - id: WI-065
    type: WorkItem
    name: domain_profile_dp_001
    status: completed
    completed_at: 2026-09-29
    objective: >
      CP-020 U2 (REV-083 D4, REV-084): draft DP-001, Findependence's domain profile under ARCH-003 37, for
      ACT-001's ratification. It defines the domain vocabulary, domain contexts, canonical domain state,
      invariants, transitions, calculations, domain-specific authorization, audit, privacy, and assurance
      evidence, each derived from ratified artifacts (Subject, Telos, Purpose, principles, Capabilities,
      Mechanisms, specified Requirements) and cited by ID. It records the local-first form's architectural
      exception (REV-083 D2), decides ARCH-002's candidate context names (REV-083 D1), and records DEF-056's
      design on the approach and placement REV-083 D5 decided.
    target_requirements: []
    addresses: [CP-020, DEF-056, ARCH-003]
    authority: "REV-084 (ACT-001); REV-083 D1, D2, D4, D5"
    authority_scope:
      may_modify_upstream_semantics: false
      excludes: [app/**, core/**, hosted/**, automation/**, framework/**]
      may_not: ["change, add, or retire a Requirement, Capability, Mechanism, or Principle", "introduce a domain concept that no ratified artifact supports; such concepts are listed as excluded or open", "change code", "merge into main or release"]
    branch: findependence/wi-064-integrate-heads
