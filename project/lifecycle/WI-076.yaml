version: 1
artifacts:
  - id: WI-076
    type: WorkItem
    name: hosted_planning_and_portability_pages
    status: completed
    completed_at: 2026-09-29
    objective: >
      CP-020 U4 step 3, second half, second part (REV-100 H1): the rest of the hosted form's pages, as WI-075 built the
      first: plans and plan requests, shared plans, goals and set-asides, retirement, export and bring-in, and the
      leave page's full checklist, through the shared contexts and words, with page tests for CT-001's last 16 WEB
      criteria. With them the hosted form offers every capability the local form offers (REQ-188), a member's whole
      visit is covered by the egress test (REQ-124 AC-1), bring-in has the 1 MB upload limit (REQ-190 AC-3,
      REQ-157 AC-1), and export and bring-in write their audit records (REQ-191 AC-1). If I1 is approved, it also
      fixes DEF-061 for both forms.
    target_requirements: [REQ-188, REQ-124, REQ-190, REQ-191, REQ-106, REQ-129, REQ-165, REQ-166, REQ-150]
    addresses: [CP-020, DEF-061]
    authority: "REV-103 (ACT-001), under REV-096, REV-100, and REV-102"
    decisions_for_act_001:
      - {id: I1, question: "Where DEF-061's fix (REV-102 (a)) is made", recommendation: "in this WorkItem, which builds the retirement pages the fix concerns: FindependenceShared.Envelope drops, when a view is built, a member's contributions to accounts no longer in the household (as it drops links to items someone else deleted, ASM-018), so they are gone from their record at their next save; the contract case for REQ-150 AC-9 is no longer skipped and passes on both forms. It changes the local form only in that case: its suites, pagecompare, and e2e are run as before, and any page that differs is named. CLM-038's claim on REQ-150 is reassessed (an Assessment) with the new evidence. The alternative is a separate WorkItem before or after this one"}
      - {id: I2, question: "Where a bring-in file waits between its preview and its confirmation (REQ-158)", recommendation: "in server memory with the member's session, as the local form keeps it beside its session: never in the database, a log, or a job; dropped when the member leaves the preview page, signs out, or the session ends; the upload refused over 1 MB before it is read in full (REQ-157 AC-1, REQ-190 AC-3), on that route only, every other body keeping WI-073's 100 kB limit"}
      - {id: I3, question: "How export is offered", recommendation: "as the local form: an export page listing what the member would take with them, and the file (format version 3 with each item's history in words) as a download from the member's own session, never stored; each export and bring-in writes one content-free audit record (REQ-191 AC-1)"}
      - {id: I4, question: "How the work is split", recommendation: "one WorkItem, built as WI-075 was: ACT-002 first adds the routes and anything shared, then page groups in parallel (plans and requests; goals, set-asides, and retirement; export, bring-in, and the leave checklist), each with its page tests, merged and checked by ACT-002"}
    authority_scope:
      may_modify_upstream_semantics: false
      excludes: [core/**, automation/**, framework/**]
      may_not: ["change the local-first form's behaviour, except DEF-061's fix if I1 is approved (its suites pass with no assertion edited but the REQ-150 AC-9 contract case unskipped; pagecompare identical except pages named in the run record as showing that case)", "decide a domain rule, range, or message in the web layer (REQ-188 AC-2)", "store any content, a bring-in file, or an export in a plain column, a log, an audit record, telemetry, or a job", "add a dependency", "make an outbound connection other than to the deployment's database (REV-098)", "deploy, bind to anything but the loopback address, merge into main, or release"]
    branch: "findependence/wi-076-hosted-pages-2 (from findependence/wi-075-hosted-pages at bd66928, which holds this draft)"
    canonical_inputs:
      - {path: project/assurance/analysis/CT-001-contract-coverage.md, sha256: cc843005c45f241e7268b65ed74029a66b1f997a99f00635ff641b9d8ff66810, note: "re-pinned: this WorkItem's WEB criteria and REQ-150 AC-9 added (was 776d2644)"}
      - {path: project/realization/requirements-hosted.yaml, sha256: 9fecb2931d8d2d6ed85b35a772233940eb2cb597e6bf862969f77e7af63cc6b8, note: "re-pinned: REQ-188, REQ-190, REQ-191 dispositions updated by this WorkItem (was 2880790c)"}
      - {path: app/lib/findependence_app/web.ex, sha256: ea14670784a3b5227a0a89e63afe2114d2ba081f0f9cb5c2a18c17d346f0179a, note: "re-pinned: the let-go choice moved to Decode by this WorkItem (was 7e09784e)"}
      - {path: app/lib/findependence_app/web/html.ex, sha256: 88c23e99a821291dd733d4aa22ab7ef1da9fee882c37ba3d7666146b1aa79f3d, note: "re-pinned: the step, retirement, and export words moved to shared/ by this WorkItem (was 18d5c55d)"}
      - {path: shared/lib/findependence_shared/envelope.ex, sha256: bcdc236aed758a9d4cea234a36304608d928dc6c535636ba609f94baff55164f, note: "re-pinned: DEF-061's fix (I1) by this WorkItem (was 40c45601)"}
    allowed_files: [hosted/**, shared/**, app/lib/findependence_app/web/html.ex, app/lib/findependence_app/web.ex, app/test/**, project/**]
    postconditions:
      - "Every remaining page and action exists in the hosted form (plans, plan requests, shared plans, goals, set-asides, retirement, export, bring-in, the leave checklist), reaching the domain only through the shared contexts; the hosted boundary test holds"
      - "Each of CT-001's 16 remaining WEB criteria has a hosted page test named by it; with the contract suite, every criterion of CLM-038's Requirements not excluded as local holds for the hosted form, and REQ-188 is satisfied"
      - "The egress test covers a member's whole visit in the hosted form, export and bring-in included, and finds only the database (REQ-124 AC-1)"
      - "A bring-in file over 1 MB is refused before it is read in full; a waiting file is held only in server memory and dropped as the local form drops it; export and bring-in write their audit records"
      - "If I1: DEF-061 is resolved on both forms, the REQ-150 AC-9 contract case passes on both, and CLM-038's claim on REQ-150 is reassessed"
      - "The local form is otherwise unchanged; the hosted gate passes with the production build; the new pages pass axe-core with 0 violations, geometry, and a Tab walk with focus at least 3:1, at 1200 and 390 px, in both themes; check and trace pass"
    required_checks: [tests, check, trace]
    postcondition_results:
      - {postcondition: "Every remaining page and action exists in the hosted form (plans, plan requests, shared plans, goals, set-asides, retirement, export, bring-in, the leave checklist), reaching the domain only through the shared contexts; the hosted boundary test holds", result: met, evidence: TEST-RUN-022}
      - {postcondition: "Each of CT-001's 16 remaining WEB criteria has a hosted page test named by it; with the contract suite, every criterion of CLM-038's Requirements not excluded as local holds for the hosted form, and REQ-188 is satisfied", result: met, evidence: "TEST-RUN-022, CT-001", note: "56 of 56 WEB and 249 of 249 CORE and PERSIST criteria on the hosted form; REQ-188 realized by IE-210"}
      - {postcondition: "The egress test covers a member's whole visit in the hosted form, export and bring-in included, and finds only the database (REQ-124 AC-1)", result: met, evidence: TEST-RUN-022}
      - {postcondition: "A bring-in file over 1 MB is refused before it is read in full; a waiting file is held only in server memory and dropped as the local form drops it; export and bring-in write their audit records", result: met, evidence: TEST-RUN-022, note: "the dropping plug first ran only on the domain routes, so home and the household page kept the file; fixed and tested"}
      - {postcondition: "If I1: DEF-061 is resolved on both forms, the REQ-150 AC-9 contract case passes on both, and CLM-038's claim on REQ-150 is reassessed", result: met, evidence: "TEST-RUN-022, ASMT-028", note: "CLM-038 weakened: it is about commit 2608198, where the criterion did not hold"}
      - {postcondition: "The local form is otherwise unchanged; the hosted gate passes with the production build; the new pages pass axe-core with 0 violations, geometry, and a Tab walk with focus at least 3:1, at 1200 and 390 px, in both themes; check and trace pass", result: met, evidence: "TEST-RUN-022, UI-RUN-016, CHG-104", note: "pagecompare identical, e2e 54/54; the gate's sobelow honours one reviewed skip (a false positive on the upload's path)"}
    findings:
      - "A waiting bring-in file survived going home or to the household page; fixed"
      - "Forms from the plans, goals, retirement pages and the leave checklist went home; DomainWeb.return_to now has the local router's rules"
      - "A plan request had no link from the member's home page; a shared plan's item page showed only its note; both fixed"
      - "Sobelow: raw HTML in the plan summary (now a component); a reviewed false positive on the upload path (sobelow_skip with its reason; the gate honours reviewed skips)"
      - "Kept as the local form: removing a plan step returns home"
      - "Left for a later WorkItem: sentences still written inline in the local form's html.ex and also in the shared *Words modules; the glossary lists copied into hosted tests"
    evidence_candidates: "TEST-RUN-022, UI-RUN-016, CT-001, ASMT-028: the hosted form offers every capability of the local form with its rules and words (REQ-188), bounded to its own database over a member's whole visit (REQ-124); DEF-061 fixed on both forms"
    provenance: {source: REV-102, created_by: ACT-002, authority: proposal_only, inputs: [project/assurance/analysis/CT-001-contract-coverage.md, project/lifecycle/WI-075.yaml, project/assurance/defeaters.yaml], created_at: 2026-09-29}
