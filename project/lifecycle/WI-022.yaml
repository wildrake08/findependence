version: 1
artifacts:
  - id: WI-022
    type: WorkItem
    name: ux001_item_pages_context_waiting
    status: completed
    completed_at: 2026-09-26
    postcondition_results:
      - {postcondition: "R1", result: met, note: "/items/:id holds status, sharing, owners, links, history, and letting go, for money items and values; home lists items as links with no per-item forms (4 forms remain: add item, add value, withdraw, lock); an item the member can't see returns 404 'not available'"}
      - {postcondition: "R6", result: met, note: "actions carry a return address and land back on the item page (deletes land home); a one-time message states the outcome (e.g. 'Ben can now see “Groceries”.' or 'Proposed. Waiting for Ben to agree.'); return must be /items/<id> of an item the member can still see, else /"}
      - {postcondition: "R7", result: met, note: "'Waiting for you' is the first section when anything waits on the member; the header shows 'N waiting for you' linking to it; items with pending changes carry a badge"}
      - {postcondition: "measurement", result: met, note: "same seed data (5 items, 4 values) rendered by main and by this branch: home 5,692 -> 1,788 px at 1200 px; 8,186 -> 3,036 px at 390 px; forms on home 37 -> 4. Item pages 1,226-1,380 px. No horizontal scroll at 390 px (measured in a 390 px frame, since headless Chromium's window is at least 500 px). UX-001 E2's 5,400 px / 46 forms used different data; this branch's baseline is the like-for-like main measurement"}
      - {postcondition: "security", result: met, note: "81 app tests pass, including tamper, model, and web security tests; open-redirect test covers absolute, protocol-relative, traversal, unknown-item, and javascript: returns on a succeeding action"}
    mutations: '6/7 detected (arbitrary return followed; visibility not checked; grant outcome ignores pending consent; generic add message; flash dropped; waiting count zero). Undetected: removing the id-format check on return, which is equivalent because a malformed id is never a visible item; kept as defense in depth'
    found_by_looking: 'the first open-redirect test posted an action that failed (422), so the return address was never followed; a mutation exposed it and the test now uses a succeeding action and asserts the 303'
    objective: >
      Implement UX-001 R1 (a page per item holding all its state and actions; a compact home list),
      R6 (return to where the action was taken; feedback states the actual outcome), and R7 (things
      waiting for this member come first, with a count in the header). Approved by ACT-001 (REV-014).
    target_requirements: [REQ-123, REQ-124]
    target_note: "Interface restructuring in IE-205; no Requirement, core, or vault change."
    authority: "REV-014 (ACT-001); bootstrap.yaml autonomy[bounded_implementation_repair]"
    authority_scope: {may_modify_upstream_semantics: false, excludes: [core/**, automation/**, framework/**, "app/lib/findependence_app/{crypto,vault,session,store,sessions,secret,money}.ex"]}
    allowed_files: [app/lib/findependence_app/web.ex, app/lib/findependence_app/web/**, app/test/**, project/lifecycle/**, project/assurance/**, project/change/**, project/realization/**]
    baseline_before_change: "Home page with 5 money items and 4 values: about 5,400 px at 1200 px wide, 46 forms (UX-001 E2). To be re-measured after."
    postconditions:
      - "R1: every action on an item is available on /items/:id; the home page has no per-item action forms; values get item pages too; a member who can't see an item gets 'not available'"
      - "R6: after an action on an item page, the member lands back on that page; the message states the actual outcome (applied, or waiting for named people); redirect targets are validated (no open redirect)"
      - "R7: when something is waiting for the member it is the first section, and the header shows the count"
      - Home page height re-measured against the baseline; security tests still pass; checked in headless Chromium at 1200 px and 390 px
    required_checks: [tests, check, trace]
    provenance: {source: REV-014, created_by: ACT-002, authority: "REV-014", inputs: [project/assurance/analysis/UX-001-frontend-assessment.html], created_at: 2026-09-26}
