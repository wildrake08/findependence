    allowed_files: [app/lib/findependence_app/web.ex, app/lib/findependence_app/web/**, app/lib/findependence_app/sessions.ex, app/test/**, project/**]
    postconditions:
      - "HTTP tests for agree, withdraw, and unlink, each changing the saved file as expected"
      - "Malformed request numbers and an unknown action are refused with a plain message and change nothing"
      - "An error on an item page is shown on that page"
      - "A member whose session was replaced is told their last action was not saved"
