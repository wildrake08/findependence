    type: WorkItem
    name: ux_003_craft_fixes
    status: completed
    completed_at: 2026-09-27
    mutations: 'all 16 detected: focus back to amber; numeric headers unmarked; pill moves its figure again; selects keep the browser fill; controls sized by padding; links back to browser colours; amount error after the row; what-if error above the form; delete plan neutral; orphan rule under lists; header full-bleed; figure and frequency in one cell; irregular comma back; estimates with cents; a literal font size; owners not a grid. Two missed on the first run (what-if error above the form, irregular comma back); tests added'
    found_by_looking: 'a separate frequency cell made the phone rows'' owner line wrap, so phones keep the one cell they had; an 11rem checkbox grid gave phones one column and left one owner alone on a second row, so columns are a fixed 9rem, two per row on phones, with labels that indent when they wrap; the Money radios sat 9 px above the button; geometry.py first mismeasured inline forms and closed disclosures. Each fixed'
    deviations_from_ux003: 'C3: the pill floats to the left edge of its cell rather than being moved before the figure, so the figure stays flush right with markup and reading order unchanged. C6: the debt what-if and new-balance errors had no aria-invalid or aria-describedby; both now do. C7: a variant argument on button/6; "Stop owning" (item page and leave checklist) is also destructive; the context selectors (.inline button, td button) stay, as UX-003 allowed. C10: the separate "How often" cell is shown at desktop widths only; phones keep one cell, and only one copy is ever displayed. C11: the h1 change was not made (REV-049); .85rem and .9rem merged into one .875rem step, so hints, labels, and table headers change by under 0.5 px. C12: fixed 9rem columns packed left, two per row on phones, instead of 11rem flexible columns'
    objective: >
      UX-003 recommendations accepted in REV-049 (C1-C12): a focus token with at least 3:1 contrast (C1);
      numeric headers aligned with their figures (C2); "Below zero" before the figure (C3); one control
      height and white selects (C4); one link colour (C5); field errors at their field (C6); button
      variants, with deleting a plan styled as destructive (C7); card rhythm (C8); header on the content
      column (C9); estimates in whole dollars and amounts apart from how often (C10); a named type scale
      with a page-title step (C11); checkbox grids (C12).
