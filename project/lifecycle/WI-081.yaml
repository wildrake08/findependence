version: 1
artifacts:
  - id: WI-081
    type: WorkItem
    name: assess_001_remaining_gaps
    status: implemented
    objective: >
      REV-108: resolve the gaps WI-080 left. (7) Database roles: a runtime role with row access only (add-only on
      the audit) and an owner role for migrations, made by rel/database-roles.sql; Release.migrate migrates as the
      owner and grants the runtime role; a production server refuses to start with a more powerful role. (8)
      Supply chain: the Tailwind pins checked against Tailwind's published digests (all five platforms); the dev
      container's images pinned by index digest. (9) Accounts identified by an account number in place of an email
      address (CP-026). Not merged, released, or deployed.
    target_requirements: [REQ-181, REQ-184, REQ-190, REQ-191]
    addresses: [DEF-069, DEF-076]
    authority: "REV-108 (ACT-001)"
    authority_scope:
      may_modify_upstream_semantics: false
      may_not: ["merge into main, tag, release, or deploy"]
    branch: "findependence/wi-080-alignment (with WI-080), worktree /home/vscode/wt-079b; uncommitted"
    postconditions:
      - "Each change has a test that fails without it, or a check that verifies it"
      - "Every suite passes; the hosted gate exits 0; check passes"
    postcondition_results:
      - {postcondition: "Each change has a test that fails without it, or a check that verifies it", result: met, evidence: TEST-RUN-026}
      - {postcondition: "Every suite passes; the hosted gate exits 0; check passes", result: met, evidence: TEST-RUN-026}
    residual_risks:
      - "the database roles are tested on the development server, not on a real deployment; a deploying WorkItem still decides the database host, TLS certificates, and how the role passwords are kept"
      - "the image digests are those the registry gave on 2026-10-01; the dev container uses them only once rebuilt, and whether the running container was built from them can't be told from inside it"
      - "a member who loses both their account number and their recovery key can't get back in, as before with a lost recovery key (REQ-184 AC-4); the household page shows the number while they are signed in"
    provenance: {source: REV-108, created_by: ACT-002, authority: "REV-108", inputs: [project/change/CP-026.yaml], created_at: 2026-10-01}
