    objective: >
      REV-088: a release candidate of the local-first form from findependence/wi-064-integrate-heads, carrying
      WI-062 (the new look and dark palette), WI-066 and WI-068 (the public context API, no behaviour change),
      WI-067 (the runtime egress test), and REQ-124 as restated (REV-079). Proposed name v0.8.0-alpha, since the
      interface looks new to testers. A New in v0.8.0 section in the tester guide (app/ALPHA.md): the new look,
      dark mode following the device, and nothing else changed in what the app does. A clean reproduction from a
      fresh clone at the candidate commit: every suite twice, format, check, trace, the e2e driver 54 of 54 on
      the real server, the egress and boundary tests; the UX contract's gates in both themes (axe-core, Tab walk
      focus contrast, geometry at 1200, 390, and 320 px, forced colours). GATE-039 targets every element whose
      files changed since v0.7.3-alpha's code (971039a), found from the diff: IE-205 (web.ex, web/html.ex,
      money.ex, and the context modules), IE-106 (balances.ex), IE-107 (plans.ex), IE-109 (import.ex). A Claim
      for the candidate names only the Requirements VV-002 verifies, and adds REQ-124 as restated on the egress
      test's evidence. Stop for ACT-001's go-ahead before merging into main, tagging, and pushing.
