artifacts:
  - id: WI-040
    type: WorkItem
    name: v0_4_retirement_projection
    status: completed
    completed_at: 2026-09-27
    mutations: 'all 28 detected. Core 15: retirement accounts counted as cash; contribution added before growth; contributions to accounts not seen, after a test was added; a full month paid counted short; equal Social Security not covering; Social Security ignored; sensitivity by one point; out-of-range alternatives kept; contributions kept after delete; contribution to a checking account; return up to 16%; the age 100 horizon ignored; IRA not a retirement kind; stops a year early; this month skipped. App 13: IRA kind not accepted, after a test; negative sign ignored; return up to 16% at the field, after a test; zero contribution not a clear, after a test; typed values not kept; no note on a retirement account; age reached off; sensitivity labels swapped, after a test; no home link; contributions not saved; saved despite errors; no return to the page; retirement atoms missing from the vault list, after the fresh-process test was fixed. Equivalent under the current load order, recorded not counted: plan atoms missing from the vault list (core modules the session loads first create them)'
    found_by_looking: 'the fresh-process test named fields in its script, which created their atoms and would have hidden a decoding failure (v0.3 plans had the same blind spot); the Social Security hint crowded its field; a refused save said so only at the bottom of a long page; the year-by-year table made the page 4,028 px on phones. Each fixed with a test'
    not_in_scope: 'the export a member takes when leaving carries neither plans, marks, goals, nor retirement assumptions (nor did v0.3); ROADMAP-ALPHA v0.5 (taking your record with you) is where that belongs'
    objective: >
      ROADMAP-ALPHA v0.4.0-alpha (REV-043): retirement accounts that never count as cash (REQ-149);
      private retirement assumptions (REQ-150); a year-by-year projection in today's dollars to the
      member's retirement age (REQ-151), compared with their own target income (REQ-152), with its
      sensitivity to the return and the retirement age (REQ-153), and no suggestions (REQ-154); then the
      UX contract's gates, the demo, the gallery, and evidence.
    target_requirements: [REQ-149, REQ-150, REQ-151, REQ-152, REQ-153, REQ-154]
    authority: "REV-043 (ACT-001); REV-038 (CAP-012 accepted); CP-002 delegation; CP-004 option B for evidence"
