version: 1
# severity: blocking | material | minor. None of the semantic defeaters is assessed as blocking ratification.
# DEF-006 intentionally unallocated (the money vs. economic-life tension T-c was judged not to be a defeater; see ORIENT-001 §2.3).
artifacts:
  - {id: DEF-001, type: Defeater, kind: semantic, severity: material, blocks_ratification: false, status: mitigated, resolution: "Q1 ratified (REV-001)", mitigation: Q1/ASM-001,
     statement: "A literal residential reading of 'household' excludes unhoused, institutionalized, and displaced persons, who are among those most held back by money.", provenance: {source: ORIENT-001, created_by: ACT-002, authority: proposal_only, inputs: [project/bootstrap.yaml@0ab85fc], created_at: 2026-09-25}}
  - {id: DEF-002, type: Defeater, kind: semantic_normative, severity: material, blocks_ratification: false, status: mitigated, resolution: "PRI-002 and Q4 ratified to specified (REV-001); enforcement carried to Outcome/Requirement derivation", mitigation: PRI-002/Q4,
     statement: "No rule governs household-vs-member conflict; household capacity gains can enable one member to control or surveil another (financial abuse), advancing the Purpose at household level while defeating the Telos for a member.", provenance: {source: ORIENT-001, created_by: ACT-002, authority: proposal_only, inputs: [project/bootstrap.yaml@0ab85fc], created_at: 2026-09-25}}
  - {id: DEF-003, type: Defeater, kind: semantic, severity: material, blocks_ratification: false, status: mitigated, resolution: "Q2 ratified (REV-001)", mitigation: Q2/ASM-004,
     statement: "Read absolutely, 'not held back by money' implies the absence of budget constraints, i.e. the elimination of scarcity.", provenance: {source: ORIENT-001, created_by: ACT-002, authority: proposal_only, inputs: [project/bootstrap.yaml@0ab85fc], created_at: 2026-09-25}}
  - {id: DEF-004, type: Defeater, kind: semantic, severity: material, blocks_ratification: false, status: open, resolution: "carried forward to Outcome breadth and assurance", mitigation: "Q5; carry to Outcome breadth and assurance",
     statement: "Where absolute insufficiency of means is the binding constraint, increased capacity may contribute little, and capacity tools may disproportionately benefit already-advantaged households, in tension with 'every household'.", provenance: {source: ORIENT-001, created_by: ACT-002, authority: proposal_only, inputs: [project/bootstrap.yaml@0ab85fc], created_at: 2026-09-25}}
  - {id: DEF-005, type: Defeater, kind: semantic, severity: material, blocks_ratification: false, status: mitigated, resolution: "Q3 and PRI-003 ratified (REV-001)", mitigation: Q3/ASM-006/PRI-003,
     statement: "Emphasis on deliberate shaping may raise cognitive and time burdens, which are themselves scarce for constrained households.", provenance: {source: ORIENT-001, created_by: ACT-002, authority: proposal_only, inputs: [project/bootstrap.yaml@0ab85fc], created_at: 2026-09-25}}
  - {id: DEF-007, type: Defeater, kind: semantic, severity: minor, blocks_ratification: false, status: open, resolution: "carried forward to assurance design", mitigation: "carry to assurance design",
     statement: "Adaptive preferences: purely subjective valuation can understate how far deprived households are held back.", provenance: {source: ORIENT-001, created_by: ACT-002, authority: proposal_only, inputs: [project/bootstrap.yaml@0ab85fc], created_at: 2026-09-25}}
  - {id: DEF-008, type: Defeater, kind: process, severity: blocking, blocks_ratification: false, blocks_canonicalization: true, status: resolved, resolution: "AUT-CHECK implemented (WI-001, IE-001/IE-002); scripts/check PASS on repository (EVC-005)",
     statement: "scripts/check (AUT-CHECK) is an unimplemented placeholder (exit 2); gates subject/telos/purpose_canonicalization require deterministic_checks [check] and cannot be satisfied as specified. ACT-002 has no authority to substitute or waive.", provenance: {source: ORIENT-001, created_by: ACT-002, authority: proposal_only, inputs: [project/bootstrap.yaml@0ab85fc], created_at: 2026-09-25}}
  - {id: DEF-009, type: Defeater, kind: authority, severity: blocking, blocks_ratification: false, blocks_canonicalization: true, status: resolved, resolution: "ACT-001 ratification scoped to proposed->coherent->specified (REV-001 item 3); canonicalization remains a separate human act (GATE-002)",
     statement: "Gates require transition specified->canonical, but no authority policy governs proposed->coherent->specified for foundational artifacts; ACT-002 left SUBJ/TEL/PUR in 'proposed'.", provenance: {source: ORIENT-001, created_by: ACT-002, authority: proposal_only, inputs: [project/bootstrap.yaml@0ab85fc], created_at: 2026-09-25}}
  - {id: DEF-010, type: Defeater, kind: process, severity: minor, blocks_ratification: false, status: resolved, resolution: "Fence removed (CHG-003); file parses as YAML",
     statement: "project/bootstrap.yaml is wrapped in a markdown code fence and does not parse as YAML (yaml_elixir error at line 91). Content was read with the fence stripped; the file was not modified.", provenance: {source: ORIENT-001, created_by: ACT-002, authority: proposal_only, inputs: [project/bootstrap.yaml@0ab85fc], created_at: 2026-09-25}}
  - {id: DEF-011, type: Defeater, kind: authority, severity: material, blocks_ratification: false, status: resolved, resolution: "ACT-001 identified as William Drake (REV-001 item 4)",
     statement: "Initiating Actor is recorded only as 'me'; identity for authority records is unconfirmed (commit author wildrake08 / git user 'William Drake').", provenance: {source: ORIENT-001, created_by: ACT-002, authority: proposal_only, inputs: [project/bootstrap.yaml@0ab85fc], created_at: 2026-09-25}}
  - {id: DEF-012, type: Defeater, kind: process, severity: material, status: resolved, resolution_note: "AUT-TRACE implemented (WI-002); IE-001..004 verified at GATE-003", blocks_ratification: false,
     statement: "Gate implementation_verification (implemented -> verified) requires deterministic_checks [check, tests, trace]; scripts/trace is still a placeholder, so no ImplementationElement, IE-001/IE-002 included, can reach 'verified'.", resolution: "requires a WorkItem for AUT-TRACE, authorized by ACT-001", provenance: {source: WI-001, created_by: ACT-002, authority: proposal_only, inputs: [framework/gates/foundational.yaml], created_at: 2026-09-25}}
  - {id: DEF-013, type: Defeater, kind: process, severity: material, status: resolved, resolution: "Governed state committed at 4c5c0f6 (REV-002); I-016 evaluated over 68 committed artifacts in CHK-RUN-003", blocks_ratification: false,
     statement: "No governed artifact is committed to git, so I-016 (historical_state_preserved) evaluates vacuously; the ratification record (REV-001, histories) can currently be rewritten or lost without detection.", resolution: "commit the governed state (requires ACT-001 instruction)", provenance: {source: CHK-RUN-002, created_by: ACT-002, authority: proposal_only, inputs: [project/assurance/runs/CHK-RUN-002.txt], created_at: 2026-09-25}}
  - {id: DEF-014, type: Defeater, kind: authority, severity: material, status: resolved, resolution_note: "CP-001 adopted (REV-005): automation/policies/authority.yaml gained a Principle entry, so I-012 now guards Principle transitions. Status recorded in WI-031", blocks_ratification: false,
     statement: "GOVERNANCE.md requires human ratification of foundational normative principles, but automation/policies/authority.yaml has no Principle entry, so I-012 (derived from that policy) does not guard Principle transitions. PRI-001..003 transitions were all performed by ACT-001, so there is no present violation.", resolution: "CP-001 (awaiting ACT-001)", provenance: {source: CHG-005 check run, created_by: ACT-002, authority: proposal_only, inputs: [GOVERNANCE.md, automation/policies/authority.yaml], created_at: 2026-09-25}}
  - {id: DEF-015, type: Defeater, kind: semantic_normative, severity: material, status: open, blocks_ratification: false,
     statement: "OUT-004 (coordination) conflicts with OUT-005 (member standing): requiring every owner's consent (REQ-103/104) can block legitimate joint action, and letting any owner revoke can disrupt shared arrangements.", provenance: {source: OBA-001, created_by: ACT-002, authority: proposal_only, inputs: [project/assurance/analysis/OBA-001-outcome-breadth.md], created_at: 2026-09-25}}
  - {id: DEF-016, type: Defeater, kind: semantic, severity: material, status: open, blocks_ratification: false,
     statement: "The System cannot detect coerced consent; a member pressured outside the System can grant visibility or give up ownership. Consent-governed visibility is necessary but not sufficient for OUT-005; CAP-002 and REQ-105 only partly mitigate this.", provenance: {source: OBA-001, created_by: ACT-002, authority: proposal_only, inputs: [project/assurance/analysis/OBA-001-outcome-breadth.md], created_at: 2026-09-25}}
  - {id: DEF-017, type: Defeater, kind: process, severity: material, status: open, blocks_ratification: false,
     statement: "The Outcome set and the sentinel scores are a single agent's judgment, with no Subject input and no independent review.", provenance: {source: OBA-001, created_by: ACT-002, authority: proposal_only, inputs: [project/assurance/analysis/OBA-001-outcome-breadth.md], created_at: 2026-09-25}}
  - {id: DEF-018, type: Defeater, kind: authority, severity: blocking, status: resolved, resolution_note: "CP-002 option B enacted (REV-003, CHG-008); I-012 enforces it (WI-003)", blocks_ratification: false,
     statement: "No authority policy governs state transitions for Outcome, Capability, Function, or Mechanism, or acceptance of Requirements below the foundation. ACT-002 may propose but not accept these, and implementation requires accepted Requirements with accepted upward paths (REQ-008), so no product implementation can legitimately start.", resolution: "CP-002 or per-artifact acceptance by ACT-001 (GATE-004)", provenance: {source: OBA-001, created_by: ACT-002, authority: proposal_only, inputs: [project/assurance/analysis/OBA-001-outcome-breadth.md], created_at: 2026-09-25}}
  - {id: DEF-019, type: Defeater, kind: semantic, severity: minor, status: resolved, resolution_note: "Closed by ACT-001 (REV-005): mitigated by REQ-016 for delegated acceptance; human acceptance is the guard otherwise", blocks_ratification: false,
     statement: "REQ-008 accepts any one valid upward path. A Requirement derived from both a Mechanism and a canonical Principle (e.g. REQ-102 -> PRI-002 -> SUBJ-001) therefore traces even if its Mechanism/Function/Capability/Outcome chain is unaccepted, so Principle-derivation can bypass the hierarchy. Acceptance of the Requirement by ACT-001 (or CP-002 option B) is currently the only guard.", resolution: "ACT-001 may choose: keep; or require that every derived_from target of an implemented Requirement be accepted (a REQ-008 change)", provenance: {source: "scripts/trace REQ-102 output", created_by: ACT-002, authority: proposal_only, inputs: [project/realization/requirements-slice1.yaml, automation/ri01/lib/ri01/trace.ex], created_at: 2026-09-25}}
  - {id: DEF-020, type: Defeater, kind: semantic_normative, severity: material, status: resolved, resolution_note: "CP-003 adopted (REV-004); REQ-104 superseded by REQ-107; realized in WI-006", blocks_ratification: false,
     statement: "REQ-104 (and MEC-001) require every current owner's consent for any owner-set change, including a member removing only themselves. CAP-002 (independent exit) needs a member to be able to leave joint items without others' cooperation. Under REQ-104 a controlling co-owner can keep a member attached indefinitely, which is the harm PRI-002 targets. REQ-104 is sound for adding owners and for removing others; it over-reaches for self-removal.", resolution: "CP-003 (awaiting ACT-001)", provenance: {source: "WI-004 review of CAP-002 against REQ-104", created_by: ACT-002, authority: proposal_only, inputs: [project/realization/requirements-slice1.yaml, project/semantic/sentinel-out005.yaml, project/semantic/principles.yaml], created_at: 2026-09-25}}
  - {id: DEF-021, type: Defeater, kind: authority, severity: blocking, status: resolved, resolution_note: "CP-004 option B adopted (REV-004): ACT-002 may qualify only reproducible test and check evidence and assess only implementation-level Claims; everything else needs ACT-001 or a designated reviewer. Status recorded in WI-031", blocks_ratification: false,
     statement: "No policy says who may qualify an EvidenceCandidate (set integrity to valid, stage to qualified) or who may issue an Assessment of a Claim. All 15 EvidenceCandidates are self-generated by ACT-002, and qualifying them itself would be self-certification. The PROMPT pipeline (EvidenceCandidate -> qualified Evidence -> Assessment) cannot legitimately advance.", resolution: "CP-004 (awaiting ACT-001)", provenance: {source: WI-004, created_by: ACT-002, authority: proposal_only, inputs: [PROMPT.md, GOVERNANCE.md, framework/states/machines.yaml], created_at: 2026-09-25}}
  - {id: DEF-022, type: Defeater, kind: semantic, severity: material, status: open, blocks_ratification: false,
     statement: "DEF-007 made concrete for OUT-002: a member whose stated values have adapted to deprivation will see good alignment with a diminished life. The design deliberately does not correct for this (PRI-001); it is an accepted limit of OUT-002, not a solved one.", provenance: {source: OBA-002, created_by: ACT-002, authority: proposal_only, inputs: [project/semantic/outcomes.yaml, project/semantic/principles.yaml, project/assurance/analysis/OBA-002-alignment.md], created_at: 2026-09-26}}
  - {id: DEF-023, type: Defeater, kind: semantic_normative, severity: minor, status: open, blocks_ratification: false,
     statement: "Private links (REQ-112) let members interpret the same shared expense differently without either knowing: protective under PRI-002, but it may hinder OUT-004. CAP-005 is the consent-based bridge.", provenance: {source: OBA-002, created_by: ACT-002, authority: proposal_only, inputs: [project/semantic/outcomes.yaml, project/semantic/principles.yaml, project/assurance/analysis/OBA-002-alignment.md], created_at: 2026-09-26}}
  - {id: DEF-024, type: Defeater, kind: semantic, severity: minor, status: resolved, resolution_note: "CP-005 adopted (REV-006); REQ-109 superseded by REQ-117; realized in WI-010", blocks_ratification: false,
     statement: "REQ-109 (export: owned items and ledgers, 'nothing else') excludes the member's own value links (REQ-112). A leaving member takes their values but loses how they related activity to them, although the links are their own data. This is a gap between CAP-002 and CAP-004; amending REQ-109 needs a Change, since REQ-109 is accepted.", resolution: "candidate ChangeProposal to include own links in export", provenance: {source: WI-008, created_by: ACT-002, authority: proposal_only, inputs: [project/realization/requirements-cap002.yaml, project/realization/requirements-out002.yaml], created_at: 2026-09-26}}
  - {id: DEF-025, type: Defeater, kind: architecture_normative, severity: blocking, status: resolved, resolution_note: "CP-006 option B adopted (REV-007): one shared device with per-member encryption at rest. The residual question, whether that encryption is sound, is carried by DEF-026 and DEF-028, which stay open and block household use. Status recorded in WI-031", blocks_ratification: false,
     statement: "Local-first (REV-005) plus multiple members conflicts with member standing. If a household shares one device, any member with access to that device can read the stored data directly: the core enforces privacy only at its API (ASM-013), so PRI-002 fails in exactly the harm case OUT-005 targets. If each member uses their own device, the devices must sync, which needs network code. No prototype can be built for STUDY-001 without choosing.", resolution: "CP-006 (awaiting ACT-001)", provenance: {source: STUDY-001 section 9, created_by: ACT-002, authority: proposal_only, inputs: [project/assurance/plans/STUDY-001-household-observation.md, project/semantic/CTX-001.yaml], created_at: 2026-09-26}}
  - {id: DEF-026, type: Defeater, kind: assurance, severity: blocking, status: open, blocks_ratification: false,
     statement: "The vault's cryptographic design and key handling (IE-201..203) were written and tested only by ACT-002. Passing tests and mutation checks do not establish security. No household may use the prototype until a qualified person has reviewed it (CP-006 recommendation; STUDY-001 section 9).", resolution: "independent security review arranged by ACT-001", provenance: {source: WI-011, created_by: ACT-002, authority: proposal_only, inputs: [app/lib/findependence_app/session.ex, app/lib/findependence_app/crypto.ex], created_at: 2026-09-26}}
  - {id: DEF-027, type: Defeater, kind: semantic, severity: material, status: resolved, resolution_note: "REQ-125 adopted by ACT-001 (REV-010), realized in WI-018", blocks_ratification: false,
     statement: "Pending proposals cannot be withdrawn. Before WI-017, the owner picker pre-ticked only the acting member, so a proposal on a co-owned item silently proposed removing the co-owners, and ACT-001's demo household holds one such proposal. It stays pending until every needed member agrees, or until a change to the item's owners makes it stale. Nobody can cancel a mistaken or outdated proposal, which bears on PRI-003 (the Subject controls their own decisions).", resolution: "candidate: let the proposer (or any current owner) withdraw a pending proposal; a core Requirement, needs ACT-001 (CP-002 covers deriving it under an accepted Capability)", provenance: {source: "WI-017 investigation of ACT-001 report", created_by: ACT-002, authority: proposal_only, inputs: [core/lib/findependence/household.ex], created_at: 2026-09-26}}
  - {id: DEF-028, type: Defeater, kind: security, severity: high, status: open, blocks_ratification: false,
     statement: "Security self-review F-01: the vault's plaintext access state (owners, grantees, proposals, members) is not authenticated. WI-020 blocks the key-leak path (no key is sealed to a reader that appeared without one) and adds detection, but a household member who can edit the file can still forge consents on proposals, remove people, or roll the file back (F-03); a real owner can bypass all-owner consent. A full fix needs a signed operation log (design option a).", resolution: "decision by ACT-001 after the independent review: adopt design option a, b, or c (see security-review/SELF-REVIEW.md)", decision_note: "ACT-001 chose option a (REV-109, CP-027): DESIGN-002, a signed operation log; the independent reviewer reviews the design before it is built. WI-079..WI-081 closed the key-leak and record-forgery paths (DEF-064, DEF-067); this Defeater stays open for forged agreements, removals, a listed owner's writes, vouching a grantee, and rollback until DESIGN-002 is built and verified", provenance: {source: WI-020, created_by: ACT-002, authority: proposal_only, inputs: [project/assurance/security-review/SELF-REVIEW.md], created_at: 2026-09-26}}
  - {id: DEF-029, type: Defeater, kind: semantic, severity: material, status: resolved, resolution_note: "CP-007 option B adopted (REV-020); REQ-113 superseded by REQ-126, REQ-127 added; realized in WI-025", blocks_ratification: false,
     statement: "Items carry one amount with no date or frequency, so REQ-113's per-value sums add unlike quantities (a monthly rent, a biweekly paycheck, a one-off purchase) and have no stated period. A total such as 'A safe home: -$2,562.36' cannot answer OUT-002's question of whether activity serves what the member values, because it is neither per month nor over any defined span. Sums also net money in against money out (UX-001 R11). Nothing in the canonical artifacts addresses time.", resolution: "CP-007 (awaiting ACT-001)", provenance: {source: "ACT-002 answer to ACT-001 on the purpose of linking, 2026-09-26", created_by: ACT-002, authority: proposal_only, inputs: [project/semantic/sentinel-out002.yaml, project/realization/requirements-out002.yaml, project/assurance/analysis/OBA-002-alignment.md, project/assurance/analysis/UX-001-frontend-assessment.html], created_at: 2026-09-26}}
  - {id: DEF-030, type: Defeater, kind: architecture_normative, severity: material, status: open, blocks_ratification: false,
     statement: "CP-006 option B (one shared household device, served only to that device) assumes members use the same device. Households whose members live elsewhere for long periods (the roadmap family's two college students) cannot use the app while away, so those members' standing (OUT-005) and the household's coordination (OUT-004) depend on being home. Per-member devices with home sync (CP-006 A) or remote access would address it, and both change the security design.", resolution: "decide after the independent security review (REV-038)", provenance: {source: REV-038, created_by: ACT-002, authority: proposal_only, inputs: [project/change/CP-006.yaml, project/assurance/plans/ROADMAP-ALPHA.md], created_at: 2026-09-27}}
  - {id: DEF-031, type: Defeater, kind: architecture_normative, severity: blocking, status: resolved, resolution_note: "CP-013 option A adopted (REV-039): balances are append-only readings, each sealed with its own key; realized in WI-036 and verified by GATE-026", blocks_ratification: false,
     statement: "CAP-010 (balances and debts) needs balances that change: a checking balance is updated at least monthly (the roadmap's five-minute check). But items are immutable (ASM-021): content is written once, and editing was deferred until after the security review because it needs re-keying whenever someone loses access (CP-008 A). CAP-011's running balance depends on the same updates. CAP-010 and CAP-011 cannot be built as specified without deciding how a balance is updated.", resolution: "CP-013 (awaiting ACT-001)", provenance: {source: WI-035, created_by: ACT-002, authority: proposal_only, inputs: [project/semantic/alpha-capabilities.yaml, project/assurance/assumptions.yaml, project/change/CP-008.yaml], created_at: 2026-09-27}}
  - {id: DEF-032, type: Defeater, kind: implementation_defect, severity: major, status: resolved, resolution_note: "WI-041: the saved file is written by Findependence.Import.to_data, which encodes shared plans' steps; a test downloads the file for a member who owns a shared plan, and the demo test brings Dad's file (with Dad's shared plan) into a new household; verified by GATE-029. v0.3.0-alpha as released still has the defect; any later release carries the fix", blocks_ratification: false, challenges: [CLM-024, CLM-026],
     statement: "Since v0.3.0-alpha, a member who owns a shared plan cannot download their export (/export.json): the file's encoder does not handle a shared plan's steps, which hold tuples, and the request fails. The on-screen export page is unaffected, and the export at the library API (REQ-117, CLM-023, CLM-025) is complete. This weakens CAP-002 (take your record and leave) for exactly the members who agreed to share a plan. No test downloaded an export holding a shared plan, so CLM-024 and CLM-026 were assessed without it; neither lists REQ-117, but both rest on the app's export working.", resolution: "WI-041: encode shared plans' steps in the file like a member's own plans (REQ-155), with a test that downloads an export holding one; v0.3.0-alpha stays as released and v0.4.0-alpha is still a candidate", provenance: {source: WI-041, created_by: ACT-002, authority: proposal_only, inputs: [app/lib/findependence_app/web/html.ex, core/lib/findependence/exit.ex], created_at: 2026-09-27}}
  - {id: DEF-033, type: Defeater, kind: implementation_defect, severity: major, status: resolved, resolution_note: "WI-045 (UX-003 C1): the --focus token, 13.39:1 or more on every surface (UI-RUN-003..005, tabwalk.py), verified by GATE-033; in the v0.7.0-alpha candidate (WI-048). v0.1.0-alpha to v0.6.0-alpha as released still carry the 1.87:1 ring", blocks_ratification: false,
     statement: "Since v0.1.0-alpha, the keyboard focus outline (#f0b400) has 1.87:1 contrast against the white cards and 1.74:1 against the page, under the 3:1 that WCAG 1.4.11 asks of what identifies a state, and it shares its amber hue with the attention border of Waiting for you. WI-024 and WI-041 record 'visible focus' on every stop; their Tab walk checked that an outline exists, not that it can be seen, so those notes mean present, not visible to the WCAG measure. Released v0.1.0-alpha to v0.5.0-alpha and the v0.6.0-alpha candidate carry it. Found by UX-003 (K1), measured by tabwalk.py (UI-RUN-003).", resolution: "WI-045 (UX-003 C1): a --focus token at 13.39:1 or more on every surface, checked by tabwalk.py and test/ux003_test.exs; resolved when findependence/ux-003 merges (REV-050)", provenance: {source: UX-003, created_by: ACT-002, authority: "REV-050", inputs: [project/assurance/analysis/UX-003-interface-craft-assessment.html, project/assurance/runs/UI-RUN-003.txt], created_at: 2026-09-27}}
  - {id: DEF-034, type: Defeater, kind: implementation_defect, severity: minor, status: resolved, resolution_note: "WI-047: the figure and its pill are one unit that doesn't wrap; geometry.py checks the pill is on its figure's line (UI-RUN-005); verified by GATE-034", blocks_ratification: false,
     statement: "WI-045 (UX-003 C3) floats the 'Below zero' pill to the left edge of a balance cell. Where the column is narrow (the next 60 days at 1200 px), the float doesn't fit beside the figure and drops below it, so on some rows the pill is beside the balance (October 13 and 15 in the demo) and on others under it (October 1, 3, and 5). The figures still end on one edge, which is all geometry.py checked, so UI-RUN-003, UI-RUN-004, and GATE-033 passed it; the pill moving between rows is what UX-003 K3 set out to remove. Found while taking before-and-after screenshots.", resolution: "WI-047: the figure and its pill are one unit that doesn't wrap, with the pill shown to the left; geometry.py checks that each pill is on its figure's line", provenance: {source: WI-045, created_by: ACT-002, authority: "REV-052", inputs: [project/lifecycle/WI-045.yaml], created_at: 2026-09-27}}
  - {id: DEF-035, type: Defeater, kind: implementation_defect, severity: major, status: resolved, resolution_note: "WI-049: the refusal renders a page that says nothing was saved, with a way home; tested with one shared cookie jar and over HTTP on the real server (UI-RUN-006); verified by GATE-035. v0.7.0-alpha as released still shows an empty 403", blocks_ratification: false,
     statement: "On one browser shared by the household, a form on a page opened before a Lock, before another member unlocks, or before the app restarts is refused with an empty 403: no message, no way on, and only a debug line in the server's log. Nothing is saved, so no data is harmed, but WI-032 and UX-001 R4 say a form sent after the session ends is lost and the member is told so. Lock drops the whole cookie session, including its CSRF token (and a restart invalidates the cookie), so Plug.CSRFProtection rejects the form before with_session can say so. The existing tests give each member their own cookie jar and never exercised one shared browser. Found by the v0.7.0-alpha readiness assessment (C1), driving a fresh clone of the tag over HTTP.", resolution: "WI-049: the refusal stays a 403 and changes nothing, but renders a page that says nothing was saved and why, with a way on; tested with one shared cookie jar and on the real server", provenance: {source: REV-058, created_by: ACT-002, authority: "REV-058", inputs: [project/lifecycle/WI-032.yaml], created_at: 2026-09-27}}
  - {id: DEF-036, type: Defeater, kind: assurance, severity: minor, status: resolved, resolution_note: "WI-051 (REV-062, option b): no 'about' before an exact figure; debt interest shown as a fact (REQ-135, REQ-145); 0 of 70 captured states (UI-RUN-008); verified by GATE-037 (the v0.7.2-alpha candidate). v0.7.1-alpha and earlier as released still show 'about' with cents", blocks_ratification: false,
     statement: "WI-045 records UX-003 C10 as met, but K10's acceptance, 'No \"about\" figure shows cents', was built for retirement estimates only. At a39d7b7, 11 of 75 captured states still show 'about' before a figure with cents (debt interest, payoff interest, setting aside, and monthly averages on item pages), and balances_web_test.exs and cash_flow_web_test.exs pin that wording. The result overstates what was built. Separately, REQ-135 and REQ-145 say the debt interest figures are shown 'as a fact', which the word 'about' contradicts. No figure is wrong; the wording of precision is inconsistent. Found by UX-005 (V4).", resolution: "pending D3 (REV-060): either the wording follows option (b), or WI-045's C10 result is narrowed on the record to retirement estimates", provenance: {source: REV-060, created_by: ACT-002, authority: "REV-060", inputs: [project/assurance/analysis/UX-005-visual-language-assessment.html, project/lifecycle/WI-045.yaml], created_at: 2026-09-27}}
  - {id: DEF-037, type: Defeater, kind: assurance, severity: material, status: resolved, resolution_note: "From v0.7.2-alpha, Claims name only clause-verified Requirements (CLM-035, CLM-036, ASMT-024, ASMT-025). CLM-031..034 keep their history and are to be read with this Defeater: they overstate for the Requirements VV-001 found violated or partly tested", blocks_ratification: false,
     statement: "CLM-033 and CLM-034 (v0.7.1-alpha, a39d7b7), like CLM-031 and CLM-032 before them, say the code satisfies its listed Requirements 'as specified and tested'. VV-001's clause-level audit of the same code (9e84fa8 differs only in the stylesheet and wording) finds 5 of those Requirements violated as written (REQ-102, REQ-112, REQ-117 by later Requirements; REQ-123 and REQ-165 by demonstrated defects, VV-RUN-001 D1 and D3) and 31 with clauses no test asserts. The assessments (ASMT-022, ASMT-023) judged Requirements met from passing tests, not from clause coverage. The released version is unchanged; its Claims overstate. Found by VV-001 (F-00).", resolution: "pending: the next version's Claims name only the Requirements VV-001's method verifies (or narrow to 'passes its tests'); CLM-031..034 keep their history and are read with this Defeater", provenance: {source: REV-063, created_by: ACT-002, authority: "REV-063", inputs: [project/assurance/analysis/VV-001-system-verification-validation.md, project/assurance/claims.yaml], created_at: 2026-09-27}}
  - {id: DEF-038, type: Defeater, kind: semantic_normative, severity: minor, status: resolved, resolution_note: "REQ-102, REQ-112, REQ-117, REQ-120, REQ-130, REQ-135, REQ-139, and REQ-152 superseded by REQ-167..REQ-174 (CHG-063), which state the accepted behaviour; no code changes", blocks_ratification: false,
     statement: "Later accepted Requirements changed behaviour without amending earlier ones, so eight Requirements contradict the system or each other as written: REQ-102's 'if and only if' (prospective owners read, REQ-115, REQ-148); REQ-112's 'any item' (REQ-134 and plans); REQ-117's 'nothing else' (REQ-155, REQ-164); REQ-120's 'non-owners cannot' (joiners can); REQ-130's type list (no 401(k) or IRA, REQ-149); REQ-135's 'no forms on home' (home has add-item and add-value forms); REQ-139's reference to superseded REQ-138; REQ-152's 'not compared with any figure the member did not set' (REQ-153's alternatives). Found by VV-001 (F-01).", resolution: "supersede each with corrected wording (REV-063)", provenance: {source: REV-063, created_by: ACT-002, authority: "REV-063", inputs: [project/assurance/analysis/VV-001-appendix-requirement-audit.md], created_at: 2026-09-27}}
  - {id: DEF-039, type: Defeater, kind: security, severity: major, status: resolved, resolution_note: "WI-052: a sweep every 5 seconds discards an idle session's keys, leaving a keyless marker so the next request still says the app locked itself; demonstrated (UI-RUN-009 D1); verified by GATE-037 (the v0.7.2-alpha candidate). v0.7.1-alpha and earlier as released keep keys until the next request", blocks_ratification: false,
     statement: "REQ-123 says a session's unlocked keys are discarded after 15 minutes idle. Sessions discards them only on the first request after that (sessions.ex; nothing sweeps), so if no request comes, the member's decrypted household and keys stay in the server's memory until one does, until another member unlocks, or until the server stops. Demonstrated: a session idle 16 minutes is still held (VV-RUN-001 D1). Crash dumps are off (ERL_CRASH_DUMP_SECONDS=0), which limits but doesn't remove the exposure. Found by VV-001 (F-02).", resolution: "pending WI-052: discard expired sessions' keys on a timer, keeping only a marker so the next request still says the app locked itself", provenance: {source: REV-063, created_by: ACT-002, authority: "REV-063", inputs: [project/assurance/runs/VV-RUN-001.txt, app/lib/findependence_app/sessions.ex], created_at: 2026-09-27}}
  - {id: DEF-040, type: Defeater, kind: semantic_normative, severity: minor, status: resolved, resolution_note: "WI-053 (REV-064): a pending proposal is dropped when its proposer stops owning the item, however that happens, so REQ-125's interpretation holds on every path; demonstrated (TEST-RUN-013); verified by GATE-037 (the v0.7.2-alpha candidate). v0.7.1-alpha and earlier as released keep such proposals pending", blocks_ratification: false,
     statement: "REQ-125's recorded interpretation says a proposer who stops owning the item has already lost their proposals (REQ-107). That holds when they relinquish, but not when they agree to an owner change that removes them: their proposal stays pending, they can no longer withdraw it, and the remaining owners can still approve it. Demonstrated: a grant proposed by a member who then agreed to leave the owner set is still pending and their withdraw is refused (VV-RUN-001 D2). No test covers this path; the randomized test encodes the owner-only rule. Found by VV-001 (F-03).", resolution: "pending ACT-001 (REV-063 not_decided): either drop a member's proposals whenever they stop owning the item, as relinquishing does, or let the proposer withdraw", provenance: {source: REV-063, created_by: ACT-002, authority: "REV-063", inputs: [project/assurance/runs/VV-RUN-001.txt, core/lib/findependence/household.ex], created_at: 2026-09-27}}
  - {id: DEF-041, type: Defeater, kind: implementation_defect, severity: minor, status: resolved, resolution_note: "WI-052: every claimed form token is kept for the session's life, and a tokenless household-changing request from an unlocked session is refused (403); demonstrated (UI-RUN-009 D3); verified by GATE-037 (the v0.7.2-alpha candidate). v0.7.1-alpha and earlier as released keep the 64-form limit", blocks_ratification: false,
     statement: "REQ-165 says a form that changes the household changes it at most once. The session remembers only the last 64 claimed form tokens (sessions.ex @forms_kept 64), so a form resent after 64 later forms is applied again, and a state-changing request without its _form token is never checked. Demonstrated: a resent form made a second item, and a form sent twice without _form made two (VV-RUN-001 D3). The app's own pages always send the token. Found by VV-001 (F-04).", resolution: "pending WI-052: remember every claimed token for the session's life, and refuse a household-changing request that has no token", provenance: {source: REV-063, created_by: ACT-002, authority: "REV-063", inputs: [project/assurance/runs/VV-RUN-001.txt, app/lib/findependence_app/sessions.ex, app/lib/findependence_app/web.ex], created_at: 2026-09-27}}
  - {id: DEF-042, type: Defeater, kind: implementation_defect, severity: minor, status: resolved, resolution_note: "By design (REV-069 disposition): the confirmation page is a safeguard against a member deleting by mistake, which REQ-166 governs; it is not an access control. A request that skips it still needs the session's CSRF token and a one-time form token, so it can only come from the member's own unlocked browser session, which could press the confirm button anyway. No change; ACT-001 may reopen", blocks_ratification: false,
     statement: "REQ-166's confirmation before deleting is enforced by the pages, not by the handler: a request posted straight to /act/delete or /act/delete_plan deletes without the confirmation page. Such a request still needs the session's CSRF token and a one-time form token, so it can only come from the member's own browser session. Found by VV-001 (F-07).", resolution: "pending (REV-069)", provenance: {source: REV-069, created_by: ACT-002, authority: "REV-069", inputs: [project/assurance/analysis/VV-001-system-verification-validation.md], created_at: 2026-09-28}}
  - {id: DEF-043, type: Defeater, kind: implementation_defect, severity: minor, status: resolved, resolution_note: "WI-056: the file is flushed to disk before the rename (tested by tracing). The BEAM cannot open a directory, so the rename is not flushed: a power cut can lose the latest save but not leave an empty or partial vault. Verified by GATE-038 (the v0.7.3-alpha candidate)", blocks_ratification: false,
     statement: "The vault is written to a temporary file and renamed into place, but neither the file nor its directory is flushed to disk (no fsync). A crashed process can't leave a partial vault, but after a power cut or kernel crash the latest save may be lost, or on some filesystems the renamed file may be empty. Found by VV-001 (F-11).", resolution: "pending (REV-069)", provenance: {source: REV-069, created_by: ACT-002, authority: "REV-069", inputs: [app/lib/findependence_app/vault.ex], created_at: 2026-09-28}}
  - {id: DEF-044, type: Defeater, kind: implementation_defect, severity: minor, status: resolved, resolution_note: "WI-056: any request other than the bring-in routes drops the waiting file, so leaving the preview brings nothing in (tested). Verified by GATE-038 (the v0.7.3-alpha candidate)", blocks_ratification: false,
     statement: "REQ-158 says nothing is saved if the member cancels or leaves the page. A checked bring-in file is held with the session until it ends, so after going to another page the member (or the Back button) can still send the preview's form and bring the file in. Found by VV-001 (F-12).", resolution: "pending (REV-069)", provenance: {source: REV-069, created_by: ACT-002, authority: "REV-069", inputs: [app/lib/findependence_app/sessions.ex, app/lib/findependence_app/web.ex], created_at: 2026-09-28}}
  - {id: DEF-045, type: Defeater, kind: implementation_defect, severity: minor, status: resolved, resolution_note: "By design (REV-069 disposition): the interface turns a typed 0 into no contribution (parse_money), and the core API has one way to clear (nil) and refuses 0 as ambiguous. Both are tested (v04_web_test, a zero contribution clears it; retirement_test). What the member sees is consistent. No change; ACT-001 may reopen", blocks_ratification: false,
     statement: "A retirement contribution of 0 clears the contribution through the interface, while the core function refuses 0 (REQ-150). The two layers disagree about what 0 means. Found by VV-001 (F-13).", resolution: "pending (REV-069)", provenance: {source: REV-069, created_by: ACT-002, authority: "REV-069", inputs: [core/lib/findependence/retirement.ex, app/lib/findependence_app/web.ex], created_at: 2026-09-28}}
  - {id: DEF-046, type: Defeater, kind: implementation_defect, severity: major, status: resolved, resolution_note: "WI-058: only a navigation drops the waiting file; /favicon.ico and requests a browser marks with Sec-Fetch-Dest other than document keep it (tested, deliberate break caught). Never released", blocks_ratification: false,
     statement: "WI-056's repair of DEF-044 dropped a waiting bring-in file on any request other than the bring-in routes, including a browser's own GET /favicon.ico after the preview loads. In a headed browser that fetches the tab icon, Bring it in would find nothing waiting. Headless Chromium made no such request, so WI-056's checks missed it. Found by WI-057 batch D.", resolution: "treat only navigation as leaving the page", provenance: {source: REV-069, created_by: ACT-002, authority: "REV-069", inputs: [app/lib/findependence_app/web.ex], created_at: 2026-09-28}}
  - {id: DEF-047, type: Defeater, kind: implementation_defect, severity: minor, status: resolved, resolution_note: "WI-058: a shared plan is named 'Trip (a plan)' on home's proposal line, the export page, the leave page, and the confirmation to stop owning (tested). Released versions name it without saying so", blocks_ratification: false,
     statement: "REQ-143 says every place a plan appears says it is a plan. A shared plan (REQ-148) was named without saying so on the owner's proposal line, the export page, the leave page, and the confirmation to stop owning. Found by WI-057 batch C.", resolution: "name shared plans as plans on those pages", provenance: {source: REV-069, created_by: ACT-002, authority: "REV-069", inputs: [app/lib/findependence_app/web/html.ex], created_at: 2026-09-28}}
  - {id: DEF-048, type: Defeater, kind: implementation_defect, severity: minor, status: resolved, resolution_note: "WI-058: the assumptions say the months count items you own and items shared with you that you've said go through your accounts (tested). Released versions say only items you own", blocks_ratification: false,
     statement: "The next twelve months (REQ-162) count shared items the member has attached to their accounts (REQ-160), but the page's assumptions paragraph said 'It counts only items you own', contradicting another sentence on the same page. Found by WI-057 batch C.", resolution: "correct the assumptions paragraph", provenance: {source: REV-069, created_by: ACT-002, authority: "REV-069", inputs: [app/lib/findependence_app/web/html.ex], created_at: 2026-09-28}}
  - {id: DEF-049, type: Defeater, kind: implementation_defect, severity: major, status: resolved, resolution_note: "WI-059 (REV-070): hand entry follows the file's rules, names 1 to 200 characters and amounts at most 1,000,000,000.00, in every form; a test enters boundary values in each and requires the export to pass the bring-in check. Verified by GATE-038 (the v0.7.3-alpha candidate). v0.7.2-alpha and earlier as released accept what they can't bring back (DEF-052)", blocks_ratification: false,
     statement: "REQ-157 says a brought-in file is checked by the same rules as entering by hand, but the two differ. Hand entry accepts an item name of any length or an empty one, and amounts beyond the file's range; the file check requires names of 1 to 200 characters and amounts within 1,000,000,000.00 either way. A member's own saved file is then refused when brought in (demonstrated: a 201-character name typed by hand is saved, and the export fails the check). CLM-035 and CLM-036 (v0.7.2-alpha) name REQ-157 as verified. Found by WI-057 batch D.", resolution: "pending ACT-001: tighten hand entry to the file's rules (recommended), or loosen the file check to hand entry's", provenance: {source: REV-069, created_by: ACT-002, authority: "REV-069", inputs: [core/lib/findependence/import.ex, app/lib/findependence_app/web.ex], created_at: 2026-09-28}}
  - {id: DEF-050, type: Defeater, kind: semantic_normative, severity: minor, status: resolved, resolution_note: "By ruling (REV-070): one dated occurrence is not the item's amount, so the dated rows need not show how often it happens. No change", blocks_ratification: false,
     statement: "REQ-129 says an item's frequency is shown wherever its amount is shown. The dated rows of Coming up and of the next 60 days show one occurrence's amount ('Rent −$1,450.00') without how often it happens; the item list, item page, export, and set-aside list do show it. Whether one dated occurrence is 'the item's amount' is a reading of the Requirement. Found by WI-057 batch B.", resolution: "pending ACT-001: rule that a dated occurrence is not the item's amount (recommended; the row is a date, not a schedule), or show the frequency there too", provenance: {source: REV-069, created_by: ACT-002, authority: "REV-069", inputs: [app/lib/findependence_app/web/html.ex], created_at: 2026-09-28}}
  - {id: DEF-051, type: Defeater, kind: implementation_defect, severity: minor, status: resolved, resolution_note: "WI-059 (REV-070): a member's saved forms are remembered across their sessions while the server runs; a repeat after unlocking again, or after the idle lock, says it was already saved (tested). After another member unlocks, nothing is said (WI-032). Forgotten when the server restarts. Verified by GATE-038 (the v0.7.3-alpha candidate)", blocks_ratification: false,
     statement: "REQ-165 says a repeated form changes nothing and says it was already saved. Within a session it does. After the session ends (Lock and unlock again, the idle lock, or another member unlocking), resending a form that was saved is refused with a message that nothing was saved and to do it again, because form tokens are remembered per session. The household is still changed at most once, but the member is told the opposite and may enter it again by hand. Found by WI-057 batch B.", resolution: "pending ACT-001: remember a member's saved form tokens across their sessions while the server runs, so a repeat after re-unlocking says it was already saved (recommended), or accept the limit and word the refusal so it doesn't say nothing was saved", provenance: {source: REV-069, created_by: ACT-002, authority: "REV-069", inputs: [app/lib/findependence_app/sessions.ex, app/lib/findependence_app/web.ex], created_at: 2026-09-28}}
  - {id: DEF-052, type: Defeater, kind: assurance, severity: material, status: resolved, resolution_note: "From v0.7.3-alpha, CLM-037 names REQ-157 with every acceptance criterion asserted, including that the file and hand entry follow the same rules (WI-059; VV-002). CLM-035 and CLM-036 keep their history and are read with this Defeater", blocks_ratification: false,
     statement: "CLM-035 and CLM-036 (v0.7.2-alpha, 9b82844) name REQ-157 as verified clause by clause. DEF-049 shows its 'same rules as entering by hand' clause was violated in that code: hand entry accepts names and amounts the file check refuses, so a member's own export can be refused. The clause had been counted as covered because its tests asserted only that bad files are refused, not that hand entry and the check agree. Found by WI-057 batch D.", resolution: "pending: the next version's Claims are made after WI-057's criteria (every clause of REQ-157 now has an asserting test, WI-059); CLM-035 and CLM-036 are read with this Defeater", provenance: {source: REV-070, created_by: ACT-002, authority: "REV-070", inputs: [project/assurance/claims.yaml, project/lifecycle/WI-059.yaml], created_at: 2026-09-28}}
  - {id: DEF-053, type: Defeater, kind: process, severity: minor, status: resolved, resolution_note: "GATE-038 targets every element whose files changed since v0.7.2-alpha, found from the diff against each element's paths, including IE-204 and IE-202 (their late change notes were added in WI-059)", blocks_ratification: false,
     statement: "GATE-037 (v0.7.2-alpha) re-verified IE-101 and IE-205, but WI-052 also changed app/lib/findependence_app/sessions.ex, which belongs to IE-204; the change was noted only under IE-205. The code was tested in REPRO-RUN-019 (app 231, e2e 54 of 54), but the gate record does not cover IE-204. WI-056 likewise noted its vault.ex change (IE-202) only under IE-205. Found by ACT-002 while recording WI-059.", resolution: "pending: the next gate targets every element whose paths changed (IE-101, IE-105, IE-107, IE-202, IE-204, IE-205), checked by listing changed paths against each element's paths", provenance: {source: REV-070, created_by: ACT-002, authority: "REV-070", inputs: [project/lifecycle/GATE-037.yaml, project/realization/implementation-prototype.yaml], created_at: 2026-09-28}}
  - {id: DEF-054, type: Defeater, kind: architecture_normative, severity: blocking, status: resolved, resolution_note: "ACT-001 kept REQ-124 AC-1 as written and chose CP-017 option C instead of B (REV-075); Petal is not used", blocks_ratification: false,
     statement: "CP-017 B cannot meet REQ-124 AC-1 as written. Petal Components 4.16.1 requires phoenix ~> 1.7, and every such phoenix release ships the Mix task phx.gen.release, which calls :httpc.request (phoenix 1.8.15, lib/mix/tasks/phx.gen.release.ex:497) to look up Docker image tags. The task is a developer tool and is never called by the served app, but AC-1 says neither the app nor its dependencies may contain an HTTP client or connect call. Found by WI-061 part 2, scanning every dependency's source; WI-061 stopped under its stop rule.",
     resolution: "pending ACT-001: restate AC-1 to mean what the running system can call (for example: no HTTP client or connect call reachable from the app's supervision tree or request handling, and none in any dependency's runtime code; developer-only Mix tasks excluded and listed), or keep AC-1 and fall back to CP-017 option C. Not a workaround ACT-002 may choose (WI-061 may_not).",
     provenance: {source: WI-061, created_by: ACT-002, authority: "REV-074", inputs: [project/lifecycle/WI-061.yaml, app/test/web_test.exs], created_at: 2026-09-28}}
  - {id: DEF-055, type: Defeater, kind: assurance, severity: minor, status: resolved, resolution_note: "WI-062: AC-1's test now reads every dependency's lib and src source (Elixir and Erlang) for network calls, not type names, and a second test shows it finds a planted :httpc and gen_tcp:connect call and passes over an :ssl type spec (app/test/web_test.exs; UI-RUN-011). CLM-037 carries a reading note that at 971039a AC-1 rested on WI-061's scan", blocks_ratification: false,
     statement: "REQ-124 AC-1's test (app/test/web_test.exs, 'no HTTP client or outbound-connection code in the app or its dependencies') scans the app's own source and the names of its direct dependencies only; it never reads a dependency's source. VV-002 and CLM-037 count AC-1 as verified by it. WI-061 scanned every dependency's source at v0.7.3-alpha (bandit, hpax, mime, plug, plug_crypto, telemetry, thousand_island, websock): the only matches are type specs naming :ssl.connection_info in plug and thousand_island, not calls, so the v0.7.3-alpha code meets AC-1; the test would not have noticed otherwise.",
     resolution: "pending: extend the test to scan every dependency's source for calls (not type names), and note in CLM-037's reading that AC-1 was confirmed by WI-061's scan.",
     provenance: {source: WI-061, created_by: ACT-002, authority: "REV-074", inputs: [app/test/web_test.exs, project/assurance/analysis/VV-002-requirement-audit.md], created_at: 2026-09-28}}
  - {id: DEF-056, type: Defeater, kind: architecture_normative, severity: material, status: resolved, blocks_ratification: false,
     statement: "ARCH-001 authorizes by tenant, and PostgreSQL enforces integrity with relational constraints (ARCH-001 3.3, 3.4, 6.2). Findependence also separates members within a household: each member's information is encrypted under a key only that member can unlock (REQ-121), and one member's condition is not reducible to the household's (PRI-002). ARCH-001 says nothing about data a tenant's other principals may not read, or about encrypted data at rest. Under CP-018 B the server holds a signed-in member's keys, so the operator can read that member's information while they are signed in, but another member of the same household still must not. Storing each member's information as an encrypted blob keeps REQ-121 but loses most of 6.2's database constraints; storing it as plain rows keeps 6.2 but breaks REQ-121 at rest. Found by ACT-002 mapping ARCH-001 onto the project (CP-019).",
     resolution_note: "Resolved by DP-001 section 8.2, ratified in REV-085. REV-083 (CP-020 D5) decided the approach and its placement: encryption inside the public context operations; the design is recorded in the domain profile DP-001 (CP-020 U2), which resolves this Defeater", resolution: "pending: ACT-002 drafts the hosted form's storage and authorization design on the approach ACT-001 approved (REV-079): each member's information encrypted under their own key in PostgreSQL rows; household, membership, ownership and versions in plain columns carrying the database constraints; each member's key wrapped by their passphrase, unwrapped at sign-in and held in memory only for the session; authorization by member inside the household tenant. ACT-001 decides before any persistence work (CP-019 open decision 3)",
     provenance: {source: CP-019, created_by: ACT-002, authority: "REV-078", inputs: [project/assurance/design/ARCH-001-reference-architecture.md, project/realization/requirements-prototype.yaml, project/semantic/principles.yaml], created_at: 2026-09-28}}
  - {id: DEF-057, type: Defeater, kind: assurance, severity: material, status: resolved, resolution_note: "Local-first form closed by WI-067 (TEST-RUN-015): app/test/egress_test.exs runs the system under a call trace through all 32 routes and real loopback HTTP and finds no connect or lookup, and fails on planted calls, including inside the server. Hosted form closed by WI-073 (TEST-RUN-019), whose allowlist holds only its own database (REV-098): hosted/test/findependence_hosted/egress_test.exs traces every process while a fresh database connection is opened, all 17 routes are exercised, and a loopback listener is used with curl; every connect and lookup is to the configured database's host and port, and planted calls are reported. The test fails on any route it does not exercise, so WI-074's routes must be added to it. Neither closure is a Claim on REQ-124", resolved_by: {work_item: WI-073, change: CHG-096, at: 2026-09-29}, blocks_ratification: false,
     statement: "REQ-124 as restated (REV-079, enacted by WI-064) asks for a test that starts the system, exercises every route kind, and fails on a connect or lookup to any destination not on the deployment's egress allowlist, and on a planted call. No such test exists for either form. The local-first form has app/test/web_test.exs, which scans the app's and every dependency's source for network calls (DEF-055) and is stricter than the restated AC-1 about what the code contains, but it does not run the system; the hosted form has no egress test and no adapters yet. CLM-037 (at 971039a) and the earlier implementation Claim on app/ assert REQ-124 under its previous wording, which is kept in REQ-124's restatements; they are not reassessed by the restatement.",
     resolution: "pending: a WorkItem writes the runtime egress test for the local-first form (empty allowlist) now, and for the hosted form with its first outbound adapter (CP-020 U6); until then no Claim asserts REQ-124 as restated",
     provenance: {source: WI-064, created_by: ACT-002, authority: "REV-083", inputs: [project/realization/requirements-prototype.yaml, app/test/web_test.exs, project/assurance/claims.yaml], created_at: 2026-09-29}}
  - {id: DEF-058, type: Defeater, kind: architecture_normative, severity: minor, status: resolved, resolution_note: "WI-068 (TEST-RUN-017): the router decodes only; REQ-150 ranges are checked by the Planning context with Retirement.valid?/2, REQ-131 reading rules by the Balances context with core predicates (valid_owed?, valid_rate?, valid_min_payment?) that core's own reading check now uses, the set-aside rate by core's set_aside/4, and a borrowing step by Plans.valid_borrow?/1, which uses the same rate predicate; messages and order unchanged; the boundary test fails on a range or limit in the router", blocks_ratification: false,
     statement: "After WI-066 the local-first router (app/lib/findependence_app/web.ex) still decides some field-level rules that are domain rules, not decoding: the retirement assumptions' ranges (birth year 1900..2100, retirement age 40..90, return -5% to 15%; REQ-150), a debt's rate at most 100% and a reading's balance rules (REQ-131), and the fund-goal months and set-aside rate checks (REQ-146, REQ-147). ARCH-003 5 and 7 put product semantics in the context operations, so a second transport would have to repeat them. WI-066 moved only the rules it named (REQ-129, REQ-136, REQ-157 and the plan-step checks). Some of these ranges are also enforced in core/ (for example Retirement), so they are defined twice.",
     resolution: "pending: a WorkItem moves each into core/ or the contexts with one definition, keeping the field-level messages and their order, under the same no-change evidence as WI-066",
     provenance: {source: WI-066, created_by: ACT-002, authority: "REV-086", inputs: [app/lib/findependence_app/web.ex, project/assurance/design/ARCH-003-platform-reference.md], created_at: 2026-09-29}}
  - {id: DEF-059, type: Defeater, kind: security, severity: material, status: resolved, resolution_note: "REV-095 chose (a): no reset without the recovery key; REQ-184 AC-4 states it", blocks_ratification: false,
     statement: "REV-094 H2 says that without the recovery key a hosted account can be reset, losing its private information. With no email (H3), nothing would prove that the person resetting owns the account: anyone who knew or guessed a member's address could reset it and sign in as that member, keeping their place in the household, receiving what other members share with them from then on, and appearing to others under their name. The reset loses only the old private information, not the membership. WI-071 drafted REQ-184 without the reset.",
     resolution: "pending ACT-001: (a) no reset without the recovery key: a person who has lost both makes a new account and is invited again, and the old membership remains until a later decision on removing a member who cannot sign in; (b) a reset confirmed by other members of the household, which gives members a say over another's account and needs checking against PRI-002; or (c) email confirmation of resets, which needs an email provider on the egress allowlist (REQ-124) and CTX-001's jurisdiction check",
     provenance: {source: WI-071, created_by: ACT-002, authority: "REV-094", inputs: [project/governance/REV-094.yaml, project/realization/requirements-hosted.yaml], created_at: 2026-09-29}}
  - {id: DEF-060, type: Defeater, kind: semantic, severity: minor, status: resolved, resolution_note: "REV-102 chose (a): REQ-191 AC-2 restated as telemetry output, the earlier wording kept in its restatements; what WI-073 tests (the only handlers are Phoenix's and LiveView's loggers, every parameter filtered, no reporter) is what the restated criterion asks", resolved_by: {review: REV-102, change: CHG-102, at: 2026-09-29}, blocks_ratification: false,
     statement: "REQ-191 AC-2 says no telemetry event contains a passphrase, recovery key, token, email address, name, or other content. Phoenix's and Ecto's telemetry events carry the request (with its form parameters) and query parameters in their metadata, in memory, to whatever handlers are attached; no configuration removes them. Read literally, the criterion cannot be met by a Phoenix and Ecto service. WI-073 meets what it can: the only handlers attached are Phoenix's and LiveView's loggers, which write through Logger with every parameter filtered; the Repo does not log queries; no reporter or exporter runs; a test fails if another handler is attached (TEST-RUN-019).",
     resolution: "pending ACT-001: (a) restate AC-2 as 'no audit record, log line, or telemetry output (what a handler records, reports, or exports) contains ...', keeping the literal wording in the restatements, which matches what WI-073 tests; or (b) keep the wording and accept that the criterion is met only in that sense, recorded in the disposition",
     provenance: {source: WI-073, created_by: ACT-002, authority: "REV-097", inputs: [project/realization/requirements-hosted.yaml, hosted/test/findependence_hosted/foundation_test.exs], created_at: 2026-09-29}}
  - {id: DEF-061, type: Defeater, kind: implementation_defect, severity: material, status: resolved, resolved_by: {work_item: WI-076, change: CHG-104, at: 2026-09-29}, resolution_note: "Fixed by WI-076 (TEST-RUN-022): the shared envelope drops a member's contributions to accounts no longer in the household when their view is built, so they are gone at their next save; the REQ-150 AC-9 contract case passes on both forms (and fails with the fix taken out). CLM-038, a Claim about commit 2608198 where the defect was, is weakened by ASMT-028. Earlier: REV-102 chose (a): drop a member's contributions to accounts that no longer exist when their view is built, and from the record at their next save, as the local form does for links; it changes the local form, so it needs a WorkItem (proposed within WI-076, decision I1) and CLM-038's claim on REQ-150 reassessed", blocks_ratification: false,
     statement: "REQ-150 AC-9 says deleting a retirement account removes every member's contribution to it. In both forms, when the owner deletes a retirement account that another member contributes to (it was shared with them), the other member's contribution stays in their own personal record: their retirement settings still list it (for example %{<account id> => 20000}), though the projection ignores it because the account is gone. Core's Retirement.purge_item clears every member's contribution in the household it is given, but each form saves only the acting member's personal record, which is encrypted under that member's own key (REQ-121); another member's record can't be rewritten by anyone else. The test VV-002 cites (core/test/retirement_test.exs:121) covers only the deleting member's own contribution, so CLM-038's claim on REQ-150 rests on evidence that doesn't reach this case. Found by WI-074's contract case, which fails the same way on both forms and is skipped naming this Defeater.",
     resolution: "pending ACT-001: (a) as the local form already does for links to items someone else deleted (Envelope.build, ASM-018), drop a member's contributions to accounts that no longer exist when their view is built, and remove them from the record at their next save; this changes the local form's behaviour (a WorkItem outside WI-074, whose may_not forbids it) and needs CLM-038's claim on REQ-150 reassessed; or (b) restate AC-9 to say the contribution stops counting and is removed at that member's next change",
     provenance: {source: WI-074, created_by: ACT-002, authority: "REV-099", inputs: [project/realization/requirements-v04.yaml, core/test/retirement_test.exs, shared/test/support/contract/req146_157_cases.ex], created_at: 2026-09-29}}
  - {id: DEF-062, type: Defeater, kind: implementation_defect, severity: material, status: resolved, blocks_ratification: false,
     statement: "In WI-073's hosted form, signing out, a session ended after 15 idle minutes, and (in WI-074) leaving and account deletion dropped the session and then set the message for the next page, which the dropped session discarded: the member was signed out without being told why, so REQ-183 AC-1's 'the next request finds the member signed out and says so' was not met. WI-073's test asserted the message on the redirect itself, not on the page that follows, so TEST-RUN-019 recorded REQ-183 AC-1 as met in error.",
     resolution: "Fixed by WI-074 (TEST-RUN-020): the session is cleared and renewed instead of dropped, so the message survives; a test follows each redirect and finds the message on the page shown, and fails when one site is put back (planted and restored). WI-073's record keeps its result, with a correction naming this Defeater",
     resolved_by: {work_item: WI-074, change: CHG-098, at: 2026-09-29},
     provenance: {source: WI-074, created_by: ACT-002, authority: "REV-099", inputs: [hosted/lib/findependence_hosted_web/auth.ex, hosted/test/findependence_hosted/foundation_test.exs, project/assurance/runs/TEST-RUN-019.txt], created_at: 2026-09-29}}
  - {id: DEF-063, type: Defeater, kind: semantic, severity: minor, status: resolved, resolution_note: "REV-105 approved CP-022 option A: REQ-188, REQ-190, and REQ-191 derived from PRI-003 as well; trace passes (CHG-106)", resolved_by: {review: REV-105, change: CHG-106, at: 2026-09-30}, blocks_ratification: false,
     statement: "REQ-191 (audit of security-relevant events) is derived only from CTX-001, a context with no path to the Subject; so is REQ-188 and REQ-190. When WI-077 realized REQ-191 with IE-211, which satisfies only REQ-191, trace found a dead end (IE-211 -> REQ-191 -> CTX-001). REQ-188 and REQ-190 pass only because IE-210 also satisfies Requirements with a path. The derivation of a ratified Requirement is ACT-001's (REV-095), so ACT-002 does not add one.",
     resolution: "pending ACT-001: CP-022 proposes deriving REQ-191 from PRI-003 (a member's delegation is chosen and revocable: auditing what the operator does while trusted is what makes that delegation accountable, as REQ-180 tells members they trust the operator), and asks whether REQ-188 and REQ-190 should be derived likewise",
     provenance: {source: WI-077, created_by: ACT-002, authority: "REV-104", inputs: [project/realization/requirements-hosted.yaml, project/semantic/principles.yaml], created_at: 2026-09-30}}
  - {id: DEF-064, type: Defeater, kind: security, severity: high, status: resolved, resolution_note: "WI-079 merged into main at a2e59f7 (TEST-RUN-024); CLM-039 weakened for REQ-133 at c3f0fda (ASMT-030)", resolved_by: {review: REV-106, change: CHG-110, at: 2026-09-30}, blocks_ratification: false, challenges: [CLM-039],
     statement: "ASSESS-001 FND-01 (HIGH, CONFIRMED): A planted key entry makes an honest save hand balance readings and new history entries to a member who edited the vault file. An honest save treats a reader with any entry in the item's keys map as legitimate and seals fresh reading and ledger keys to them. The integrity banner shows nothing, or clears after the save.",
     resolution: "WI-079 (Extend keys only to readers whose existing seal the session can verify is of the same key (e.g. HMAC(item_key, recipient) stored with each seal); otherwise never to baseline readers. Longer term, SELF-REVIEW option (a), a signed operation log.); resolved when findependence/wi-079-a (FND-01, FND-02, FND-04) and findependence/wi-079-b (the rest) are merged into main",
     provenance: {source: ASSESS-001, created_by: ACT-002, authority: "REV-106", inputs: [project/assurance/security-review/ASSESS-001-implementation-assessment.md], created_at: 2026-09-30}}
  - {id: DEF-065, type: Defeater, kind: security, severity: high, status: resolved, resolution_note: "WI-079 merged into main at a2e59f7 (TEST-RUN-024)", resolved_by: {review: REV-106, change: CHG-110, at: 2026-09-30}, blocks_ratification: false,
     statement: "ASSESS-001 FND-02 (HIGH, LIKELY): Stored bytes are decoded with binary_to_term [:safe], which still accepts function terms, and the decoded vault is not shape-checked. A function value from the file reached application code and was invoked in a same-VM test. Whether an attacker can turn this into code execution in the real server was not established.",
     resolution: "WI-079 (Decode with Plug.Crypto.non_executable_binary_to_term(bin, [:safe]) (or a fixed binary framing), then validate the whole vault or row against a strict schema before use.); resolved when findependence/wi-079-a (FND-01, FND-02, FND-04) and findependence/wi-079-b (the rest) are merged into main",
     provenance: {source: ASSESS-001, created_by: ACT-002, authority: "REV-106", inputs: [project/assurance/security-review/ASSESS-001-implementation-assessment.md], created_at: 2026-09-30}}
  - {id: DEF-066, type: Defeater, kind: security, severity: high, status: resolved, resolution_note: "WI-079 merged into main at a2e59f7 (TEST-RUN-024)", resolved_by: {review: REV-106, change: CHG-110, at: 2026-09-30}, blocks_ratification: false,
     statement: "ASSESS-001 FND-03 (HIGH, CONFIRMED): A recovery key never expires, cannot be replaced, and still works after the owner changes their passphrase. Complete, repeatable account takeover. The owner is signed out and cannot revoke the old key.",
     resolution: "WI-079 (Let a signed-in member replace the recovery key (re-wrap under a new key, re-authenticated); replace it after every recovery; offer it on passphrase change; tell the member at next sign-in that a recovery happened.); resolved when findependence/wi-079-a (FND-01, FND-02, FND-04) and findependence/wi-079-b (the rest) are merged into main",
     provenance: {source: ASSESS-001, created_by: ACT-002, authority: "REV-106", inputs: [project/assurance/security-review/ASSESS-001-implementation-assessment.md], created_at: 2026-09-30}}
  - {id: DEF-067, type: Defeater, kind: security, severity: major, status: resolved, resolution_note: "WI-079 merged into main at a2e59f7 (TEST-RUN-024); forged consents, removals, and rollback stay under DEF-028", resolved_by: {review: REV-106, change: CHG-110, at: 2026-09-30}, blocks_ratification: false,
     statement: "ASSESS-001 FND-04 (MEDIUM, CONFIRMED): Item content and history entries can be forged by anyone holding only public keys. A forged item ('Transfer to Cy (agreed)', owned by Ana) and a forged 'Ana granted Ben' entry appear as genuine; no banner.",
     resolution: "WI-079 (Sign content, entries and readings with the actor's pinned signing key and verify on build (SELF-REVIEW option (a)). Correct DESIGN.md: associated data prevents moving boxes, not forging them.); resolved when findependence/wi-079-a (FND-01, FND-02, FND-04) and findependence/wi-079-b (the rest) are merged into main",
     provenance: {source: ASSESS-001, created_by: ACT-002, authority: "REV-106", inputs: [project/assurance/security-review/ASSESS-001-implementation-assessment.md], created_at: 2026-09-30}}
  - {id: DEF-068, type: Defeater, kind: security, severity: major, status: resolved, resolution_note: "WI-079 merged into main at a2e59f7 (TEST-RUN-024)", resolved_by: {review: REV-106, change: CHG-110, at: 2026-09-30}, blocks_ratification: false,
     statement: "ASSESS-001 FND-05 (MEDIUM, CONFIRMED): Crashes write decrypted household data, and a malformed sign-in the typed passphrase, to the console log. Breaks G5 (no plaintext except by the user's choice) for any crash, including future honest-input bugs.",
     resolution: "WI-079 (Type-guard every parameter; an error handler that logs a reason code only; rescue in Store.handle_call; Inspect with except: for session structs; limit crash-report inspection.); resolved when findependence/wi-079-a (FND-01, FND-02, FND-04) and findependence/wi-079-b (the rest) are merged into main",
     provenance: {source: ASSESS-001, created_by: ACT-002, authority: "REV-106", inputs: [project/assurance/security-review/ASSESS-001-implementation-assessment.md], created_at: 2026-09-30}}
  - {id: DEF-069, type: Defeater, kind: security, severity: major, status: resolved, resolution_note: "WI-079 merged into main at a2e59f7 (TEST-RUN-024)", resolved_by: {review: REV-106, change: CHG-110, at: 2026-09-30}, blocks_ratification: false,
     statement: "ASSESS-001 FND-06 (MEDIUM, CONFIRMED): Anyone who knows a member's address can keep them locked out, and sign-up reveals which addresses have accounts. 10 wrong passphrases lock the real owner out for 15 minutes, repeatable indefinitely. Sign-up (unlimited) confirms which addresses are registered.",
     resolution: "WI-079 (Throttle rather than lock (progressive delay per address+client), exempt the correct passphrase from a client-independent lock, or add a second factor; limit sign-up per client and answer taken addresses the same as new ones.); resolved when findependence/wi-079-a (FND-01, FND-02, FND-04) and findependence/wi-079-b (the rest) are merged into main",
     provenance: {source: ASSESS-001, created_by: ACT-002, authority: "REV-106", inputs: [project/assurance/security-review/ASSESS-001-implementation-assessment.md], created_at: 2026-09-30}}
  - {id: DEF-070, type: Defeater, kind: implementation_defect, severity: major, status: resolved, resolution_note: "WI-079 merged into main at a2e59f7 (TEST-RUN-024)", resolved_by: {review: REV-106, change: CHG-110, at: 2026-09-30}, blocks_ratification: false,
     statement: "ASSESS-001 FND-07 (MEDIUM, CONFIRMED): One invitation code admits several people when redeemed concurrently. The single-use property fails; extra members join (they gain membership and metadata, not item access).",
     resolution: "WI-079 (Claim the code inside the transaction with UPDATE invitations SET used_at=now() WHERE id=$1 AND used_at IS NULL AND withdrawn_at IS NULL AND expires_at>now(), requiring exactly one row.); resolved when findependence/wi-079-a (FND-01, FND-02, FND-04) and findependence/wi-079-b (the rest) are merged into main",
     provenance: {source: ASSESS-001, created_by: ACT-002, authority: "REV-106", inputs: [project/assurance/security-review/ASSESS-001-implementation-assessment.md], created_at: 2026-09-30}}
  - {id: DEF-071, type: Defeater, kind: implementation_defect, severity: major, status: resolved, resolution_note: "WI-079 merged into main at a2e59f7 (TEST-RUN-024)", resolved_by: {review: REV-106, change: CHG-110, at: 2026-09-30}, blocks_ratification: false,
     statement: "ASSESS-001 FND-08 (MEDIUM, CONFIRMED): A leftover consent row stops a member who owns nothing from leaving or deleting their account. POST /leave fails with 500; the member stays in the household and cannot delete the account. Only the other owners can clear it.",
     resolution: "WI-079 (Remove the leaver from every proposal's consents in Exit.leave; delete the departed member's proposal_members rows before the membership (or ON DELETE CASCADE).); resolved when findependence/wi-079-a (FND-01, FND-02, FND-04) and findependence/wi-079-b (the rest) are merged into main",
     provenance: {source: ASSESS-001, created_by: ACT-002, authority: "REV-106", inputs: [project/assurance/security-review/ASSESS-001-implementation-assessment.md], created_at: 2026-09-30}}
  - {id: DEF-072, type: Defeater, kind: security, severity: major, status: resolved, resolution_note: "WI-079 merged into main at a2e59f7 (TEST-RUN-024)", resolved_by: {review: REV-106, change: CHG-110, at: 2026-09-30}, blocks_ratification: false,
     statement: "ASSESS-001 FND-09 (MEDIUM, LIKELY): Attempt limits are keyed on the connection's address, so behind the required reverse proxy every visitor shares one counter. 30 failures from anyone refuse sign-in, recovery and joining for everyone for 15 minutes.",
     resolution: "WI-079 (Take the client from a trusted proxy's X-Forwarded-For only (RemoteIp limited to the proxy), in the deploying WorkItem.); resolved when findependence/wi-079-a (FND-01, FND-02, FND-04) and findependence/wi-079-b (the rest) are merged into main",
     provenance: {source: ASSESS-001, created_by: ACT-002, authority: "REV-106", inputs: [project/assurance/security-review/ASSESS-001-implementation-assessment.md], created_at: 2026-09-30}}
  - {id: DEF-073, type: Defeater, kind: security, severity: major, status: resolved, resolution_note: "WI-079 merged into main at a2e59f7 (TEST-RUN-024)", resolved_by: {review: REV-106, change: CHG-110, at: 2026-09-30}, blocks_ratification: false,
     statement: "ASSESS-001 FND-10 (MEDIUM, CONFIRMED): Every page loads and decodes the whole household, and nothing bounds a household's size. GET / grew from 6 ms to 499 ms between 0 and 2,000 items, faster than linear.",
     resolution: "WI-079 (A per-household and per-member item cap; per-member write rate limits; load only the member's readable rows plus structure; profile the superlinear step.); resolved when findependence/wi-079-a (FND-01, FND-02, FND-04) and findependence/wi-079-b (the rest) are merged into main",
     provenance: {source: ASSESS-001, created_by: ACT-002, authority: "REV-106", inputs: [project/assurance/security-review/ASSESS-001-implementation-assessment.md], created_at: 2026-09-30}}
  - {id: DEF-074, type: Defeater, kind: security, severity: minor, status: resolved, resolution_note: "WI-079 merged into main at a2e59f7 (TEST-RUN-024)", resolved_by: {review: REV-106, change: CHG-110, at: 2026-09-30}, blocks_ratification: false,
     statement: "ASSESS-001 FND-11 (LOW, CONFIRMED): The relinquish confirmation names the owners of an item the member cannot see. 'LB and LD will keep it.' for a hidden item versus 'No one will keep it.' for a missing id.",
     resolution: "WI-079 (Require the item to be visible and owned by the member; otherwise the not-found page.); resolved when findependence/wi-079-a (FND-01, FND-02, FND-04) and findependence/wi-079-b (the rest) are merged into main",
     provenance: {source: ASSESS-001, created_by: ACT-002, authority: "REV-106", inputs: [project/assurance/security-review/ASSESS-001-implementation-assessment.md], created_at: 2026-09-30}}
  - {id: DEF-075, type: Defeater, kind: implementation_defect, severity: minor, status: resolved, resolution_note: "WI-079 merged into main at a2e59f7 (TEST-RUN-024)", resolved_by: {review: REV-106, change: CHG-110, at: 2026-09-30}, blocks_ratification: false,
     statement: "ASSESS-001 FND-12 (LOW, CONFIRMED): Refusals from pages other than home, and unexpected parameter shapes, crash with 500. A refused item action whose return path is not a visible item page shows a 500 instead of its message; list/map parameters give 500s. No state changed in any case tested.",
     resolution: "WI-079 (put_view(HomeHTML) in render_home; guard parameter types (is_binary) at decoding.); resolved when findependence/wi-079-a (FND-01, FND-02, FND-04) and findependence/wi-079-b (the rest) are merged into main",
     provenance: {source: ASSESS-001, created_by: ACT-002, authority: "REV-106", inputs: [project/assurance/security-review/ASSESS-001-implementation-assessment.md], created_at: 2026-09-30}}
  - {id: DEF-076, type: Defeater, kind: security, severity: minor, status: resolved, resolution_note: "WI-079 merged into main at a2e59f7 (TEST-RUN-024); container image digests not pinned (need registry access), recorded in WI-079 not_done", resolved_by: {review: REV-106, change: CHG-110, at: 2026-09-30}, blocks_ratification: false,
     statement: "ASSESS-001 hardening findings FND-13..FND-21 (LOW and INFO): FND-13 production database settings: no TLS, one owner role for migrations and runtime, audit table writable, FND-14 hosted signed-in pages and the export download may be kept in the browser cache, FND-15 local flash messages carrying item names travel in a signed but unencrypted cookie, FND-16 local 421 and 500 responses lack the security headers, FND-17 a malformed vault file, or a few crashing requests, stop the local server, FND-18 the built release's distribution cookie is world-readable, FND-19 hosted sessions have no absolute lifetime and are node-local, FND-20 production configuration accepts a default host and an unchecked email-hash key, FND-21 smaller hardening items.",
     resolution: "WI-079 (each mitigated as ASSESS-001's table says, except container image digests, which need registry access); resolved when findependence/wi-079-a (FND-01, FND-02, FND-04) and findependence/wi-079-b (the rest) are merged into main",
     provenance: {source: ASSESS-001, created_by: ACT-002, authority: "REV-106", inputs: [project/assurance/security-review/ASSESS-001-implementation-assessment.md], created_at: 2026-09-30}}
