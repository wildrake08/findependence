    - {id: AC-2, criterion: "The preview names what becomes the member's: the items, values, accounts, debts, and plans, by name, shown as text.", evidence: ["app/test/v05_web_test.exs:177 REQ-156/158: check, preview, then bring in as the member's alone", "app/test/vv_f05_d_test.exs:538 REQ-158: the preview counts debts and goals, with the debts' names", "app/test/v05_web_test.exs:359 REQ-158: names from the file are shown as text, never as markup"]}
    - {id: AC-3, criterion: "Nothing is saved while the preview is shown.", evidence: ["app/test/v05_web_test.exs:177 REQ-156/158: check, preview, then bring in as the member's alone", "app/test/vv_f05_d_test.exs:538 REQ-158: the preview counts debts and goals, with the debts' names"]}
    - {id: AC-4, criterion: "In a browser, choosing 'Bring it in' on the preview brings the file in.", evidence: ["app/test/v05_web_test.exs:177 REQ-156/158: check, preview, then bring in as the member's alone"]}
    - {id: AC-5, criterion: "Choosing Cancel, or locking, saves nothing.", evidence: ["app/test/v05_web_test.exs:253 REQ-158: cancelling, or locking, brings nothing in"]}
    - {id: AC-6, criterion: "Leaving the preview for another page saves nothing, and its form sent afterwards brings nothing in.", evidence: ["app/test/v05_web_test.exs:232 REQ-158 (DEF-044): leaving the preview drops the file; its form then brings nothing in"]}
  notes: "AC-4 is asserted at the HTTP level only. Since WI-056 any request other than the bring-in routes drops the waiting file, including requests a browser makes by itself. Reproduced with a temporary test (removed): upload a valid file (preview, 200); GET /favicon.ico with the same session cookie (404); then POST /act/bring-in/confirm with the preview's _csrf_token and _form: redirected to /bring-in, 'Nothing is waiting to be brought in', nothing saved. Pages have no icon link, and headed Chrome and Firefox usually request /favicon.ico after such a page loads, which would make 'Bring it in' fail in real use. Headless Chromium 154 here made no favicon request, so the browser effect is not observed in this environment. It needs a check in a headed browser (another environment): probable defect, Defeater proposed, not filed. 'The names of what becomes theirs' is read as the named entries (items, values, accounts, debts, plans); readings, links, marks, and goals have no names and are counted."

