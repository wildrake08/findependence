    - {id: AC-3, criterion: "Accounts' and debts' readings come in on the new entries, with the same dates and values.", evidence: ["core/test/vv_f05_d_test.exs:486 links, marks, plan steps, set-asides, contributions, and readings name the new entries"]}
    - {id: AC-4, criterion: "Links between entries in the file join the corresponding new entries.", evidence: ["core/test/vv_f05_d_test.exs:486 links, marks, plan steps, set-asides, contributions, and readings name the new entries"]}
    - {id: AC-5, criterion: "Plans (their steps), marks, goals (set-asides), retirement assumptions (contributions), and attachments name the new entries.", evidence: ["core/test/vv_f05_d_test.exs:486 links, marks, plan steps, set-asides, contributions, and readings name the new entries", "core/test/import_test.exs:237 everything becomes the member's alone, and works the same as before"]}
    - {id: AC-6, criterion: "Goals and assumptions the member already set are kept; only unset ones are filled from the file.", evidence: ["core/test/import_test.exs:319 goals and assumptions already set are kept; only unset ones are filled"]}
    - {id: AC-7, criterion: "Owners, sharing, and history from the old household are not brought in: each new entry's history has only its creation by the member and the readings they brought in.", evidence: ["core/test/vv_f05_d_test.exs:516 no history, owners, or sharing from the old household: each history starts with the bringing in"]}
    - {id: AC-8, criterion: "Shared plans are not brought in.", evidence: ["core/test/import_test.exs:237 everything becomes the member's alone, and works the same as before", "app/test/v05_web_test.exs:177 REQ-156/158: check, preview, then bring in as the member's alone"]}
    - {id: AC-9, criterion: "The member is told that owners, sharing, history, and shared plans are not brought in (on the preview), and that only they own what came in (after confirming).", evidence: ["app/test/vv_f05_d_test.exs:521 REQ-156: the member is told that owners, sharing, history, and shared plans aren't brought in", "app/test/v05_web_test.exs:177 REQ-156/158: check, preview, then bring in as the member's alone"]}
    - {id: AC-10, criterion: "Each new entry's history begins with its being brought in by the member.", evidence: ["core/test/import_test.exs:237 everything becomes the member's alone, and works the same as before", "core/test/vv_f05_d_test.exs:516 no history, owners, or sharing from the old household: each history starts with the bringing in", "app/test/v05_web_test.exs:177 REQ-156/158: check, preview, then bring in as the member's alone"]}
  notes: "AC-9: the preview says 'Its history, owners, and who it was shared with in the other household stay in your file.' This is read as telling the member they are not brought in (interpretation)."

REQ-157:
  result: Not Verified
  acceptance_criteria:
    - {id: AC-1, criterion: "A file of more than 1 MB (1,048,576 bytes) is refused, before it is read when the upload itself is over the limit; a file of exactly 1 MB is checked.", evidence: ["app/test/v05_web_test.exs:274 REQ-157: a file that fails a check is refused whole, saying what and where", "app/test/v05_web_test.exs:305 REQ-157: a body over the limit is refused before it is read", "app/test/vv_f05_d_test.exs:560 REQ-157: a file of exactly 1 MB is checked; one byte more is refused"]}
    - {id: AC-2, criterion: "A file that isn't valid JSON is refused.", evidence: ["app/test/v05_web_test.exs:274 REQ-157: a file that fails a check is refused whole, saying what and where"]}
    - {id: AC-3, criterion: "A file of an unknown format or version is refused.", evidence: ["core/test/import_test.exs:405 anything wrong refuses the whole file, saying what and where"]}
    - {id: AC-4, criterion: "Every field is checked: amounts in whole cents within range, known frequencies and kinds, valid dates and months, names within length, and references that resolve within the file; unknown fields are refused.", evidence: ["core/test/import_test.exs:405 anything wrong refuses the whole file, saying what and where", "core/test/import_test.exs:501 a fault is reported once, where it is, and not again at what refers to it"]}
    - {id: AC-5, criterion: "The checks are the same rules as entering by hand: a value the interface accepts when typed by hand is accepted in the file, and one it refuses is refused.", evidence: []}
    - {id: AC-6, criterion: "If any check fails, nothing is brought in, and the member is told what failed and where in the file.", evidence: ["app/test/v05_web_test.exs:274 REQ-157: a file that fails a check is refused whole, saying what and where", "core/test/import_test.exs:405 anything wrong refuses the whole file, saying what and where"]}
    - {id: AC-7, criterion: "Nothing in the file creates an atom or runs: unknown keys and values never become atoms, and names from the file are shown as text, never markup or script.", evidence: ["core/test/import_test.exs:510 a file can't create atoms, and at most 20 problems are reported", "app/test/v05_web_test.exs:274 REQ-157: a file that fails a check is refused whole, saying what and where", "app/test/v05_web_test.exs:359 REQ-158: names from the file are shown as text, never as markup"]}
  notes: "AC-5 fails: hand entry has no name length limit, allows an empty name, and has no upper limit on amounts, while the file check refuses names over 200 characters, empty names, and amounts over 1,000,000,000.00. So a member's own saved file is refused. Reproduced by three temporary interface tests (removed, as instructed): unlock as ana; on home add an item named with 201 letters 'a', amount 10, money out, monthly (saved, 303); or named '' (empty), amount 5, money in, monthly (saved; stored note ''); or named 'Lottery', amount 1,000,000,001, money in, one-off (saved). Then GET /export.json and upload that file at /bring-in (as ben or ana): 422, 'Nothing was brought in', with 'Number 3 in the file, name: must be 1 to 200 characters of text.' (long or empty name) or 'Number 3 in the file, amount: isn't an amount in whole cents within range.' Whether hand entry or the file check should change is an upstream decision (Defeater proposed, not filed). 1 MB is read as 1,048,576 bytes, as the implementation does (interpretation)."

