    - {id: AC-2, criterion: "It carries the member's own plans with their steps.", evidence: ["core/test/import_test.exs:186 carries the member's own plans, marks, goals, and retirement, and nothing of anyone else's"]}
    - {id: AC-3, criterion: "It carries the member's marks on items they own.", evidence: ["core/test/import_test.exs:186 carries the member's own plans, marks, goals, and retirement, and nothing of anyone else's", "core/test/vv_f05_d_test.exs:408 nothing in it belongs to anyone else"]}
    - {id: AC-4, criterion: "It carries the member's goals: the fund goal and set-aside rates.", evidence: ["core/test/import_test.exs:186 carries the member's own plans, marks, goals, and retirement, and nothing of anyone else's", "core/test/vv_f05_d_test.exs:408 nothing in it belongs to anyone else"]}
    - {id: AC-5, criterion: "It carries all of the member's retirement assumptions: birth year, retirement age, return, Social Security estimate, target, and contributions.", evidence: ["core/test/vv_f05_d_test.exs:408 nothing in it belongs to anyone else", "core/test/import_test.exs:186 carries the member's own plans, marks, goals, and retirement, and nothing of anyone else's"]}
    - {id: AC-6, criterion: "A set-aside for a value the member doesn't own, and a contribution to an account they don't own, are left out.", evidence: ["core/test/import_test.exs:222 leaves out set-asides and contributions for what the member doesn't own"]}
    - {id: AC-7, criterion: "Marks, plan steps, and links that name an entry the member doesn't own (relinquished, deleted, or only shared with them) are left out, and every reference left in the file names an entry in it.", evidence: ["core/test/vv_f05_d_test.exs:376 marks, plan steps, and links naming entries the member doesn't own are left out"]}
    - {id: AC-8, criterion: "Nothing in it belongs to anyone else (interpretation): no item the member doesn't own, and none of another member's links, marks, plans, goals, retirement assumptions, or attachments, even where they name the member's items.", evidence: ["core/test/vv_f05_d_test.exs:408 nothing in it belongs to anyone else", "core/test/import_test.exs:186 carries the member's own plans, marks, goals, and retirement, and nothing of anyone else's"]}
  notes: "AC-8 treats an item the member co-owns as theirs: REQ-169 exports owned items with their owners, grantees, ledger, and readings, so a co-owner's ledger entries and readings on a jointly owned item are in the file by design (VV-001 recorded this as a specification note on REQ-155's wording)."

REQ-156:
  result: Verified
