# DRAFT (WI-057): acceptance criteria for batch d, written by a delegated agent; interpretations await ACT-001's rulings (REV-069 follow-up).
# Not an artifact document: the criteria move into each Requirement's record once ruled on.
# VV-001 F-05/F-08, batch D (WI-057): acceptance criteria for REQ-149, 150, 151, 153, 154, 155, 156, 157, 158,
# 159, 164, 174. Written by ACT-002 (AI agent, proposal authority only); interpretations are marked and are not
# ratified. Evidence is 'path:line test name' at the commit that adds this file (base 68d798a). Result rules as in
# VV-001 Appendix A: Verified = every criterion has a passing test that asserts it; Indeterminate = some
# criterion lacks one or needs a person or another environment; Not Verified = a test showed the code violating a
# criterion. Suites at this commit: core 142 passed, app 254 passed.

REQ-149:
  result: Verified
  acceptance_criteria:
    - {id: AC-1, criterion: "A member can add an account of type 401(k) and of type IRA; both are offered where accounts are added.", evidence: ["app/test/v04_web_test.exs:94 REQ-149: a 401(k) is an account with a balance, but never cash", "app/test/v04_web_test.exs:232 REQ-149/150: an IRA can be added; 15% is the highest return; a zero contribution clears it", "core/test/vv_f05_d_test.exs:32 retirement_401k and ira: created owned by the creator alone, private, with name and kind fixed"]}
    - {id: AC-2, criterion: "A new 401(k) or IRA is owned by its creator alone, with no grantees, and no other member can see it.", evidence: ["core/test/vv_f05_d_test.exs:32 retirement_401k and ira: created owned by the creator alone, private, with name and kind fixed", "app/test/vv_f05_d_test.exs:239 REQ-149: an IRA shared with someone shows them its latest balance only, and they can't update it"]}
    - {id: AC-3, criterion: "Its name and kind never change: it can't be re-created under the same id, and adding readings, sharing, changing owners, revoking, and relinquishing leave its name and kind as created.", evidence: ["core/test/vv_f05_d_test.exs:32 retirement_401k and ira: created owned by the creator alone, private, with name and kind fixed"]}
    - {id: AC-4, criterion: "Any owner, including one of joint owners, adds a dated balance reading without anyone's consent; readings are append-only (earlier ones kept unchanged), validated like any account's, and each is recorded in the item's history.", evidence: ["core/test/vv_f05_d_test.exs:50 retirement_401k and ira: any owner adds a dated reading without consent; append-only and in the history"]}
    - {id: AC-5, criterion: "A member it is shared with can't add a reading (refused, nothing saved, in core and at the interface); a member who can't see it is told it isn't there.", evidence: ["core/test/vv_f05_d_test.exs:82 retirement_401k and ira: someone it's shared with can't add a reading; someone who can't see it is told it isn't there", "app/test/vv_f05_d_test.exs:239 REQ-149: an IRA shared with someone shows them its latest balance only, and they can't update it"]}
    - {id: AC-6, criterion: "Owners read every reading; a member it is shared with reads only the latest (and its page shows no earlier balances); nobody else reads any, including after sharing stops.", evidence: ["core/test/vv_f05_d_test.exs:92 retirement_401k and ira: owners read every reading; someone it's shared with only the latest; nobody else any", "app/test/vv_f05_d_test.exs:239 REQ-149: an IRA shared with someone shows them its latest balance only, and they can't update it"]}
    - {id: AC-7, criterion: "Each reading has its own key, sealed only to the members AC-6 allows; a member who stops being able to see it loses their keys and is never sealed a later reading; a reader written into the file without the app is never sealed one.", evidence: ["app/test/vv_f05_d_test.exs:269 REQ-149 (REQ-133): each IRA reading has its own key, sealed only to those who may read it", "app/test/readings_crypto_test.exs:147 a reader written into the file by editing it is never sealed a reading, and it's reported"]}
    - {id: AC-8, criterion: "The item rules REQ-130/REQ-171 name apply as to any item: the owner's export carries it with its readings and a grantee's doesn't; an owner can't leave while owning it; a joint owner can't delete it alone; a pending proposal can be withdrawn; the sole owner's deletion removes it and its readings.", evidence: ["core/test/vv_f05_d_test.exs:111 retirement_401k and ira: deletion, export, leaving, and withdrawing apply as to any item", "core/test/retirement_test.exs:121 deleting the account removes contributions to it; leaving removes the assumptions"]}
    - {id: AC-9, criterion: "A retirement account's balance is never counted as cash: not in the running balance, not in the next twelve months, and not in how long savings would last.", evidence: ["core/test/retirement_test.exs:48 are accounts with readings, but never cash", "app/test/v04_web_test.exs:94 REQ-149: a 401(k) is an account with a balance, but never cash"]}
  notes: "AC-3 ('fixed') rests on there being no operation that edits an item's name or kind; the test shows the operations that exist leave them unchanged, which is the observable form. AC-7's third clause (a reader edited into the file) is type-independent code and is cited from the checking/debt test, not re-run for an IRA. AC-8 samples the item rules of REQ-171 (REQ-101..REQ-110, REQ-125, REQ-167, REQ-169); REQ-167/169 access and export are otherwise type-independent. At the interface a grantee's view of earlier balances is guarded three times (core readings, per-reading keys, and the page showing earlier balances to owners only): the interface test fails only when all three are broken."

REQ-150:
  result: Verified
  acceptance_criteria:
    - {id: AC-1, criterion: "A member can save a birth year, a retirement age, a yearly return, a monthly contribution to each retirement account they can see, a monthly Social Security estimate, and a monthly target income.", evidence: ["app/test/v04_web_test.exs:109 REQ-150/151: assumptions saved together; the projection with its assumptions stated", "app/test/vv_f05_d_test.exs:296 REQ-150: every assumption, including birth year, Social Security, and target, is cleared by an empty field"]}
    - {id: AC-2, criterion: "They are private: kept in the member's own record, another member's session can't read them, and another member's page doesn't show them; each member's are their own.", evidence: ["app/test/v04_web_test.exs:109 REQ-150/151: assumptions saved together; the projection with its assumptions stated", "core/test/retirement_test.exs:67 are private, validated, clearable, and never filled in"]}
    - {id: AC-3, criterion: "A contribution can be set only for a retirement account the member can see (not a cash account, not one they can't see), and stops counting once they can't see it.", evidence: ["core/test/retirement_test.exs:108 contributions go only to retirement accounts the member can see", "core/test/retirement_test.exs:175 only the retirement accounts the member can see, and their own contributions"]}
    - {id: AC-4, criterion: "The return is accepted from -5% to 15% inclusive and refused outside that range.", evidence: ["core/test/retirement_test.exs:67 are private, validated, clearable, and never filled in", "app/test/v04_web_test.exs:162 REQ-150: invalid values are refused at the field, with what was typed kept", "app/test/v04_web_test.exs:232 REQ-149/150: an IRA can be added; 15% is the highest return; a zero contribution clears it"]}
    - {id: AC-5, criterion: "Each is optional: saving with any of them empty is accepted.", evidence: ["app/test/v04_web_test.exs:109 REQ-150/151: assumptions saved together; the projection with its assumptions stated", "app/test/vv_f05_d_test.exs:389 REQ-154: no retirement page suggests an investment, a product, or a value; every state passes the judgment-word and glossary checks"]}
    - {id: AC-6, criterion: "Each can be cleared: birth year, retirement age, return, each contribution, Social Security estimate, and target all become unset (in core with nil; at the interface with an empty field).", evidence: ["core/test/vv_f05_d_test.exs:143 birth year, retirement age, return, Social Security, target, and a contribution", "app/test/vv_f05_d_test.exs:296 REQ-150: every assumption, including birth year, Social Security, and target, is cleared by an empty field", "app/test/v04_web_test.exs:232 REQ-149/150: an IRA can be added; 15% is the highest return; a zero contribution clears it"]}
    - {id: AC-7, criterion: "An invalid value in any field (birth year, age, return, contribution, Social Security, target) is refused at that field, nothing is saved, and what was typed is shown again in every field for correction.", evidence: ["app/test/v04_web_test.exs:162 REQ-150: invalid values are refused at the field, with what was typed kept", "app/test/vv_f05_d_test.exs:330 REQ-150: an invalid birth year, Social Security estimate, or contribution is refused, with what was typed kept", "core/test/retirement_test.exs:67 are private, validated, clearable, and never filled in"]}
    - {id: AC-8, criterion: "Nothing is filled in or suggested by the System (interpretation): on the form every assumption field starts empty, with no placeholder, list of options, select, or datalist; the retirement pages carry no recommending phrase (REQ-154 AC-3).", evidence: ["app/test/vv_f05_d_test.exs:369 REQ-150/154: nothing is filled in or offered in any assumption field", "core/test/retirement_test.exs:67 are private, validated, clearable, and never filled in", "app/test/vv_f05_d_test.exs:389 REQ-154: no retirement page suggests an investment, a product, or a value; every state passes the judgment-word and glossary checks"]}
    - {id: AC-9, criterion: "Deleting a retirement account removes every member's contribution to it; a member who leaves has their assumptions removed.", evidence: ["core/test/retirement_test.exs:121 deleting the account removes contributions to it; leaving removes the assumptions"]}
  notes: "AC-8 is an interpretation of 'suggested'. Field error messages give format examples after an invalid entry ('Enter the year you were born, like 1968.', 'Enter a yearly return from -5 to 15, like 5 or 4.5.', 'Enter an amount like 62.40 or 1,200.'). Under this interpretation a format example shown only after an invalid entry is not a suggested value; that reading is not ratified (human gate requested). A typed 0 contribution clears it at the interface while core refuses 0 (DEF-045, by design)."

REQ-151:
  result: Verified
  acceptance_criteria:
    - {id: AC-1, criterion: "Without a birth year, a retirement age, and a return there is no projection, and the page says which are needed.", evidence: ["core/test/retirement_test.exs:138 needs a birth year, a retirement age, and a return", "app/test/v04_web_test.exs:109 REQ-150/151: assumptions saved together; the projection with its assumptions stated"]}
    - {id: AC-2, criterion: "With them, the page shows the balance year by year from this month until January of the year the member reaches that age (no rows when that is this year or earlier).", evidence: ["core/test/retirement_test.exs:146 month by month from the latest balances to January of the retirement year", "core/test/retirement_test.exs:197 an account without a balance yet counts from zero; retiring this year or earlier means no rows", "app/test/v04_web_test.exs:109 REQ-150/151: assumptions saved together; the projection with its assumptions stated"]}
    - {id: AC-3, criterion: "It starts from the latest balances of the retirement accounts the member can see (an account with no balance counts as zero), and only those.", evidence: ["core/test/retirement_test.exs:175 only the retirement accounts the member can see, and their own contributions", "core/test/retirement_test.exs:197 an account without a balance yet counts from zero; retiring this year or earlier means no rows"]}
    - {id: AC-4, criterion: "Each month it grows at the return and adds that month's contributions (exact values checked against an independent calculation).", evidence: ["core/test/retirement_test.exs:146 month by month from the latest balances to January of the retirement year"]}
    - {id: AC-5, criterion: "The page says the result is in today's dollars and states the assumptions next to the result: the starting balances and dates, the monthly contribution, the return, and the age.", evidence: ["app/test/v04_web_test.exs:109 REQ-150/151: assumptions saved together; the projection with its assumptions stated"]}
  notes: "'In today's dollars' is a statement about the inputs (the return is after inflation); it is verified as what the page states, not as an economic property."

REQ-153:
  result: Verified
  acceptance_criteria:
    - {id: AC-1, criterion: "The balance at retirement is shown with the return two percentage points lower and higher, and retiring two years earlier and later, each worked out with that one change.", evidence: ["core/test/retirement_test.exs:240 the return two points either way and retiring two years either way; nothing saved", "app/test/v04_web_test.exs:254 REQ-153: each alternative is labelled with the assumption it changes"]}
    - {id: AC-2, criterion: "For each of those alternatives, how long the balance would last paying the difference is shown, worked out with that one change (years and months with the age, 'no difference to pay', or 'some remains at 100').", evidence: ["core/test/vv_f05_d_test.exs:207 each alternative says how long it would last, worked out with that one change", "app/test/vv_f05_d_test.exs:435 REQ-153: each alternative says how long it would last, beside the result"]}
    - {id: AC-3, criterion: "The alternatives are shown beside the result as entered: on the same page, in one table whose first row is the result as entered.", evidence: ["app/test/v04_web_test.exs:196 REQ-152/153: compared with the member's own target; what changes the result", "app/test/vv_f05_d_test.exs:435 REQ-153: each alternative says how long it would last, beside the result"]}
    - {id: AC-4, criterion: "Nothing about the alternatives is saved: the member's assumptions are unchanged after they are worked out and shown.", evidence: ["core/test/retirement_test.exs:240 the return two points either way and retiring two years either way; nothing saved", "core/test/vv_f05_d_test.exs:207 each alternative says how long it would last, worked out with that one change"]}
  notes: "Alternatives outside the allowed ranges (a return above 15% or below -5%, an age above 90 or below 40) are left out without saying so (core/test/retirement_test.exs:266); the statement is silent on this, so it is neither required nor forbidden (specification gap, not a defect)."

REQ-154:
  result: Verified
  acceptance_criteria:
    - {id: AC-1, criterion: "No assumption field on a retirement page is prefilled or offers values: every field starts empty, with no placeholder, list, select, or datalist (interpretation of 'suggest' for contributions, returns, ages, and targets).", evidence: ["app/test/vv_f05_d_test.exs:369 REQ-150/154: nothing is filled in or offered in any assumption field", "app/test/v04_web_test.exs:109 REQ-150/151: assumptions saved together; the projection with its assumptions stated"]}
    - {id: AC-2, criterion: "No retirement page names an investment or a product (interpretation: none of a fixed list of investment and product terms, such as index fund, mutual fund, target-date, annuity, ETF, stock, bond, Roth, brokerage, CD, or fund-company names, appears in its visible text).", evidence: ["app/test/vv_f05_d_test.exs:389 REQ-154: no retirement page suggests an investment, a product, or a value; every state passes the judgment-word and glossary checks"]}
    - {id: AC-3, criterion: "No retirement page contains a recommending sentence (interpretation: none of a fixed list of recommending forms, such as should, recommend, suggest, consider, advise, try to, aim for, better, best, ideal, enough, on track, behind, appears in its visible text, apart from the page's own disclaimer that nothing is advice or a suggestion).", evidence: ["app/test/vv_f05_d_test.exs:389 REQ-154: no retirement page suggests an investment, a product, or a value; every state passes the judgment-word and glossary checks", "app/test/v04_web_test.exs:274 REQ-154: no suggestions and no judgment words on the retirement pages"]}
    - {id: AC-4, criterion: "The judgment-word and glossary checks pass on every retirement page: the retirement page with nothing set, with assumptions missing, with a result, with a result that outlasts age 100, with Social Security covering the target, refused with errors, for a member with no retirement account, and a retirement account's own page.", evidence: ["app/test/vv_f05_d_test.exs:389 REQ-154: no retirement page suggests an investment, a product, or a value; every state passes the judgment-word and glossary checks", "app/test/v04_web_test.exs:274 REQ-154: no suggestions and no judgment words on the retirement pages"]}
  notes: "'Suggest' has no observable definition in the statement; AC-1..AC-3 are the interpretation, and a phrase list can only show the absence of the phrases it names, so AC-3 is only as good as its list. Not treated as suggestions (human gate requested to ratify): the format examples in field errors (REQ-150 notes); the ±2 alternatives, which REQ-153 requires; 'add one as a 401(k) or an IRA' shown to a member with no retirement account, which names the two account kinds the app records rather than recommending a product. 'Every retirement page' is taken to be /retirement in all its states and a retirement account's page."

