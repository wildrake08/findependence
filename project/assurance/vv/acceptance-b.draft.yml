    - {id: AC-3, criterion: "A form that changed the household, sent again after the session ended (after Lock and unlocking, after the idle lock, or a second click on Leave that arrives after the first finished), changes nothing and says it was already saved.", evidence: []}
    - {id: AC-4, criterion: "A form whose first sending was refused (a mistake in a field, or a rule such as an unknown member) may be sent again, corrected, and is then saved, not taken for a repeat.", evidence: ["app/test/ux004_test.exs:152 P1 (REQ-165): a refused form changed nothing, so the same form may be sent again, corrected", "app/test/vv_f05_b_test.exs:1025 a form refused by a rule may be sent again, corrected, and is then saved"]}
    - {id: AC-5, criterion: "A form whose first sending arrived after the session had ended changes nothing and is not remembered: sent again in a live session with that session's CSRF token, it is saved, not taken for a repeat.", evidence: ["app/test/vv_f05_b_test.exs:1039 a form sent after the session ended changed nothing, and its one-time token isn't kept"]}
  notes: "DEFECT (AC-3): the household is changed at most once in every case, but a repeat sent after the session ended is told the opposite of 'already saved'. Reproduce, each from a fresh vault with members ana and ben: (a) unlock as ana; on home, add a value 'Home'; press Lock; unlock as ana; go back to the earlier page and send the add-value form again (same _csrf_token and _form): 403 'That wasn't saved. This page was out of date, so nothing was saved. Go to the home page and do it again.' (b) unlock as ana; add a value 'Home'; leave the session idle over 15 minutes until the sweep runs; send the same form again: redirect to /?locked=action, 'Locked after 15 minutes without use. Your last action was not saved. Unlock and do it again.' (c) unlock as a member who owns nothing; open /leave; press 'Leave the household' twice, the second arriving after the first finished (it carries the same cookie): the second is answered /?locked=replaced, 'You were locked out, so your last action was not saved. Unlock and do it again.' Cause: one-time form tokens are remembered per session (sessions.ex claim_form), so once a session ends a saved form is no longer recognized, and the refusal pages (DEF-035, WI-032, UX-001 R4) say nothing was saved. Following the advice to do it again would make a second, deliberate change. The failing test was removed. AC-2 wording: the statement says a repeat shall 'say that it was already saved'; while the first sending is still in progress that can't truthfully be said, and the app says it was already sent; this is flagged for the Requirement's owner, not counted as a defect. A crafted request with no form token from an unlocked session is refused (wi052_test.exs:156); a browser always sends one."

REQ-166:
  result: Verified
  acceptance_criteria:
    - {id: AC-1, criterion: "Deleting an item (an item of money in or out, an account, or a debt) from its page first shows a page that names it ('Delete “Name”?'), says its history goes with it, and asks to confirm; the only delete form is on that page, and no page offers deleting straight away.", evidence: ["app/test/vv_f05_b_test.exs:1080 deleting a value, an item, an account, or a debt is first shown by name and asked; going back keeps it", "app/test/vv_f05_b_test.exs:1151 no page offers deleting straight away; the leaving checklist names the item and asks for an explicit choice", "app/test/web_ux_test.exs:155 delete goes through a confirmation page; leaving through the checklist"]}
    - {id: AC-2, criterion: "Deleting a value does the same.", evidence: ["app/test/vv_f05_b_test.exs:1080 deleting a value, an item, an account, or a debt is first shown by name and asked; going back keeps it"]}
    - {id: AC-3, criterion: "Deleting a plan first shows its name and how many steps go with it, and asks to confirm. Interpretation: 'by name' means the plan is named; steps have no names, so they are counted.", evidence: ["app/test/ux004_test.exs:216 P3 (REQ-166): deleting a plan is previewed by name and confirmed; going back keeps it", "app/test/vv_f05_b_test.exs:1122 a plan with steps is named, with how many steps go with it; going back keeps it"]}
    - {id: AC-4, criterion: "Going back leaves it unchanged: showing the confirmation changes nothing in the file, and following 'No, go back' leads to a page where it is still there.", evidence: ["app/test/vv_f05_b_test.exs:1080 deleting a value, an item, an account, or a debt is first shown by name and asked; going back keeps it", "app/test/vv_f05_b_test.exs:1122 a plan with steps is named, with how many steps go with it; going back keeps it", "app/test/ux004_test.exs:216 P3 (REQ-166): deleting a plan is previewed by name and confirmed; going back keeps it"]}
    - {id: AC-5, criterion: "Interpretation for the leaving checklist (UX-001 R8, where the checklist is the confirmation): deleting from it needs an explicit choice, 'Delete it for everyone (can't be undone)', beside the item's name ('What happens to “Name”'), from a required list that starts with nothing chosen; sent with no choice, nothing is deleted.", evidence: ["app/test/vv_f05_b_test.exs:1151 no page offers deleting straight away; the leaving checklist names the item and asks for an explicit choice"]}
    - {id: AC-6, criterion: "Removing a single plan step or a single link does not ask: the form on the page posts straight to the removal, and one press removes it.", evidence: ["app/test/vv_f05_b_test.exs:1210 removing one plan step or one link doesn't ask: one press removes it"]}
  notes: "Confirmation is an interface safeguard; the handler deletes on a direct POST by design (DEF-042), so the criteria are about what the pages offer. AC-5 is an interpretation for the Requirement's owner to confirm: the leaving checklist names the item and needs a deliberate choice, but shows no separate confirmation page. The item delete page's 'No, go back' leads home, not to the item's page; the statement does not say where going back leads."

REQ-170:
  result: Verified
  acceptance_criteria:
    - {id: AC-1, criterion: "Every ledger entry is stored encrypted: no entry's event or details appear in the stored file in plaintext.", evidence: ["app/test/vault_test.exs:144 REQ-122: no attribute, label, link, or ledger detail appears in plaintext in the stored file", "app/test/vv_f05_b_test.exs:199 REQ-122: kinds, account and debt types, every kind of history entry, and plan names stay out of the file"]}
    - {id: AC-2, criterion: "When an entry is appended, its key is sealed to exactly the item's owners at that moment, not to grantees.", evidence: ["app/test/vv_f05_b_test.exs:1275 each ledger entry is sealed to the owners when it is appended, and re-sealed to each new owner", "app/test/vault_test.exs:106 REQ-120: ledger entries are readable by owners only, and re-sealed for new owners"]}
    - {id: AC-3, criterion: "Every existing entry is re-sealed for each member who becomes an owner, so they can open the whole ledger with their own secrets.", evidence: ["app/test/vv_f05_b_test.exs:1275 each ledger entry is sealed to the owners when it is appended, and re-sealed to each new owner", "app/test/vault_test.exs:106 REQ-120: ledger entries are readable by owners only, and re-sealed for new owners"]}
    - {id: AC-4, criterion: "A prospective owner of a value can open every entry once every current owner has agreed to add them, before their own consent, and not while any current owner has yet to agree; if the proposal is withdrawn, the keys are removed.", evidence: ["app/test/vv_f05_b_test.exs:1299 a prospective owner of a value can read the whole ledger once every current owner agrees, not before", "app/test/vault_test.exs:117 REQ-119/120 with REQ-115: a prospective joiner can read a value only after every owner consents"]}
    - {id: AC-5, criterion: "The same holds for a prospective owner of a shared plan.", evidence: ["app/test/vv_f05_b_test.exs:1321 so can a prospective owner of a shared plan; a proposed owner of anything else can't"]}
    - {id: AC-6, criterion: "No other member can open an entry: not a grantee, not a proposed owner of any other kind of item, not a former owner (for earlier or later entries), not a withdrawn joiner, and not a member written into the file by editing it.", evidence: ["app/test/vv_f05_b_test.exs:1275 each ledger entry is sealed to the owners when it is appended, and re-sealed to each new owner", "app/test/vv_f05_b_test.exs:1287 an owner who relinquishes loses their ledger keys and gets none for later entries", "app/test/vv_f05_b_test.exs:1321 so can a prospective owner of a shared plan; a proposed owner of anything else can't", "app/test/vault_test.exs:183 REQ-125: withdrawing a value invitation removes the access the joiner was given in advance", "app/test/tamper_test.exs:54 ledger entries, old or new, are not sealed to a tampered-in owner either"]}
  notes: "Closes the REQ-120 gap (re-sealing to a joiner before their consent, now asserted positively). REQ-170's wording ('those members ... and no other member') removes the REQ-120 inconsistency VV-001 noted."

