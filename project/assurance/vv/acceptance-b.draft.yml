    - {id: AC-3, criterion: "It is private by default: no other member can see it until shared.", evidence: ["core/test/vv_f05_b_test.exs:34 every listed kind can be created; it is owned by its creator alone and private", "core/test/balances_test.exs:18 private by default, owned by the creator, with a fixed name and kind"]}
    - {id: AC-4, criterion: "The rules of REQ-101, REQ-103, REQ-105..REQ-108, REQ-110, REQ-125, REQ-167, and REQ-169 hold for accounts and debts as for any item, each exercised on an account and on a debt.", evidence: ["core/test/vv_f05_b_test.exs:58 REQ-101, REQ-103, REQ-105, REQ-107: owners, grants, and history work as for any item", "core/test/vv_f05_b_test.exs:98 REQ-106: a household view counts only accounts the member can see", "core/test/vv_f05_b_test.exs:106 REQ-108: only a sole owner deletes, and everything about it goes but a bare record", "core/test/vv_f05_b_test.exs:125 REQ-110: owning an account or a debt stops a member leaving until it's gone", "core/test/vv_f05_b_test.exs:138 REQ-125: a pending change to a joint account can be withdrawn by an owner", "core/test/vv_f05_b_test.exs:147 REQ-167: read if and only if owner or grantee; being proposed as an owner gives no access", "core/test/vv_f05_b_test.exs:161 REQ-169: the owner's export carries the account with its readings; a grantee's doesn't", "core/test/randomized_test.exs:20 REQ-101..114 and REQ-125 hold after every operation of 2000 seeded sequences", "core/test/balances_test.exs:29 sharing, ownership, and exit apply as to any item"]}
