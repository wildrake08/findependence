REQ-123:
  result: Verified
  acceptance_criteria:
    - {id: AC-1, criterion: "The server binds 127.0.0.1 only.", evidence: ["app/test/web_test.exs:56 binds only the loopback address", "app/test/end_to_end_test.exs:118 a member uses the real server over loopback, and everything survives a restart"]}
    - {id: AC-2, criterion: "A request, GET or POST, whose Host is not the loopback address with the server's port is refused (421) before anything is processed; a POST so refused creates no session.", evidence: ["app/test/web_test.exs:62 rejects a foreign Host header (DNS rebinding)", "app/test/vv_f05_b_test.exs:431 a request naming any host but the loopback address and port is refused, a POST included", "app/test/end_to_end_test.exs:118 a member uses the real server over loopback, and everything survives a restart"]}
    - {id: AC-3, criterion: "Every state-changing request needs a valid CSRF token: each of the 35 POST routes the router declares, sent from an unlocked session with a one-time form token but with the CSRF token missing, from another session, or altered, is refused (403, 'That wasn't saved'), the file is unchanged, and the session stays as it was. Requests other than POST change nothing.", evidence: ["app/test/vv_f05_b_test.exs:324 every state-changing request needs a valid CSRF token: each POST route refuses without one", "app/test/vv_f05_b_test.exs:389 no request other than a POST changes the household: every GET route leaves the file as it was", "app/test/web_test.exs:72 rejects a state-changing request without a CSRF token", "app/test/def035_test.exs:54 Ana's old tab, after Ana locks and Ben unlocks in the same browser, says nothing was saved"]}
    - {id: AC-4, criterion: "Logging out (Lock) discards the session's unlocked keys.", evidence: ["app/test/web_test.exs:87 logout discards the unlocked session"]}
    - {id: AC-5, criterion: "The idle limit is 15 minutes: a session idle for 15 minutes still holds its keys; once idle for longer, its keys are discarded without any request, leaving a marker with only its time, within the sweep interval (5 seconds) of the server as started.", evidence: ["app/test/vv_f05_b_test.exs:456 the idle limit is 15 minutes: a session is kept at exactly 15 minutes and discarded after", "app/test/vv_f05_b_test.exs:468 as the server starts it, the sweep discards an idle session's keys within 5 seconds", "app/test/wi052_test.exs:79 DEF-039: the sweep leaves an idle session with nothing but a marker", "app/test/wi052_test.exs:106 DEF-039: the sweep runs by itself, with no request"]}
  notes: "Interpretations: (1) 'state-changing request' is every POST: the router declares only GET and POST routes, and every GET route leaves the stored file unchanged (asserted). Observation, not a finding: any request other than a bring-in POST drops a checked bring-in file waiting in memory (DEF-044, by design); with SameSite=Strict cookies a cross-site request carries no session, so it cannot do this. (2) 'the loopback address' is taken as 127.0.0.1; the code also accepts localhost with the port, which names it, and (by reading the code) refuses other loopback addresses such as 127.0.0.2, which the statement does not forbid. (3) 'after 15 minutes idle' is met within the 5-second sweep interval, which closes VV-001 F-02 as WI-052 intended. The route list in AC-3 is read from the router's source, so a new POST route makes the test fail until it is added."

REQ-124:
  result: Verified
  acceptance_criteria:
    - {id: AC-1, criterion: "Interpretation of 'no outbound network connections': during a member's whole visit through the interface (unlock and a failed unlock, every kind of page, changes of each main kind, export, bring-in, lock, and a second member's visit), no process in the running system calls a TCP, UDP, SCTP, or TLS connect or a host-name lookup; and neither the app nor its dependencies contain an HTTP client or connect call.", evidence: ["app/test/vv_f05_b_test.exs:613 a member's whole visit opens no outbound connection", "app/test/web_test.exs:115 no HTTP client or outbound-connection code in the app or its dependencies"]}
    - {id: AC-2, criterion: "Interpretation of 'load no remote resources': every kind of page the interface serves (31 responses, including error, refusal, confirmation, preview, and export pages) carries a Content-Security-Policy whose default-src is 'none' and whose every source is 'none', 'self', or 'unsafe-inline'; and no page refers to a remote address (absolute or protocol-relative URL, CSS url() or @import).", evidence: ["app/test/vv_f05_b_test.exs:679 every kind of page forbids remote loads and refers to nothing remote", "app/test/web_test.exs:107 every response forbids remote loads, and pages contain no remote URLs"]}
  notes: "Both criteria are interpretations; a universal 'makes no connection' cannot be shown by tests. Limits: AC-1 traces the functions named, in the test VM, over the paths the visit exercises, with requests made in-process (Plug.Test), not through the Bandit listener, and no operating-system capture was made (VV-RUN-001 observed none in one snapshot). A connection opened another way (a NIF, a port program) would not be seen. AC-2 relies on browsers enforcing the policy; no browser was run. The 421 refusal is sent before the security headers and has no policy, but its body is plain text with nothing to load."

