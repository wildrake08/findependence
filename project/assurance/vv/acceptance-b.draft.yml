REQ-118:
  result: Verified
  acceptance_criteria:
    - {id: AC-1, criterion: "No member's private key or personal key appears anywhere in the bytes of the stored file.", evidence: ["app/test/crypto_properties_test.exs:71 no private key or personal key appears in the stored file"]}
    - {id: AC-2, criterion: "Each member's private key material is stored only inside their secret box, which opens under PBKDF2-HMAC-SHA256 of their passphrase with their salt and the vault's iteration count, and under no other derivation; the derivation matches the RFC 7914 PBKDF2-HMAC-SHA256 known answers.", evidence: ["app/test/crypto_properties_test.exs:52 each member's secret on disk opens under PBKDF2-HMAC-SHA256 of their passphrase, and only that", "app/test/crypto_properties_test.exs:44 derive_key is PBKDF2-HMAC-SHA256 (RFC 7914 known answers)"]}
    - {id: AC-3, criterion: "A vault made for use (setup, or create without the test-only flag) uses at least 600,000 iterations, and deriving or creating with fewer is refused unless the explicit test-only flag is set.", evidence: ["app/test/vault_test.exs:84 REQ-118: the default vault uses at least 600,000 PBKDF2 iterations", "app/test/crypto_test.exs:45 key derivation refuses fewer than 600,000 iterations unless explicitly unsafe", "app/test/tasks_test.exs:11 setup creates a vault each member can unlock, re-asking on a mismatch or a short passphrase"]}
    - {id: AC-4, criterion: "Each member's salt is 16 random bytes, different from every other member's and every other vault's.", evidence: ["app/test/crypto_properties_test.exs:65 every member has a 16-byte salt, different from every other member's and vault's"]}
    - {id: AC-5, criterion: "A wrong passphrase fails authentication: nothing is unlocked and no session is created (401 at the interface).", evidence: ["app/test/vault_test.exs:41 REQ-118: a wrong passphrase or unknown member fails and reveals nothing", "app/test/web_test.exs:82 a wrong passphrase is refused"]}
    - {id: AC-6, criterion: "Interpretation of 'reveal nothing': every failed unlock (a wrong, empty, near-miss, or another member's passphrase, or a name that is not a member) gets the identical response (status, headers, cookie names, and page, apart from the random per-page tokens) and the identical log line, and the core returns the same single error for all of them.", evidence: ["app/test/vv_f05_b_test.exs:151 a wrong passphrase reveals nothing: every failure, for a member or not, looks the same", "app/test/vault_test.exs:41 REQ-118: a wrong passphrase or unknown member fails and reveals nothing"]}
  notes: "AC-6 is an interpretation: 'reveal nothing' cannot be tested in general, so it is taken as 'no failure can be told from another by what the app returns or logs'. Not tested: response timing. An unknown name skips PBKDF2 and is answered faster, so timing can tell a member's name from a non-member's; the unlock page lists members' names anyway, so this reveals nothing new, but it is recorded for GATE-016. Also for GATE-016 (from VV-001): the iteration count and the test-only flag are read from the plaintext file at unlock."

