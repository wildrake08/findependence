# 146, 147, 148, 160, 161, 162, 172, 173, and the tests that assert them.
# Baseline: findependence/vv-findings at 68d798a. Line numbers are at the commit that adds this file.
# Result rules (VV-001 appendix): Verified = every criterion has a passing test that asserts it;
