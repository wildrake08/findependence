REQ-136:
  result: Verified
  acceptance_criteria:
    - {id: AC-1, criterion: "Adding an item accepts one date on which it happens, stored on the item (attrs.on).", evidence: ["app/test/cash_flow_web_test.exs:69 REQ-136: a date is optional, checked, stored, and shown as the next date; irregular items keep none"]}
    - {id: AC-2, criterion: "The add-item form offers exactly one date field, and it is optional: an item can be added without a date.", evidence: ["app/test/vv_f05_c_test.exs:117 REQ-136: the add-item form offers exactly one date, and it is optional", "app/test/cash_flow_web_test.exs:69 REQ-136: a date is optional, checked, stored, and shown as the next date; irregular items keep none"]}
    - {id: AC-3, criterion: "A recurring item with a date happens on that date and on its schedule from it, never before it.", evidence: ["core/test/schedule_test.exs:18 every 2 weeks is every 14 days from the date, never before it", "core/test/schedule_test.exs:13 monthly on the 31st lands on each month's last day, including a leap February"]}
    - {id: AC-4, criterion: "A one-off with a date happens on that date only.", evidence: ["core/test/schedule_test.exs:23 twice a year, yearly, one-off, irregular, and no date"]}
    - {id: AC-5, criterion: "An irregular item has no dates: none is stored even if one is entered, and it has no occurrences.", evidence: ["app/test/cash_flow_web_test.exs:69 REQ-136: a date is optional, checked, stored, and shown as the next date; irregular items keep none", "core/test/schedule_test.exs:23 twice a year, yearly, one-off, irregular, and no date"]}
    - {id: AC-6, criterion: "The date is kept in the item's protected (encrypted) attributes and does not appear in plaintext in the stored file.", evidence: ["app/test/crypto_properties_test.exs:100 a deletion record, an amount, a date, and a frequency are not in the file in plaintext"]}
    - {id: AC-7, criterion: "An item without a date is still added, listed, and counted at its per-month amount in totals and the twelve-month projection; it simply has no dates.", evidence: ["app/test/cash_flow_web_test.exs:69 REQ-136: a date is optional, checked, stored, and shown as the next date; irregular items keep none", "core/test/plans_projection_test.exs:49 months start after this one; cash runs from the account balances; one-offs land in their month"]}
  notes: "'Keep working as before' is read as AC-7: an undated item is accepted and counted exactly as items were before dates existed (the undated health premium counts 400 a month in the projection). An invalid date is refused (cash_flow_web_test.exs:69); the statement does not require that, so it is not a criterion."

REQ-137:
  result: Verified
