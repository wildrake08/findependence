    - {id: AC-4, criterion: "A planned money-in or money-out step with how often it happens applies from a month; a planned one-off happens once, in that month.", evidence: ["core/test/plans_projection_test.exs:75 a plan: the job stops (taking the marked premium with it), a new cost, and borrowing", "core/test/plans_projection_test.exs:113 a planned one-off happens once, in the month it's planned from"]}
    - {id: AC-5, criterion: "A borrow step takes an amount, a rate, and a monthly payment, from a month.", evidence: ["core/test/plans_projection_test.exs:75 a plan: the job stops (taking the marked premium with it), a new cost, and borrowing", "app/test/v03_web_test.exs:117 REQ-142/143: a plan compared with things as they are; steps checked; private"]}
    - {id: AC-6, criterion: "Steps can be added and removed.", evidence: ["core/test/plans_projection_test.exs:131 steps are checked, removable, and plans are private", "app/test/v03_web_test.exs:117 REQ-142/143: a plan compared with things as they are; steps checked; private"]}
    - {id: AC-7, criterion: "Plans are private: another member can't see, open, or add to them.", evidence: ["app/test/v03_web_test.exs:117 REQ-142/143: a plan compared with things as they are; steps checked; private", "core/test/plans_projection_test.exs:131 steps are checked, removable, and plans are private"]}
