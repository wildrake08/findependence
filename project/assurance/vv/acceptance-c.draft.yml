REQ-143:
  result: Not Verified
  acceptance_criteria:
    - {id: AC-1, criterion: "For a plan, the member sees the twelve months, each with the figure without the plan and with it, side by side.", evidence: ["app/test/v03_web_test.exs:117 REQ-142/143: a plan compared with things as they are; steps checked; private", "app/test/vv_f05_c_test.exs:171 the twelve months side by side, with and without, and the interest on the borrowing stated"]}
    - {id: AC-2, criterion: "The with-plan figures include interest on planned borrowing, and the page states that interest.", evidence: ["core/test/plans_projection_test.exs:75 a plan: the job stops (taking the marked premium with it), a new cost, and borrowing", "app/test/vv_f05_c_test.exs:171 the twelve months side by side, with and without, and the interest on the borrowing stated"]}
    - {id: AC-3, criterion: "Each place a plan (a member's own plan or a shared plan) is named or listed says, in that entry or its section, that it is a plan. Places enumerated: the plans list, a plan's page, the confirm-delete page for a plan, a plan request's preview, a shared plan's page, home's request lines (to the member asked and to the proposer), the leave checklist, the export page, and the stop-owning and delete confirmations for a shared plan.", evidence: ["app/test/vv_f05_c_test.exs:189 the places a plan appears that say it is a plan: plans list, plan page, request, shared plan page, the asked member's home", "app/test/v03_web_test.exs:322 REQ-148: a plan proposed to another member is shared only when they agree", "app/test/ux004_test.exs:216 P3 (REQ-166): deleting a plan is previewed by name and confirmed; going back keeps it"]}
  notes: "DEFECT (AC-3): a shared plan is listed without saying it is a plan on the proposer's home ('Waiting for others: Make “Trip” owned by ana and ben.'), on /leave ('Trip ... Stop owning'), on /export (under 'Items': 'Trip. Owned by ana and you.'), and on the stop-owning confirmation ('Stop owning “Trip”?'). Reproduced over HTTP (see the WI-057 report). Interpretation: 'a plan' includes a shared plan, which REQ-148 makes from one of the member's plans and calls a 'shared plan'; 'every place' is enumerated in AC-3 as each page entry that names or lists a plan. If a human rules that only a member's own (private) plans are meant, every enumerated place for them says it is a plan and AC-3 passes. The flash message after starting a plan ('Started “Trip”. Add its steps below.') does not itself say plan but sits on the plan's page directly above 'A plan, private to you.'; counted as saying it. The saved JSON file is not a page and was not enumerated."

