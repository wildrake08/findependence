    - {id: AC-1, criterion: "Every N weeks: the dates are the item's date plus 7N, 14N, ... days (N = 1, 2, 3 tested).", evidence: ["core/test/schedule_test.exs:18 every 2 weeks is every 14 days from the date, never before it", "core/test/schedule_test.exs:43 legacy frequency values schedule like their intervals","core/test/vv_f05_c_test.exs:27 every 3 weeks is every 21 days from the date"]}
    - {id: AC-2, criterion: "Every N months: the same day of the month every N months (N = 1, 2, 3, 6 tested).", evidence: ["core/test/schedule_test.exs:13 monthly on the 31st lands on each month's last day, including a leap February", "core/test/schedule_test.exs:23 twice a year, yearly, one-off, irregular, and no date", "core/test/vv_f05_c_test.exs:35 every 2 months from the 31st: the same day, or the month's last day when shorter", "core/test/vv_f05_c_test.exs:52 every 3 months from the 30th keeps the 30th, and February's last day"]}
    - {id: AC-3, criterion: "Every N years: the same day of the month every N years (N = 1, 2 tested).", evidence: ["core/test/schedule_test.exs:23 twice a year, yearly, one-off, irregular, and no date", "core/test/vv_f05_c_test.exs:60 every 2 years from February 29"]}
    - {id: AC-4, criterion: "When the month is shorter than the item's day, the date is that month's last day, and later dates return to the item's own day.", evidence: ["core/test/schedule_test.exs:13 monthly on the 31st lands on each month's last day, including a leap February", "core/test/vv_f05_c_test.exs:35 every 2 months from the 31st: the same day, or the month's last day when shorter", "core/test/vv_f05_c_test.exs:60 every 2 years from February 29"]}
  notes: "N is general in the statement; the interface offers N = 1, 2 weeks, 1, 2, 3, 6 months, and 1 year. Tests now cover an N other than 1 for each unit."

