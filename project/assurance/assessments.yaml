version: 1
# Assessments of implementation-level Claims by ACT-002 under CP-004 option B (REV-004).
# Claims at mechanism level or above require ACT-001 or a designated independent reviewer.
artifacts:
  - id: ASMT-001
    type: Assessment
    outcome: supported
    claim_state_after: supported
    basis: >
      EVC-017 (qualified; the 69 engine tests reproduced at 7b9dcf6) covers every REQ-001..007 behaviour,
      with pass and fail cases per invariant, and mutation testing (TEST-RUN-001..005) shows the tests
      detect each rule being disabled. DEF-012, the only challenge to CLM-007, is resolved.
    conditions: [ASM-011 (the invariant interpretations) is not confirmed; the Claim is scoped to "under the documented interpretations"]
    open_defeaters_considered: []
    relationships: [{type: assesses, to: CLM-007}]
    provenance: {source: REPRO-RUN-001, created_by: ACT-002, authority: "CP-004 option B", inputs: [project/assurance/evidence.yaml, project/assurance/claims.yaml], created_at: 2026-09-26}

  - id: ASMT-002
    type: Assessment
    outcome: supported
    claim_state_after: supported
    basis: >
      EVC-017 covers REQ-008..012 with pass and fail cases, including the depends_on typing case that
      mutation testing first missed. EVC-019 shows trace PASS on the repository at 7b9dcf6, including
      Subject-rooted paths for IE-101..104.
    conditions: [ASM-010 (governance roots for framework tooling) is not confirmed]
    open_defeaters_considered:
      - {id: DEF-019, judgment: "It challenges the adequacy of REQ-008 (the Principle shortcut), not whether trace satisfies REQ-008 as written, so it does not defeat CLM-008. It stays open for ACT-001."}
    relationships: [{type: assesses, to: CLM-008}]
    provenance: {source: REPRO-RUN-001, created_by: ACT-002, authority: "CP-004 option B", inputs: [project/assurance/evidence.yaml, project/assurance/claims.yaml], created_at: 2026-09-26}

  - id: ASMT-003
    type: Assessment
    outcome: supported
    claim_state_after: supported
    basis: >
      EVC-018 (qualified; the 28 core tests reproduced at 7b9dcf6) includes a 1000-sequence randomized
      test that checks each Requirement against an independent ledger replay, with coverage floors.
      Mutation testing detects 19 of 19 rule-disabling mutations (TEST-RUN-004, TEST-RUN-006). EVC-019
      shows every satisfying element Subject-rooted.
    conditions: [ASM-013..ASM-016 are not confirmed; API-level enforcement only]
    open_defeaters_considered:
      - {id: DEF-016, judgment: "Coerced consent is a capability-level limit, not an implementation defect; it bears on CLM-012, not CLM-013."}
      - {id: DEF-015, judgment: "The coordination cost of all-owner consent is a design trade-off that ACT-001 kept (REV-003); REQ-103 as written is satisfied."}
    relationships: [{type: assesses, to: CLM-013}]
    provenance: {source: REPRO-RUN-001, created_by: ACT-002, authority: "CP-004 option B", inputs: [project/assurance/evidence.yaml, project/assurance/claims.yaml], created_at: 2026-09-26}

  - id: ASMT-004
    type: Assessment
    outcome: supported
    claim_state_after: supported
    basis: >
      EVC-021 (qualified; the 47 core tests reproduced twice at d4dceed): example tests for every
      Requirement, plus a 1300-sequence randomized test that recomputes visibility, ledger, links,
      distribution, exit, and joiner consent independently after every step, with coverage floors on
      12 event kinds. Mutation testing against the final code: 20 of 20 detected (TEST-RUN-007, TEST-RUN-008).
      EVC-022: check and trace PASS, with IE-101..105 Subject-rooted via OUT-005 and OUT-002.
    conditions: ["ASM-018 and ASM-019 are not yet confirmed", "API-level enforcement only (ASM-013)"]
    open_defeaters_considered:
      - {id: DEF-024, judgment: "Export excludes a member's own links, which REQ-109 as written requires. It is a gap in the Requirements, not a failure to satisfy them; CP-005 is pending."}
      - {id: DEF-023, judgment: "A capability-level trade-off; it bears on CLM-014, not on this Claim."}
    relationships: [{type: assesses, to: CLM-015}]
    provenance: {source: REPRO-RUN-002, created_by: ACT-002, authority: "CP-004 option B", inputs: [project/assurance/evidence.yaml, project/assurance/claims.yaml], created_at: 2026-09-26}

  - id: ASMT-005
    type: Assessment
    outcome: supported
    claim_state_after: supported
    basis: >
      EVC-023 (qualified; the 22 app tests reproduced twice at 48095f0): HKDF against the RFC 5869
      vectors; vault scenarios for REQ-118..122, including a byte-level plaintext scan; a 300-sequence
      model test comparing every member's decrypted view with a trusted model after every operation;
      and interface tests for REQ-123 and REQ-124. Mutation testing: 13 of 13 (TEST-RUN-010, TEST-RUN-011).
      LIVE-RUN-001 confirms loopback binding and Host rejection on the real server. EVC-024: check and
      trace PASS, with IE-201..205 Subject-rooted.
    conditions: ["ASM-020..022 are unconfirmed", "DEF-026 is open: this Assessment is not a security review"]
    open_defeaters_considered:
      - {id: DEF-026, judgment: "It does not defeat satisfaction of the Requirements as tested. It blocks any security Claim and all household use."}
    relationships: [{type: assesses, to: CLM-016}]
    provenance: {source: REPRO-RUN-003, created_by: ACT-002, authority: "CP-004 option B", inputs: [project/assurance/evidence.yaml, project/assurance/claims.yaml], created_at: 2026-09-26}

  - id: ASMT-006
    type: Assessment
    outcome: supported
    claim_state_after: supported
    basis: >
      EVC-025 (qualified; the 56 core tests reproduced twice at 12379a5): example tests for every listed
      Requirement, including REQ-126's per-month conversion, symmetric rounding, one-off handling, and
      visibility scoping; and the randomized test (2000 seeded sequences) that recomputes visibility, ledger,
      links, the REQ-126 distribution (independently, in floating point), exit, and joiner consent after
      every step. Mutation records: TEST-RUN-007 and TEST-RUN-008 (earlier core), and WI-025 (5 of 5 for REQ-126). EVC-027: check and trace
      PASS, with IE-101..105 Subject-rooted.
    conditions: ["ASM-018 and ASM-019 are not yet confirmed", "API-level enforcement only (ASM-013)"]
    open_defeaters_considered:
      - {id: DEF-023, judgment: "A capability-level trade-off; it bears on CLM-014, not on this Claim."}
      - {id: DEF-015, judgment: "An outcome-level tension between coordination and member standing; the Requirements are satisfied as written."}
    relationships: [{type: assesses, to: CLM-017}]
    provenance: {source: REPRO-RUN-004, created_by: ACT-002, authority: "CP-004 option B", inputs: [project/assurance/evidence.yaml, project/assurance/claims.yaml], created_at: 2026-09-26}

  - id: ASMT-007
    type: Assessment
    outcome: supported
    claim_state_after: supported
    basis: >
      EVC-026 (qualified; the 110 app tests reproduced twice at 12379a5): HKDF against RFC 5869 vectors;
      vault and tamper scenarios for REQ-118..122, including pins and the WI-020 integrity checks; a
      model test comparing every member's decrypted view with a trusted model; interface tests for
      REQ-123 and REQ-124 (loopback, Host, CSRF, CSP, idle lock, escaping), REQ-125 (withdraw), and
      REQ-127 (frequency required, stored, shown); the F-16 two-copy tests; accessibility and glossary
      guards; and an end-to-end test of the real server process over loopback HTTP that confirms from
      /proc/net/tcp that it listens on 127.0.0.1 only. Mutation records: WI-020..WI-028. EVC-027: check and
      trace PASS, with IE-201..205 Subject-rooted.
    conditions: ["ASM-020 and ASM-021 are unconfirmed; ASM-022 is confirmed (REV-024)", "DEF-026 is open: this Assessment is not a security review"]
    open_defeaters_considered:
      - {id: DEF-026, judgment: "It does not defeat satisfaction of the Requirements as tested. It blocks any security Claim and all household use."}
      - {id: DEF-028, judgment: "The unauthenticated access state is mitigated (no key sealed to a reader that appeared without one; detection) but not eliminated; it bounds CLM-018 to the tested behaviour and awaits the independent review."}
    relationships: [{type: assesses, to: CLM-018}]
    provenance: {source: REPRO-RUN-004, created_by: ACT-002, authority: "CP-004 option B", inputs: [project/assurance/evidence.yaml, project/assurance/claims.yaml], created_at: 2026-09-26}

  - id: ASMT-008
    type: Assessment
    outcome: supported
    claim_state_after: supported
    basis: >
      EVC-028 (qualified; the 59 core tests reproduced twice at cbfae0a): example tests for every listed
      Requirement, including REQ-128's conversions for every N weeks, months, and years and irregular yearly
      totals, legacy values matching their intervals, and malformed values counting as one-off; and the
      randomized test (2000 seeded sequences) that recomputes visibility, ledger, links, the REQ-128
      distribution (independently, in floating point, over random intervals, legacy, irregular, and malformed
      values), exit, and joiner consent after every step. Mutation records: TEST-RUN-007, TEST-RUN-008, WI-025,
      WI-033. EVC-030: check and trace PASS.
    conditions: ["ASM-018 and ASM-019 are not yet confirmed", "API-level enforcement only (ASM-013)"]
    open_defeaters_considered:
      - {id: DEF-023, judgment: "A capability-level trade-off; it bears on CLM-014, not on this Claim."}
      - {id: DEF-015, judgment: "An outcome-level tension between coordination and member standing; the Requirements are satisfied as written."}
    relationships: [{type: assesses, to: CLM-019}]
    provenance: {source: REPRO-RUN-005, created_by: ACT-002, authority: "CP-004 option B", inputs: [project/assurance/evidence.yaml, project/assurance/claims.yaml], created_at: 2026-09-27}

  - id: ASMT-009
    type: Assessment
    outcome: supported
    claim_state_after: supported
    basis: >
      EVC-029 (qualified; the 123 app tests reproduced twice at cbfae0a): primitives against RFC 5869; vault,
      tamper, and model tests for REQ-118..122; interface tests for REQ-123 and REQ-124, including agree,
      withdraw, and unlink through the handler, malformed input, and the lost-action notice; REQ-125; REQ-129
      (nine choices, stored intervals, legacy values, fresh-process decoding, export); the F-16 two-copy tests;
      the real-server test over loopback; and the alpha notice. Mutation records: WI-020..WI-033. EVC-030:
      check and trace PASS.
    conditions: ["ASM-020 and ASM-021 are unconfirmed; ASM-022 is confirmed (REV-024)", "DEF-026 is open: this Assessment is not a security review", "alpha use only: made-up data (REV-034)"]
    open_defeaters_considered:
      - {id: DEF-026, judgment: "It does not defeat satisfaction of the Requirements as tested. It blocks any security Claim and any use with real households or real data."}
      - {id: DEF-028, judgment: "The unauthenticated access state is mitigated but not eliminated; it bounds CLM-020 to the tested behaviour and awaits the independent review."}
    relationships: [{type: assesses, to: CLM-020}]
    provenance: {source: REPRO-RUN-005, created_by: ACT-002, authority: "CP-004 option B", inputs: [project/assurance/evidence.yaml, project/assurance/claims.yaml], created_at: 2026-09-27}

  - id: ASMT-010
    type: Assessment
    outcome: supported
    claim_state_after: supported
    basis: >
      EVC-031 (qualified; the 79 core tests reproduced twice at c84c8d9): example tests for every listed
      Requirement, including accounts and debts as items, readings (owners only, append-only, validated),
      who reads which readings, exclusion from the distribution and from links, interest arithmetic, dates
      computed from an anchor (month ends, leap years, every N weeks, one-off, irregular), the running
      balance (only after the reading's date; only items the member owns), and set-asides; and the
      randomized test (2000 seeded sequences of 100 steps) that now adds accounts, debts, and readings and
      checks REQ-131/132 against the ledger replay after every step. Mutation records: WI-036, WI-037.
      EVC-033: check and trace PASS.
    conditions: ["ASM-018 and ASM-019 are not yet confirmed", "API-level enforcement only (ASM-013)"]
    open_defeaters_considered:
      - {id: DEF-023, judgment: "A capability-level trade-off; it bears on CLM-014, not on this Claim."}
      - {id: DEF-015, judgment: "An outcome-level tension; the Requirements are satisfied as written."}
    relationships: [{type: assesses, to: CLM-021}]
    provenance: {source: REPRO-RUN-006, created_by: ACT-002, authority: "CP-004 option B", inputs: [project/assurance/evidence.yaml, project/assurance/claims.yaml], created_at: 2026-09-27}

  - id: ASMT-011
    type: Assessment
    outcome: supported
    claim_state_after: supported
    basis: >
      EVC-032 (qualified; the 152 app tests reproduced twice at c84c8d9): everything ASMT-009 lists, plus
      reading encryption checked against the file (owners hold every reading's key, a grantee only the
      latest; keys removed on losing access and never given for later readings; a reader written into the
      file by editing it is never sealed a reading and is reported; readings absent from the file in
      plaintext; readings decode in a fresh process); balances, dates, coming up, the next 60 days, and
      set-asides through the interface with the date fixed; the demo family from each member's view; and
      the glossary and judgment-word checks over every page. Mutation records: WI-036, WI-037. EVC-033:
      check and trace PASS.
    conditions: ["ASM-020 and ASM-021 are unconfirmed; ASM-022 is confirmed (REV-024)", "DEF-026 is open: this Assessment is not a security review; CP-013 A widened its scope", "alpha use only: made-up data (REV-034)"]
    open_defeaters_considered:
      - {id: DEF-026, judgment: "It does not defeat satisfaction of the Requirements as tested. It blocks any security Claim and any use with real households or real data."}
      - {id: DEF-028, judgment: "The unauthenticated access state is mitigated but not eliminated; readings follow the same trust rule (WI-020)."}
      - {id: DEF-030, judgment: "Members living away cannot use the app; an architecture limit, not a failure to satisfy these Requirements."}
    relationships: [{type: assesses, to: CLM-022}]
    provenance: {source: REPRO-RUN-006, created_by: ACT-002, authority: "CP-004 option B", inputs: [project/assurance/evidence.yaml, project/assurance/claims.yaml], created_at: 2026-09-27}

  - id: ASMT-012
    type: Assessment
    outcome: supported
    claim_state_after: supported
    basis: >
      EVC-034 (qualified; the 91 core tests reproduced twice at 37de874): everything ASMT-010 lists, plus
      hand-computed projections (months after this one; cash from account balances; one-offs in their
      month and excluded from months of cover; debts growing by a month's interest and falling by the
      minimum), plans (steps checked, removable, private; a job switched off takes its marked items; a
      planned one-off once, in its month; borrowing with no payment in its first month), payoff months
      and interest (never when the payment doesn't cover a month's interest), cover against the member's
      own goal, set-aside rates on the member's own links, and shared plans joining only by consent;
      the randomized test (2000 seeded sequences of 100 steps). Mutation records: WI-039 (18 detected).
      EVC-036: check and trace PASS.
    conditions: ["ASM-018 and ASM-019 are not yet confirmed", "API-level enforcement only (ASM-013)"]
    open_defeaters_considered:
      - {id: DEF-023, judgment: "A capability-level trade-off; it bears on CLM-014, not on this Claim."}
      - {id: DEF-015, judgment: "An outcome-level tension; the Requirements are satisfied as written."}
    relationships: [{type: assesses, to: CLM-023}]
    provenance: {source: REPRO-RUN-007, created_by: ACT-002, authority: "CP-004 option B", inputs: [project/assurance/evidence.yaml, project/assurance/claims.yaml], created_at: 2026-09-27}

  - id: ASMT-013
    type: Assessment
    outcome: supported
    claim_state_after: supported
    basis: >
      EVC-035 (qualified; the 162 app tests reproduced twice at 37de874): everything ASMT-011 lists, plus
      the next 12 months, plans side by side with things as they are, job marks, a debt's what-if (never
      saved), goals, and shared plans through the interface with the date fixed; a plan request seen
      before agreeing, naming only items the viewer can see; the sender told who must still agree; plans,
      marks, and goals decoding from the encrypted personal record; the demo family's plans and goals from
      each member's view; and the glossary and judgment-word checks over every page, including a plan
      request. Mutation records: WI-039. EVC-036: check and trace PASS.
    conditions: ["ASM-020 and ASM-021 are unconfirmed; ASM-022 is confirmed (REV-024)", "DEF-026 is open: this Assessment is not a security review; presealing plan requests adds to its scope", "alpha use only: made-up data (REV-034)"]
    open_defeaters_considered:
      - {id: DEF-026, judgment: "It does not defeat satisfaction of the Requirements as tested. It blocks any security Claim and any use with real households or real data."}
      - {id: DEF-028, judgment: "The unauthenticated access state is mitigated but not eliminated; plan requests follow the same trust rule (WI-020)."}
      - {id: DEF-030, judgment: "Members living away cannot use the app; an architecture limit, not a failure to satisfy these Requirements."}
    relationships: [{type: assesses, to: CLM-024}]
    provenance: {source: REPRO-RUN-007, created_by: ACT-002, authority: "CP-004 option B", inputs: [project/assurance/evidence.yaml, project/assurance/claims.yaml], created_at: 2026-09-27}
