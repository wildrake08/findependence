version: 1
artifacts:
  - {id: ASM-001, type: Assumption, qualification: Q1, statement: "A household is an economic unit of one or more persons sharing some part of their economic life, regardless of housing status or residence.", confirmation: {by: ACT-001, review: REV-001}, provenance: {source: ORIENT-001, created_by: ACT-002, authority: proposal_only, inputs: [project/bootstrap.yaml@0ab85fc], created_at: 2026-09-25}}
  - {id: ASM-002, type: Assumption, qualification: Q1, statement: "A person may be a member of more than one household simultaneously.", confirmation: {by: ACT-001, review: REV-001}, provenance: {source: ORIENT-001, created_by: ACT-002, authority: proposal_only, inputs: [project/bootstrap.yaml@0ab85fc], created_at: 2026-09-25}}
  - {id: ASM-003, type: Assumption, statement: "'The life they value' locates valuation in the Subject; the System does not define valued lives.", confirmation: {by: ACT-001, review: REV-001}, provenance: {source: ORIENT-001, created_by: ACT-002, authority: proposal_only, inputs: [project/bootstrap.yaml@0ab85fc], created_at: 2026-09-25}}
  - {id: ASM-004, type: Assumption, qualification: Q2, statement: "'Not held back by money' means money is not the decisive barrier; scarcity and trade-offs persist; the Telos is regulative.", confirmation: {by: ACT-001, review: REV-001}, provenance: {source: ORIENT-001, created_by: ACT-002, authority: proposal_only, inputs: [project/bootstrap.yaml@0ab85fc], created_at: 2026-09-25}}
  - {id: ASM-005, type: Assumption, qualification: Q3, statement: "'Effective capacity' includes access to means as well as knowledge, legibility, and tools.", confirmation: {by: ACT-001, review: REV-001}, provenance: {source: ORIENT-001, created_by: ACT-002, authority: proposal_only, inputs: [project/bootstrap.yaml@0ab85fc], created_at: 2026-09-25}}
  - {id: ASM-006, type: Assumption, qualification: Q3, statement: "'Deliberately shape' includes the capacity to choose to delegate, automate, or not attend.", confirmation: {by: ACT-001, review: REV-001}, provenance: {source: ORIENT-001, created_by: ACT-002, authority: proposal_only, inputs: [project/bootstrap.yaml@0ab85fc], created_at: 2026-09-25}}
  - {id: ASM-007, type: Assumption, qualification: Q5, statement: "The Subject is universal and is not the System's user population.", confirmation: {by: ACT-001, review: REV-001}, provenance: {source: ORIENT-001, created_by: ACT-002, authority: proposal_only, inputs: [project/bootstrap.yaml@0ab85fc], created_at: 2026-09-25}}
  - {id: ASM-008, type: Assumption, statement: "ACT-001 ('me') holds legitimate initiating project authority to ratify the foundation as a project orientation (not as authority over households).", confirmation: {by: ACT-001, review: REV-001}, provenance: {source: ORIENT-001, created_by: ACT-002, authority: proposal_only, inputs: [project/bootstrap.yaml@0ab85fc], created_at: 2026-09-25}}
  - {id: ASM-009, type: Assumption, statement: "The Subject statement supplied by 'prior_project_foundation' is adopted by ACT-001 on their own authority.", confirmation: {by: ACT-001, review: REV-001}, provenance: {source: ORIENT-001, created_by: ACT-002, authority: proposal_only, inputs: [project/bootstrap.yaml@0ab85fc], created_at: 2026-09-25}}
  - {id: ASM-012, type: Assumption, statement: "When household and member values diverge (OUT-002), PRI-001 does not settle whose prevail; this is left open at Outcome level.", confirmation: {by: ACT-001, review: REV-005, resolution: "CAP-005 unanimous revocable consent"}, provenance: {source: OBA-001, created_by: ACT-002, authority: proposal_only, inputs: [project/assurance/analysis/OBA-001-outcome-breadth.md], created_at: 2026-09-25}}
  - {id: ASM-013, type: Assumption, statement: "The core enforces REQ-101..106 at its API only. Code with direct access to the struct can bypass it, so it is not a security boundary; enforcement at a trust boundary is deferred to deployment (CTX-001).", confirmation: {by: ACT-001, review: REV-005}, provenance: {source: WI-004, created_by: ACT-002, authority: "WI-004 (CP-002 delegation)", inputs: [project/realization/requirements-slice1.yaml, project/semantic/sentinel-out005.yaml], created_at: 2026-09-25}}
  - {id: ASM-014, type: Assumption, statement: "Design choices not fixed by REQ-101..106: (1) a non-owner gets not_found for an invisible item, so its existence is not revealed; (2) a grantee sees the item and its owners but not other grantees; (3) a new item is owned by its creator alone; (4) becoming an owner removes a redundant grant.", confirmation: {by: ACT-001, review: REV-005}, provenance: {source: WI-004, created_by: ACT-002, authority: "WI-004 (CP-002 delegation)", inputs: [project/realization/requirements-slice1.yaml, project/semantic/sentinel-out005.yaml], created_at: 2026-09-25}}
  - {id: ASM-015, type: Assumption, statement: "REQ-104 requires the consent of the current owners only. A member can be added as an owner without their own consent, which in this model confers visibility and control and no obligation.", confirmation: {by: ACT-001, review: REV-005}, provenance: {source: WI-004, created_by: ACT-002, authority: "WI-004 (CP-002 delegation)", inputs: [project/realization/requirements-slice1.yaml, project/semantic/sentinel-out005.yaml], created_at: 2026-09-25}}
  - {id: ASM-016, type: Assumption, statement: "Sole-owner deletion does not notify grantees (REQ-108). No new normative decision is needed: REQ-103 already lets any owner revoke every grant unilaterally, so deletion takes nothing from grantees beyond what revocation already allows. Deletion also removes the item's ledger, keeping only a content-free record for the deleter.", confirmation: {by: ACT-001, review: REV-005}, provenance: {source: "CAP-002 decomposition", created_by: ACT-002, authority: proposal_only, inputs: [project/realization/requirements-slice1.yaml], created_at: 2026-09-26}}
  - {id: ASM-017, type: Assumption, statement: "Alignment legibility without evaluation is a sufficient first contribution to OUT-002; whether it changes anything for Subjects needs observation (CTX-001).", confirmation: human_review_requested, provenance: {source: OBA-002, created_by: ACT-002, authority: proposal_only, inputs: [project/semantic/outcomes.yaml, project/semantic/principles.yaml, project/assurance/analysis/OBA-002-alignment.md], created_at: 2026-09-26}}
  - {id: ASM-018, type: Assumption, statement: "A link whose item or value the member can no longer see is hidden, not deleted, and reappears if visibility is regained, revealing nothing the member had not already seen. Links to deleted items are purged so a reused id inherits nothing. Links are not included in export (REQ-109 says 'nothing else'); see DEF-024.", confirmation: {by: ACT-001, review: REV-006}, provenance: {source: WI-008, created_by: ACT-002, authority: proposal_only, inputs: [project/realization/requirements-out002.yaml], created_at: 2026-09-26}}
  - {id: ASM-019, type: Assumption, statement: "On this Erlang/OTP, iteration order of maps with atom keys varies between VM runs. Every order-bearing core output (visible_items, pending, ledger 'by') is therefore sorted, so results and evidence reproduce exactly. Callers must not rely on the order of any other map-derived value.", confirmation: {by: ACT-001, review: REV-006}, provenance: {source: WI-008 test nondeterminism investigation, created_by: ACT-002, authority: proposal_only, inputs: [core/test/randomized_test.exs], created_at: 2026-09-26}}
  - {id: ASM-020, type: Assumption, scope_note: "Since WI-086 (REQ-200, REV-114) this holds for the local form's file only: the hosted form keeps the structure and display names inside a block encrypted under a server key, so its database shows only membership and account identifiers and each household's change counter; the operator, who holds the key, still sees them (REV-111).", statement: "The stored file reveals structural metadata in plaintext: member identifiers, public keys, opaque item identifiers, owner and grantee sets, and the shape of pending proposals. Contents, labels, links, ledger details, and deletion records are encrypted (REQ-122). STUDY-001 consent materials must state this.", confirmation: human_review_requested, provenance: {source: CP-006, created_by: ACT-002, authority: proposal_only, inputs: [project/change/CP-006.yaml], created_at: 2026-09-26}}
  - {id: ASM-021, type: Assumption, statement: "Items are immutable once created (core has no edit operation), so rotating an item's key when a member loses access would protect nothing they had not already seen. Losing access removes their sealed key. If item editing is ever added, key rotation on loss of access becomes necessary and must be added as a Requirement.", confirmation: human_review_requested, provenance: {source: CP-006, created_by: ACT-002, authority: proposal_only, inputs: [core/lib/findependence/household.ex], created_at: 2026-09-26}}
  - {id: ASM-022, type: Assumption, statement: "Household membership is fixed at setup (core Household.new/1; members can leave but not join), so each member sets their passphrase privately during setup. One member session is active at a time on the device.", confirmation: {by: ACT-001, review: REV-024, resolution: "CP-009 option A: fixed for STUDY-001; joining by everyone's agreement (CP-009 B) is the designed path after the study and the independent review"}, provenance: {source: CP-006, created_by: ACT-002, authority: proposal_only, inputs: [core/lib/findependence/household.ex], created_at: 2026-09-26}}
