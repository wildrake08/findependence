  - id: REQ-005
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-001, review: REV-001, decision: 2_check_gate}
    statement: "The interpretation used to evaluate each invariant shall be documented in the engine and printable with --explain, because core.yaml defines invariants by name only."
