version: 1
artifacts:
  - id: REQ-001
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-001, review: REV-001, decision: 2_check_gate}
    statement: "scripts/check shall load the framework definitions and the project artifact store, evaluate every invariant listed in framework/invariants/core.yaml, and report one outcome per invariant from the validation outcomes {pass, fail, indeterminate}, together with the number of artifacts it applied to."
    relationships:
      - {type: derived_from, to: CON-001}
    history:
      - {from: null, to: proposed, by: ACT-002, authority: "bootstrap.yaml autonomy[requirement_derivation]", change: CHG-004, at: 2026-09-25}
      - {from: proposed, to: coherent, by: ACT-001, authority: "REV-001 decision 2_check_gate", change: CHG-004, at: 2026-09-25}
      - {from: coherent, to: specified, by: ACT-001, authority: "REV-001 decision 2_check_gate", change: CHG-004, at: 2026-09-25}
    provenance: {source: WI-001, created_by: ACT-002, authority: "bootstrap.yaml autonomy[requirement_derivation]", inputs: [framework/invariants/core.yaml, automation/registry.yaml, CONSTITUTION.md, PROMPT.md], created_at: 2026-09-25}
  - id: REQ-002
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-001, review: REV-001, decision: 2_check_gate}
    statement: "The overall result shall be fail if any invariant fails or the artifact store cannot be loaded, otherwise indeterminate if any invariant is indeterminate, otherwise pass. The exit code shall be 0 for pass, 1 for fail, 3 for indeterminate, and 2 for an engine error."
    relationships:
      - {type: derived_from, to: CON-001}
      - {type: derived_from, to: CON-003}
    history:
      - {from: null, to: proposed, by: ACT-002, authority: "bootstrap.yaml autonomy[requirement_derivation]", change: CHG-004, at: 2026-09-25}
      - {from: proposed, to: coherent, by: ACT-001, authority: "REV-001 decision 2_check_gate", change: CHG-004, at: 2026-09-25}
      - {from: coherent, to: specified, by: ACT-001, authority: "REV-001 decision 2_check_gate", change: CHG-004, at: 2026-09-25}
    provenance: {source: WI-001, created_by: ACT-002, authority: "bootstrap.yaml autonomy[requirement_derivation]", inputs: [framework/invariants/core.yaml, automation/registry.yaml, CONSTITUTION.md, PROMPT.md], created_at: 2026-09-25}
  - id: REQ-003
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-001, review: REV-001, decision: 2_check_gate}
    statement: "An invariant with no implemented rule, not declared deterministic, or whose evaluation raises an error shall be reported indeterminate and never pass."
    relationships:
      - {type: derived_from, to: CON-001}
      - {type: derived_from, to: CON-003}
    history:
      - {from: null, to: proposed, by: ACT-002, authority: "bootstrap.yaml autonomy[requirement_derivation]", change: CHG-004, at: 2026-09-25}
