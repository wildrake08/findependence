    provenance: {source: WI-001, created_by: ACT-002, authority: "bootstrap.yaml autonomy[requirement_derivation]", inputs: [framework/invariants/core.yaml, automation/registry.yaml, CONSTITUTION.md, PROMPT.md], created_at: 2026-09-25}
  - id: REQ-004
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-001, review: REV-001, decision: 2_check_gate}
    statement: "scripts/check shall not write to the repository or change any artifact, file, or git state."
