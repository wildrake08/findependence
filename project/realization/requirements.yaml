  - id: REQ-007
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-001, review: REV-001, decision: 2_check_gate}
    statement: "Output shall state that PASS means only that no applicable deterministic invariant failed, and does not establish semantic, causal, normative, Capability, Outcome, Purpose, or Telos truth."
