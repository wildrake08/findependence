  - id: REQ-006
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-001, review: REV-001, decision: 2_check_gate}
    statement: "Every *.yaml file under project/ other than manifest.yaml and bootstrap.yaml shall be an artifact document with a top-level artifacts list; any unparsable or non-conforming file shall fail the store load."
    relationships:
