  - id: REQ-110
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "A member who owns no items shall be able to leave the household without anyone else's consent. Leaving removes their membership, every grant they hold, and every pending proposal that would grant to them or make them an owner. A member who still owns items shall be refused until they relinquish, transfer, or delete them."
    relationships: [{type: derived_from, to: MEC-007}, {type: derived_from, to: PRI-002}]
    history:
