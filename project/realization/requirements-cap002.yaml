    provenance: {source: "CP-003; CAP-002 decomposition", created_by: ACT-002, authority: "CP-002 delegation / REV-004", inputs: [project/change/CP-003.yaml, project/semantic/sentinel-out005.yaml, project/semantic/principles.yaml], created_at: 2026-09-26}
  - id: REQ-108
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "A sole owner shall be able to delete an item without anyone else's consent; a joint owner cannot. Deletion removes the item, its grants, its pending proposals, and its ledger. A deletion record containing only the item id and a sequence number is kept, readable only by the member who deleted it."
    relationships: [{type: derived_from, to: MEC-005}, {type: derived_from, to: PRI-002}]
