version: 1
# REQ-107 supersedes REQ-104 (CP-003). REQ-108..110 realize CAP-002.
artifacts:
  - id: REQ-107
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-001, review: REV-004, decision: 1_exit_vs_consent}
    statement: "An item's owner set shall change only with the consent of all current owners, with one exception: any owner may remove only themselves without others' consent, provided at least one owner remains. No member may add themselves as an owner."
    relationships: [{type: derived_from, to: MEC-004}, {type: derived_from, to: PRI-002}, {type: supersedes, to: REQ-104}]
    history:
      - {from: null, to: proposed, by: ACT-002, authority: proposal_only, change: CHG-011, at: 2026-09-26}
