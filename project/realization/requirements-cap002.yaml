      - {from: proposed, to: coherent, by: ACT-001, authority: "REV-006 decision 2_cp005 (CP-005 wording)", change: CHG-016, at: 2026-09-26}
      - {from: coherent, to: specified, by: ACT-001, authority: "REV-006 decision 2_cp005 (CP-005 wording)", change: CHG-016, at: 2026-09-26}
      - {from: specified, to: superseded, by: ACT-001, authority: "REV-063 (VV-001 F-01)", change: CHG-063, at: 2026-09-27}
    provenance: {source: CP-005, created_by: ACT-002, authority: "REV-006", inputs: [project/change/CP-005.yaml], created_at: 2026-09-26}
