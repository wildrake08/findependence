  - id: REQ-153
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "The member shall see how sensitive the result is: the balance at retirement and how long it would last with the return two percentage points lower and higher, and retiring two years earlier and later, beside the result as entered. Nothing about these alternatives is saved."
    acceptance_criteria:
      - {id: AC-1, criterion: "The balance at retirement is shown with the return two percentage points lower and higher, and retiring two years earlier and later, each worked out with that one change."}
      - {id: AC-2, criterion: "For each of those alternatives, how long the balance would last paying the difference is shown, worked out with that one change (years and months with the age, 'no difference to pay', or 'some remains at 100')."}
      - {id: AC-3, criterion: "The alternatives are shown beside the result as entered: on the same page, in one table whose first row is the result as entered."}
      - {id: AC-4, criterion: "Nothing about the alternatives is saved: the member's assumptions are unchanged after they are worked out and shown."}
    acceptance_criteria_added: {by: ACT-002, authority: "REV-069; REV-070", derived_in: WI-057, audit: VV-002, change: CHG-071, at: 2026-09-28, note: "the statement is unchanged; interpretations ratified by ACT-001 in REV-070"}
