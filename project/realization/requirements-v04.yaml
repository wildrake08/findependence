      - {from: proposed, to: coherent, by: ACT-002, authority: "CP-002 (delegated; parent specified, check and trace pass)", change: CHG-049, at: 2026-09-27}
      - {from: coherent, to: specified, by: ACT-002, authority: "CP-002 (delegated; parent specified, check and trace pass)", change: CHG-049, at: 2026-09-27}
    provenance: {source: ROADMAP-ALPHA, created_by: ACT-002, authority: "CP-002 delegation; REV-043", inputs: [project/semantic/alpha-capabilities.yaml, project/semantic/v04-retirement.yaml, project/assurance/plans/ROADMAP-ALPHA.md], created_at: 2026-09-27}
  - id: REQ-152
    type: Requirement
    state: superseded
    superseded_by: REQ-174
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "With a target income as well, the member shall see the monthly difference between the target and their Social Security estimate, and how long the balance at retirement would last paying that difference each month while growing at the same return: in years and months and the age reached, or that some would remain at age 100, or that the Social Security estimate covers the target. No result is scored, labelled, or compared with any figure the member did not set."
    relationships: [{type: derived_from, to: MEC-021}, {type: derived_from, to: PRI-001}, {type: derived_from, to: PRI-002}]
    history:
