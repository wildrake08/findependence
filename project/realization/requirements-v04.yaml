  - id: REQ-154
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "No retirement page shall suggest an investment, a product, a contribution, a return, a retirement age, or a target; the judgment-word and glossary checks cover every retirement page."
    acceptance_criteria:
      - {id: AC-1, criterion: "No assumption field on a retirement page is prefilled or offers values: every field starts empty, with no placeholder, list, select, or datalist (interpretation of 'suggest' for contributions, returns, ages, and targets)."}
      - {id: AC-2, criterion: "No retirement page names an investment or a product (interpretation: none of a fixed list of investment and product terms, such as index fund, mutual fund, target-date, annuity, ETF, stock, bond, Roth, brokerage, CD, or fund-company names, appears in its visible text)."}
      - {id: AC-3, criterion: "No retirement page contains a recommending sentence (interpretation: none of a fixed list of recommending forms, such as should, recommend, suggest, consider, advise, try to, aim for, better, best, ideal, enough, on track, behind, appears in its visible text, apart from the page's own disclaimer that nothing is advice or a suggestion)."}
      - {id: AC-4, criterion: "The judgment-word and glossary checks pass on every retirement page: the retirement page with nothing set, with assumptions missing, with a result, with a result that outlasts age 100, with Social Security covering the target, refused with errors, for a member with no retirement account, and a retirement account's own page."}
    acceptance_criteria_added: {by: ACT-002, authority: "REV-069; REV-070", derived_in: WI-057, audit: VV-002, change: CHG-071, at: 2026-09-28, note: "the statement is unchanged; interpretations ratified by ACT-001 in REV-070"}
    relationships: [{type: derived_from, to: MEC-021}, {type: derived_from, to: PRI-001}, {type: derived_from, to: PRI-002}]
