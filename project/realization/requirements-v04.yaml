  - id: REQ-151
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "With a birth year, a retirement age, and a return, the member shall see their retirement accounts' balance year by year until January of the year they reach that age: starting from the latest balances of the retirement accounts they can see, growing monthly at the return and adding each month's contributions, in today's dollars. The page states these assumptions next to the results."
    acceptance_criteria:
      - {id: AC-1, criterion: "Without a birth year, a retirement age, and a return there is no projection, and the page says which are needed."}
      - {id: AC-2, criterion: "With them, the page shows the balance year by year from this month until January of the year the member reaches that age (no rows when that is this year or earlier)."}
      - {id: AC-3, criterion: "It starts from the latest balances of the retirement accounts the member can see (an account with no balance counts as zero), and only those."}
      - {id: AC-4, criterion: "Each month it grows at the return and adds that month's contributions (exact values checked against an independent calculation)."}
      - {id: AC-5, criterion: "The page says the result is in today's dollars and states the assumptions next to the result: the starting balances and dates, the monthly contribution, the return, and the age."}
    acceptance_criteria_added: {by: ACT-002, authority: "REV-069; REV-070", derived_in: WI-057, audit: VV-002, change: CHG-071, at: 2026-09-28, note: "the statement is unchanged; interpretations ratified by ACT-001 in REV-070"}
    relationships: [{type: derived_from, to: MEC-021}, {type: derived_from, to: PRI-001}, {type: derived_from, to: PRI-002}]
    history:
