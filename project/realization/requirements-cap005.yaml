version: 1
# CAP-005 Requirements (CHG-014).
artifacts:
  - id: REQ-115
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "A member shall become an owner of an item of any kind only with their own consent in addition to the consent of every current owner. A member being added shall see the proposal, including the item's attributes, only once every current owner has consented."
    statement_changes:
      - {by: ACT-001, review: REV-114, change: CP-029, at: 2026-10-02, previous_statement: "A member shall become an owner of a value item only with their own consent in addition to the consent of every current owner. A member being added shall see the proposal, including the value's attributes, only once every current owner has consented, and may then consent or ignore it. For non-value items REQ-107 is unchanged."}
    acceptance_criteria:
      - {id: AC-1, criterion: "A proposal adding a member to an item's owners is not applied without that member's own consent, even when every current owner has consented."}
      - {id: AC-2, criterion: "Nor is it applied without every current owner's consent: the joiner can't consent before then."}
      - {id: AC-3, criterion: "The member being added sees the proposal, with the item's attributes, only once every current owner has consented."}
      - {id: AC-4, criterion: "They may then consent, and become an owner."}
      - {id: AC-5, criterion: "Or ignore it: without their consent they are not an owner and the item is unchanged."}
      - {id: AC-6, criterion: "This holds for every kind of item: money items, values, accounts and debts, and plans; giving an item away (a sole owner proposing another member as its only owner) waits for the receiver's consent too."}
    acceptance_criteria_changes:
      - {by: ACT-001, review: REV-114, change: CP-029, at: 2026-10-02, note: "generalized from values to every item (ASSESS-002 FND-210; REV-114): nobody becomes an owner of anything without agreeing; AC-6 replaced (previously: for items that are not values, current owners' consent suffices)"}
    acceptance_criteria_added: {by: ACT-002, authority: "REV-069; REV-070", derived_in: WI-057, audit: VV-002, change: CHG-071, at: 2026-09-28, note: "the statement is unchanged; interpretations ratified by ACT-001 in REV-070"}
    relationships: [{type: derived_from, to: MEC-011}, {type: derived_from, to: PRI-002}, {type: derived_from, to: PRI-001}]
    history:
      - {from: null, to: proposed, by: ACT-002, authority: proposal_only, change: CHG-014, at: 2026-09-26}
      - {from: proposed, to: coherent, by: ACT-002, authority: "CP-002 (delegated; parent specified, check and trace pass)", change: CHG-014, at: 2026-09-26}
      - {from: coherent, to: specified, by: ACT-002, authority: "CP-002 (delegated; parent specified, check and trace pass)", change: CHG-014, at: 2026-09-26}
    provenance: {source: "CAP-005 decomposition", created_by: ACT-002, authority: "CP-002 delegation", inputs: [project/semantic/sentinel-out002.yaml, project/realization/requirements-cap002.yaml, project/assurance/assumptions.yaml], created_at: 2026-09-26}
  - id: REQ-116
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "Any participant shall be able to withdraw from a shared value without others' consent while another participant remains; the last participant may delete it (REQ-108)."
    acceptance_criteria:
      - {id: AC-1, criterion: "Each participant of a shared value, its creator or a member who joined, can withdraw without anyone else's consent while another participant remains."}
      - {id: AC-2, criterion: "The last participant can delete the value alone."}
    acceptance_criteria_added: {by: ACT-002, authority: "REV-069; REV-070", derived_in: WI-057, audit: VV-002, change: CHG-071, at: 2026-09-28, note: "the statement is unchanged; interpretations ratified by ACT-001 in REV-070"}
    relationships: [{type: derived_from, to: MEC-011}, {type: derived_from, to: PRI-003}]
    history:
