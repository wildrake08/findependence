    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "A member shall become an owner of a value item only with their own consent in addition to the consent of every current owner. A member being added shall see the proposal, including the value's attributes, only once every current owner has consented, and may then consent or ignore it. For non-value items REQ-107 is unchanged."
