  - id: REQ-015
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: >
      check I-012 shall enforce the following.
      (a) Evidence whose stage is qualified, or whose integrity is valid, has a qualification record
      naming an existing Actor (by).
      (b) If that Actor is not human, the Evidence kind is test or deterministic_check, and the
      qualification records a reproduction {commit, command}.
      (c) A Claim in state supported is the target of at least one Assessment.
      (d) An Assessment created by a non-human Actor assesses only Claims of level implementation.
    relationships:
      - {type: derived_from, to: CON-006}
    history:
