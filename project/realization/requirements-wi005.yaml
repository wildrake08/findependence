  - id: REQ-014
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: >
      Superseded and retired artifacts shall carry no realization obligation in check I-007 or in
      the trace downward rule, and a superseded or retired artifact on an upward path remains a defect.
      Every artifact in state superseded shall have a supersedes relationship pointing to it from its
      successor.
    relationships:
      - {type: derived_from, to: CON-004}
      - {type: derived_from, to: CON-001}
