  - id: REQ-105
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    history:
      - {from: null, to: proposed, by: ACT-002, authority: proposal_only, change: CHG-007, at: 2026-09-25}
      - {from: proposed, to: coherent, by: ACT-002, authority: "CP-002 (delegated; parent specified, check and trace pass)", change: CHG-009, at: 2026-09-25}
      - {from: coherent, to: specified, by: ACT-002, authority: "CP-002 (delegated; parent specified, check and trace pass)", change: CHG-009, at: 2026-09-25}
    statement: "Every ownership change, grant, and revocation shall be recorded append-only and be readable by every current owner of the item."
    acceptance_criteria:
      - {id: AC-1, criterion: "Each ownership change (an agreed owner change, a relinquishment), grant, and revocation (including a grant removed when its grantee leaves) adds an entry to the item's history."}
      - {id: AC-2, criterion: "The history is complete: replaying it alone reproduces the item's current owners and grantees."}
      - {id: AC-3, criterion: "Append-only: while the item exists, earlier entries are never changed or removed."}
      - {id: AC-4, criterion: "Every current owner, including one who became an owner later, can read the whole history."}
    acceptance_criteria_added: {by: ACT-002, authority: "REV-069; REV-070", derived_in: WI-057, audit: VV-002, change: CHG-071, at: 2026-09-28, note: "the statement is unchanged; interpretations ratified by ACT-001 in REV-070"}
    relationships: [{type: derived_from, to: MEC-003}]
    provenance: {source: OBA-001, created_by: ACT-002, authority: proposal_only, inputs: [project/semantic/PUR-001.yaml, project/semantic/principles.yaml, project/governance/REV-001.yaml], created_at: 2026-09-25}
  - id: REQ-106
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    history:
      - {from: null, to: proposed, by: ACT-002, authority: proposal_only, change: CHG-007, at: 2026-09-25}
      - {from: proposed, to: coherent, by: ACT-002, authority: "CP-002 (delegated; parent specified, check and trace pass)", change: CHG-009, at: 2026-09-25}
      - {from: coherent, to: specified, by: ACT-002, authority: "CP-002 (delegated; parent specified, check and trace pass)", change: CHG-009, at: 2026-09-25}
    statement: "Any household-level view or aggregate shall be computed only over items visible to the requesting member, so that no totals leak information from invisible items."
    acceptance_criteria:
      - {id: AC-1, criterion: "Every aggregate the core computes for a member (sums, the value distribution, the projection, the day-by-day cash flow, the retirement projection) counts only items visible to that member."}
      - {id: AC-2, criterion: "Every household-level page of the interface is identical, apart from per-request form tokens, whether or not other members hold entries invisible to the member (items, a value, a link, an account and a debt with readings, a plan, a grant to a third member)."}
    acceptance_criteria_added: {by: ACT-002, authority: "REV-069; REV-070", derived_in: WI-057, audit: VV-002, change: CHG-071, at: 2026-09-28, note: "the statement is unchanged; interpretations ratified by ACT-001 in REV-070"}
    relationships: [{type: derived_from, to: MEC-002}, {type: derived_from, to: PRI-002}]
