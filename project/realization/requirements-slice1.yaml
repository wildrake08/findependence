# First-slice Requirements (CAP-001), accepted by ACT-002 under CP-002 delegation (CHG-009).
artifacts:
  - id: REQ-101
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    history:
      - {from: null, to: proposed, by: ACT-002, authority: proposal_only, change: CHG-007, at: 2026-09-25}
      - {from: proposed, to: coherent, by: ACT-002, authority: "CP-002 (delegated; parent specified, check and trace pass)", change: CHG-009, at: 2026-09-25}
      - {from: coherent, to: specified, by: ACT-002, authority: "CP-002 (delegated; parent specified, check and trace pass)", change: CHG-009, at: 2026-09-25}
    statement: "Every economic item shall have a non-empty set of owning members; an item without owners shall be rejected."
    acceptance_criteria:
      - {id: AC-1, criterion: "Every item, of every kind (money in or out, value, account, debt, shared plan), has a non-empty owner set when created: its creator."}
      - {id: AC-2, criterion: "Every owner is a household member: a non-member can't create an item or be proposed as an owner."}
      - {id: AC-3, criterion: "A proposal to make an item's owner set empty is refused, for every kind of item."}
      - {id: AC-4, criterion: "No operation leaves an item without owners: the last owner can't relinquish it or leave the household while owning it."}
    acceptance_criteria_added: {by: ACT-002, authority: "REV-069; REV-070", derived_in: WI-057, audit: VV-002, change: CHG-071, at: 2026-09-28, note: "the statement is unchanged; interpretations ratified by ACT-001 in REV-070"}
    relationships: [{type: derived_from, to: MEC-001}, {type: derived_from, to: MEC-004}]
    rejustification: {change: CHG-011, added: MEC-004, reason: "MEC-001 superseded by MEC-004 (CP-003); REQ-101 wording unchanged and still entailed by MEC-004", authority: "CP-002 delegation (MEC-004 specified)"}
    provenance: {source: OBA-001, created_by: ACT-002, authority: proposal_only, inputs: [project/semantic/PUR-001.yaml, project/semantic/principles.yaml, project/governance/REV-001.yaml], created_at: 2026-09-25}
