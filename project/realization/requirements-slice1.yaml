    statement: "A member shall be able to read an item if and only if they are one of its owners or hold an active grant for it."
    relationships: [{type: derived_from, to: MEC-002}, {type: derived_from, to: PRI-002}]
    provenance: {source: OBA-001, created_by: ACT-002, authority: proposal_only, inputs: [project/semantic/PUR-001.yaml, project/semantic/principles.yaml, project/governance/REV-001.yaml], created_at: 2026-09-25}
  - id: REQ-103
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    history:
      - {from: null, to: proposed, by: ACT-002, authority: proposal_only, change: CHG-007, at: 2026-09-25}
      - {from: proposed, to: coherent, by: ACT-002, authority: "CP-002 (delegated; parent specified, check and trace pass)", change: CHG-009, at: 2026-09-25}
      - {from: coherent, to: specified, by: ACT-002, authority: "CP-002 (delegated; parent specified, check and trace pass)", change: CHG-009, at: 2026-09-25}
    statement: "Only an owner may create or revoke a grant. Creating a grant on a jointly owned item requires the consent of every owner; any single owner may revoke one."
    acceptance_criteria:
      - {id: AC-1, criterion: "Only an owner can create a grant: a grantee, an unrelated member, or a non-member proposing one is refused and nothing is pending."}
      - {id: AC-2, criterion: "Only an owner can revoke a grant: a grantee (even of their own grant), an unrelated member, or a non-member is refused and the grant stays."}
      - {id: AC-3, criterion: "On a jointly owned item a grant takes effect only once every current owner has consented; with a single owner it takes effect at once."}
      - {id: AC-4, criterion: "Any single owner of a jointly owned item can revoke a grant alone."}
    acceptance_criteria_added: {by: ACT-002, authority: "REV-069; REV-070", derived_in: WI-057, audit: VV-002, change: CHG-071, at: 2026-09-28, note: "the statement is unchanged; interpretations ratified by ACT-001 in REV-070"}
    relationships: [{type: derived_from, to: MEC-002}, {type: derived_from, to: PRI-002}]
    provenance: {source: OBA-001, created_by: ACT-002, authority: proposal_only, inputs: [project/semantic/PUR-001.yaml, project/semantic/principles.yaml, project/governance/REV-001.yaml], created_at: 2026-09-25}
