  - id: REQ-143
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "For a plan, the member shall see the twelve-month projection as things are and with the plan, side by side, including the interest on anything borrowed, and every place a plan appears shall say that it is a plan."
    acceptance_criteria:
      - {id: AC-1, criterion: "For a plan, the member sees the twelve months, each with the figure without the plan and with it, side by side."}
      - {id: AC-2, criterion: "The with-plan figures include interest on planned borrowing, and the page states that interest."}
      - {id: AC-3, criterion: "Each place a plan (a member's own plan or a shared plan) is named or listed says, in that entry or its section, that it is a plan. Places enumerated: the plans list, a plan's page, the confirm-delete page for a plan, a plan request's preview, a shared plan's page, home's request lines (to the member asked and to the proposer), the leave checklist, the export page, and the stop-owning and delete confirmations for a shared plan."}
    acceptance_criteria_added: {by: ACT-002, authority: "REV-069; REV-070", derived_in: WI-057, audit: VV-002, change: CHG-071, at: 2026-09-28, note: "the statement is unchanged; interpretations ratified by ACT-001 in REV-070"}
