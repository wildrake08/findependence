  - id: REQ-146
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "A member shall be able to set, privately, an emergency fund goal as a number of months of money out, and see how long the savings accounts they can see would cover the money out of the items they own, and their progress toward the goal, with no target supplied by the System."
    acceptance_criteria:
      - {id: AC-1, criterion: "A member can set, and clear, an emergency fund goal as a number of months of money out; an out-of-range value is refused."}
      - {id: AC-2, criterion: "The member sees how long the savings accounts they can see (their own and ones shared with them) would cover the money out of the items they own; money out of items only shared with them is not counted."}
      - {id: AC-3, criterion: "With a goal set, the member sees their progress toward it."}
      - {id: AC-4, criterion: "The goal is private: another member, even one who can see the same savings, has no goal and sees none."}
      - {id: AC-5, criterion: "The System sets, prefills, and shows no goal value: until the member sets one, there is no goal, the goal field is empty, and no goal or progress is shown."}
      - {id: AC-6, criterion: "The page offers no suggested number of months for the goal."}
    acceptance_criteria_added: {by: ACT-002, authority: "REV-069; REV-070", derived_in: WI-057, audit: VV-002, change: CHG-071, at: 2026-09-28, note: "the statement is unchanged; interpretations ratified by ACT-001 in REV-070"}
