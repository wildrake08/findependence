  - id: REQ-147
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "A member shall be able to set, privately, a set-aside rate for the money in linked to one of their values (for example a side business), and see the monthly amount that rate sets aside."
    acceptance_criteria:
      - {id: AC-1, criterion: "A member can set, and remove, a set-aside rate for money in linked to a value they can see."}
      - {id: AC-2, criterion: "A rate for a value the member can't see is refused."}
      - {id: AC-3, criterion: "The member sees the monthly amount the rate sets aside from the repeating money in linked to that value by their own links."}
      - {id: AC-4, criterion: "The rate is private: another member has no set-aside from it."}
    acceptance_criteria_added: {by: ACT-002, authority: "REV-069; REV-070", derived_in: WI-057, audit: VV-002, change: CHG-071, at: 2026-09-28, note: "the statement is unchanged; interpretations ratified by ACT-001 in REV-070"}
