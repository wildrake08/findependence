    provenance: {source: ROADMAP-ALPHA, created_by: ACT-002, authority: "CP-002 delegation; REV-041", inputs: [project/semantic/alpha-capabilities.yaml, project/assurance/plans/ROADMAP-ALPHA.md], created_at: 2026-09-27}
  - id: REQ-142
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "A member shall be able to keep plans of their own, private to them, each with a name and any number of steps: switch off items they own from a month; add a planned money-in or money-out item with how often it happens, from a month (a one-off happens once, in that month); or borrow an amount at a rate with a monthly payment, from a month. Steps can be added and removed. Plans are never counted in real totals."
    acceptance_criteria:
      - {id: AC-1, criterion: "A member can create a plan with a name; an empty name is refused."}
      - {id: AC-2, criterion: "A member can keep several plans, each with any number of steps."}
      - {id: AC-3, criterion: "A switch-off step turns off items the member owns from a month; items they don't own, and non-money items, are refused."}
      - {id: AC-4, criterion: "A planned money-in or money-out step with how often it happens applies from a month; a planned one-off happens once, in that month."}
      - {id: AC-5, criterion: "A borrow step takes an amount, a rate, and a monthly payment, from a month."}
      - {id: AC-6, criterion: "Steps can be added and removed."}
      - {id: AC-7, criterion: "Plans are private: another member can't see, open, or add to them."}
      - {id: AC-8, criterion: "Plans never change a real total: the twelve months as things are, the distribution totals, the running balance, set-asides, and how long savings would last are the same with or without a plan."}
    acceptance_criteria_added: {by: ACT-002, authority: "REV-069; REV-070", derived_in: WI-057, audit: VV-002, change: CHG-071, at: 2026-09-28, note: "the statement is unchanged; interpretations ratified by ACT-001 in REV-070"}
    relationships: [{type: derived_from, to: MEC-019}, {type: derived_from, to: PRI-001}, {type: derived_from, to: PRI-002}]
