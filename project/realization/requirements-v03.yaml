  - id: REQ-148
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "A member shall be able to propose one of their plans to other members as a shared plan. Each member named shall become an owner of it only with their own consent and that of every current owner (REQ-115 applied to plans); until they agree they see the proposal and the plan. A shared plan's steps never change."
    acceptance_criteria:
      - {id: AC-1, criterion: "A member can propose one of their own plans to other members as a shared plan (a snapshot item of kind plan); they can't propose another member's plan."}
      - {id: AC-2, criterion: "A named member becomes an owner only with their own consent."}
      - {id: AC-3, criterion: "With several members named, one's consent makes no one an owner; each becomes an owner only once every named member and owner has agreed."}
      - {id: AC-4, criterion: "With several current owners, a named member becomes an owner only with every current owner's consent too."}
      - {id: AC-5, criterion: "Until they agree, a named member sees the proposal and the plan's steps (once every current owner has agreed, per REQ-167)."}
      - {id: AC-6, criterion: "A shared plan's steps never change: not on consent, not when the plan it came from is changed or deleted, not when an item a step names is deleted, not when an owner leaves it, and no member can add or remove a step of it."}
    acceptance_criteria_added: {by: ACT-002, authority: "REV-069; REV-070", derived_in: WI-057, audit: VV-002, change: CHG-071, at: 2026-09-28, note: "the statement is unchanged; interpretations ratified by ACT-001 in REV-070"}
