  - id: REQ-144
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "A member shall be able to mark items they own as depending on a job (an income item they own), and remove the mark. When a plan switches off that income item, the items marked as depending on it switch off too. Marks are private to the member."
    acceptance_criteria:
      - {id: AC-1, criterion: "A member can mark an item they own as depending on an income item they own."}
      - {id: AC-2, criterion: "The job must be an income item the member owns; marking against anything else, or items they don't own, is refused."}
      - {id: AC-3, criterion: "A member can remove a mark."}
      - {id: AC-4, criterion: "When a plan switches off the income item, the items marked as depending on it switch off too, from the same month."}
      - {id: AC-5, criterion: "Marks are private: another member has none of them and can't make or read them."}
    acceptance_criteria_added: {by: ACT-002, authority: "REV-069; REV-070", derived_in: WI-057, audit: VV-002, change: CHG-071, at: 2026-09-28, note: "the statement is unchanged; interpretations ratified by ACT-001 in REV-070"}
