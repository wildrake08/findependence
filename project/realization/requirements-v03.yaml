  - id: REQ-145
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "On a debt's page, a member who can see it shall be able to see, as facts at its latest reading: how many months paying only the minimum would take to clear it and the interest over that time; the same with an extra monthly amount they enter; and the monthly interest at a different rate they enter. Nothing is stored and no payment order is suggested."
    acceptance_criteria:
      - {id: AC-1, criterion: "On a debt's page, the months to clear it paying only the minimum, and the interest over that time."}
      - {id: AC-2, criterion: "The same with an extra monthly amount the member enters."}
      - {id: AC-3, criterion: "The monthly interest at a different rate the member enters."}
      - {id: AC-4, criterion: "Every figure is worked out from the debt's latest reading, for owners and for others who can see it."}
      - {id: AC-5, criterion: "A member the debt is shared with (not an owner) sees all three."}
      - {id: AC-6, criterion: "The results are stated as facts: no judgment words."}
      - {id: AC-7, criterion: "Nothing is stored: the vault file is unchanged after working out what-ifs."}
      - {id: AC-8, criterion: "No payment order is suggested: with two debts, neither debt's what-if names the other debt or uses ordering or advice words (first, before, next, priority, avalanche, snowball, should, recommend, instead, highest, lowest, focus, target)."}
    acceptance_criteria_added: {by: ACT-002, authority: "REV-069; REV-070", derived_in: WI-057, audit: VV-002, change: CHG-071, at: 2026-09-28, note: "the statement is unchanged; interpretations ratified by ACT-001 in REV-070"}
    relationships: [{type: derived_from, to: MEC-019}, {type: derived_from, to: PRI-001}, {type: derived_from, to: PRI-002}]
