version: 1
# v0.3.0-alpha Requirements (CAP-007, CAP-013, CAP-005 extension), specified under CP-002 delegation (REV-041).
artifacts:
  - id: REQ-141
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "A member shall be able to see, for each of the next twelve months, the money in and out of the items they own (repeating items as their per-month amounts; dated one-off items in their month), the cash at the end of each month starting from the latest balances of the accounts they can see, and each debt they can see with its balance growing by a month of interest and falling by its minimum payment, until paid off. The page states these assumptions next to the results."
    relationships: [{type: derived_from, to: MEC-019}, {type: derived_from, to: PRI-001}, {type: derived_from, to: PRI-002}]
    history:
      - {from: null, to: proposed, by: ACT-002, authority: proposal_only, change: CHG-048, at: 2026-09-27}
      - {from: proposed, to: coherent, by: ACT-002, authority: "CP-002 (delegated; parent specified, check and trace pass)", change: CHG-048, at: 2026-09-27}
      - {from: coherent, to: specified, by: ACT-002, authority: "CP-002 (delegated; parent specified, check and trace pass)", change: CHG-048, at: 2026-09-27}
    provenance: {source: ROADMAP-ALPHA, created_by: ACT-002, authority: "CP-002 delegation; REV-041", inputs: [project/semantic/alpha-capabilities.yaml, project/assurance/plans/ROADMAP-ALPHA.md], created_at: 2026-09-27}
  - id: REQ-142
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "A member shall be able to keep plans of their own, private to them, each with a name and any number of steps: switch off items they own from a month; add a planned money-in or money-out item with how often it happens, from a month (a one-off happens once, in that month); or borrow an amount at a rate with a monthly payment, from a month. Steps can be added and removed. Plans are never counted in real totals."
    relationships: [{type: derived_from, to: MEC-019}, {type: derived_from, to: PRI-001}, {type: derived_from, to: PRI-002}]
    history:
      - {from: null, to: proposed, by: ACT-002, authority: proposal_only, change: CHG-048, at: 2026-09-27}
      - {from: proposed, to: coherent, by: ACT-002, authority: "CP-002 (delegated; parent specified, check and trace pass)", change: CHG-048, at: 2026-09-27}
      - {from: coherent, to: specified, by: ACT-002, authority: "CP-002 (delegated; parent specified, check and trace pass)", change: CHG-048, at: 2026-09-27}
    provenance: {source: ROADMAP-ALPHA, created_by: ACT-002, authority: "CP-002 delegation; REV-041", inputs: [project/semantic/alpha-capabilities.yaml, project/assurance/plans/ROADMAP-ALPHA.md], created_at: 2026-09-27}
  - id: REQ-143
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "For a plan, the member shall see the twelve-month projection as things are and with the plan, side by side, including the interest on anything borrowed, and every place a plan appears shall say that it is a plan."
