version: 1
artifacts:
  - id: REQ-008
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-001, review: REV-002, decision: trace}
    statement: "scripts/trace shall verify that every ImplementationElement has at least one upward path, over typed justification relationships, to a Subject or to a governance root (a non-proposed Constraint whose sources cite CONSTITUTION.md, GOVERNANCE.md, framework/, or automation/). No artifact on the path may be proposed or unsettled, and every Requirement on it must be accepted or canonical. The kind of root reached shall be reported."
    relationships:
      - {type: derived_from, to: CON-004}
    history:
      - {from: null, to: proposed, by: ACT-002, authority: "bootstrap.yaml autonomy[requirement_derivation]", change: CHG-006, at: 2026-09-25}
