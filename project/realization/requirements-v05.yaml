version: 1
# v0.5.0-alpha Requirements (CAP-009), specified under CP-002 delegation (REV-044).
artifacts:
  - id: REQ-155
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "The export (REQ-117) shall be a versioned file that also carries the member's own plans, their marks on items they own, their goals, and their retirement assumptions, keeping only references to items and values the export contains (a set-aside for a value they don't own, or a contribution to an account they don't own, is left out). Nothing in it belongs to anyone else."
    acceptance_criteria:
      - {id: AC-1, criterion: "The file names its format and version."}
      - {id: AC-2, criterion: "It carries the member's own plans with their steps."}
      - {id: AC-3, criterion: "It carries the member's marks on items they own."}
      - {id: AC-4, criterion: "It carries the member's goals: the fund goal and set-aside rates."}
      - {id: AC-5, criterion: "It carries all of the member's retirement assumptions: birth year, retirement age, return, Social Security estimate, target, and contributions."}
      - {id: AC-6, criterion: "A set-aside for a value the member doesn't own, and a contribution to an account they don't own, are left out."}
      - {id: AC-7, criterion: "Marks, plan steps, and links that name an entry the member doesn't own (relinquished, deleted, or only shared with them) are left out, and every reference left in the file names an entry in it."}
      - {id: AC-8, criterion: "Nothing in it belongs to anyone else (interpretation): no item the member doesn't own, and none of another member's links, marks, plans, goals, retirement assumptions, or attachments, even where they name the member's items."}
    acceptance_criteria_added: {by: ACT-002, authority: "REV-069; REV-070", derived_in: WI-057, audit: VV-002, change: CHG-071, at: 2026-09-28, note: "the statement is unchanged; interpretations ratified by ACT-001 in REV-070"}
    relationships: [{type: derived_from, to: MEC-022}, {type: derived_from, to: PRI-001}, {type: derived_from, to: PRI-002}]
    history:
      - {from: null, to: proposed, by: ACT-002, authority: proposal_only, change: CHG-050, at: 2026-09-27}
      - {from: proposed, to: coherent, by: ACT-002, authority: "CP-002 (delegated; parent specified, check and trace pass)", change: CHG-050, at: 2026-09-27}
      - {from: coherent, to: specified, by: ACT-002, authority: "CP-002 (delegated; parent specified, check and trace pass)", change: CHG-050, at: 2026-09-27}
    provenance: {source: ROADMAP-ALPHA, created_by: ACT-002, authority: "CP-002 delegation; REV-044", inputs: [project/semantic/alpha-capabilities.yaml, project/semantic/v05-portable-record.yaml, project/assurance/plans/ROADMAP-ALPHA.md], created_at: 2026-09-27}
  - id: REQ-156
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "A member shall be able to bring an export into a household they belong to: every item, value, account, and debt in it becomes a new entry owned by them alone, with accounts' and debts' readings, their links between entries in the file, and their plans, marks, and goals and retirement assumptions referring to the new entries. Assumptions and goals the member has already set are kept; only unset ones are filled from the file. Owners, sharing, and history from the old household are not brought in, nor are shared plans; the member is told so. Each new entry's history begins with being brought in by the member."
    acceptance_criteria:
      - {id: AC-1, criterion: "A member can bring an export into the household they belong to, by checking it, seeing the preview, and confirming."}
      - {id: AC-2, criterion: "Every item, value, account, and debt in the file becomes a new entry (none keeps an id from the file), owned by the member alone, with no grantees."}
      - {id: AC-3, criterion: "Accounts' and debts' readings come in on the new entries, with the same dates and values."}
      - {id: AC-4, criterion: "Links between entries in the file join the corresponding new entries."}
      - {id: AC-5, criterion: "Plans (their steps), marks, goals (set-asides), retirement assumptions (contributions), and attachments name the new entries."}
      - {id: AC-6, criterion: "Goals and assumptions the member already set are kept; only unset ones are filled from the file."}
      - {id: AC-7, criterion: "Owners, sharing, and history from the old household are not brought in: each new entry's history has only its creation by the member and the readings they brought in."}
      - {id: AC-8, criterion: "Shared plans are not brought in."}
      - {id: AC-9, criterion: "The member is told that owners, sharing, history, and shared plans are not brought in (on the preview), and that only they own what came in (after confirming)."}
      - {id: AC-10, criterion: "Each new entry's history begins with its being brought in by the member."}
    acceptance_criteria_added: {by: ACT-002, authority: "REV-069; REV-070", derived_in: WI-057, audit: VV-002, change: CHG-071, at: 2026-09-28, note: "the statement is unchanged; interpretations ratified by ACT-001 in REV-070"}
    relationships: [{type: derived_from, to: MEC-022}, {type: derived_from, to: PRI-001}, {type: derived_from, to: PRI-002}]
    history:
      - {from: null, to: proposed, by: ACT-002, authority: proposal_only, change: CHG-050, at: 2026-09-27}
      - {from: proposed, to: coherent, by: ACT-002, authority: "CP-002 (delegated; parent specified, check and trace pass)", change: CHG-050, at: 2026-09-27}
      - {from: coherent, to: specified, by: ACT-002, authority: "CP-002 (delegated; parent specified, check and trace pass)", change: CHG-050, at: 2026-09-27}
