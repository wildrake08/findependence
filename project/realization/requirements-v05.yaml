  - id: REQ-158
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "Before anything is saved, the member shall see what would be brought in (how many items, values, accounts, debts, readings, links, plans, marks, and goals, with the names of what becomes theirs) and confirm it or cancel. Nothing is saved on cancel or if they leave the page."
    acceptance_criteria:
      - {id: AC-1, criterion: "Before anything is saved, the preview counts the items, values, accounts, debts, readings, links, plans, marks, and goals the file would bring in."}
      - {id: AC-2, criterion: "The preview names what becomes the member's: the items, values, accounts, debts, and plans, by name, shown as text."}
      - {id: AC-3, criterion: "Nothing is saved while the preview is shown."}
      - {id: AC-4, criterion: "In a browser, choosing 'Bring it in' on the preview brings the file in."}
      - {id: AC-5, criterion: "Choosing Cancel, or locking, saves nothing."}
      - {id: AC-6, criterion: "Leaving the preview for another page saves nothing, and its form sent afterwards brings nothing in."}
    acceptance_criteria_added: {by: ACT-002, authority: "REV-069; REV-070", derived_in: WI-057, audit: VV-002, change: CHG-071, at: 2026-09-28, note: "the statement is unchanged; interpretations ratified by ACT-001 in REV-070"}
