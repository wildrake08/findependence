  - id: REQ-159
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "The same file shall not be brought in twice by the same member by mistake: a second attempt is refused with the date it was brought in before. Bringing in one's record never changes anything anyone else owns or can see."
    acceptance_criteria:
      - {id: AC-1, criterion: "The same file (byte for byte) brought in a second time by the same member is refused, saying the date it was brought in before, and nothing changes."}
      - {id: AC-2, criterion: "Only that is refused: a different file, or the same file by another member, is not."}
      - {id: AC-3, criterion: "Bringing a record in changes nothing anyone else owns or can see: their visible items and the items they own are unchanged, and none of what came in is visible to them."}
    acceptance_criteria_added: {by: ACT-002, authority: "REV-069; REV-070", derived_in: WI-057, audit: VV-002, change: CHG-071, at: 2026-09-28, note: "the statement is unchanged; interpretations ratified by ACT-001 in REV-070"}
