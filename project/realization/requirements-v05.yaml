  - id: REQ-157
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "The file shall be treated as untrusted: at most 1 MB, valid JSON, a known format and version, and every field checked with the same rules as entering it by hand (amounts in cents within range, known frequencies and kinds, valid dates and months, names within length, references that resolve within the file). If any check fails, nothing is brought in, and the member is told what failed and where in the file. Nothing in the file can create new atoms or run."
    acceptance_criteria:
      - {id: AC-1, criterion: "A file of more than 1 MB (1,048,576 bytes) is refused, before it is read when the upload itself is over the limit; a file of exactly 1 MB is checked."}
      - {id: AC-2, criterion: "A file that isn't valid JSON is refused."}
      - {id: AC-3, criterion: "A file of an unknown format or version is refused."}
      - {id: AC-4, criterion: "Every field is checked: amounts in whole cents within range, known frequencies and kinds, valid dates and months, names within length, and references that resolve within the file; unknown fields are refused."}
      - {id: AC-5, criterion: "The checks are the same rules as entering by hand: a value the interface accepts when typed by hand is accepted in the file, and one it refuses is refused."}
      - {id: AC-6, criterion: "If any check fails, nothing is brought in, and the member is told what failed and where in the file."}
      - {id: AC-7, criterion: "Nothing in the file creates an atom or runs: unknown keys and values never become atoms, and names from the file are shown as text, never markup or script."}
    acceptance_criteria_added: {by: ACT-002, authority: "REV-069; REV-070", derived_in: WI-057, audit: VV-002, change: CHG-071, at: 2026-09-28, note: "the statement is unchanged; interpretations ratified by ACT-001 in REV-070"}
    relationships: [{type: derived_from, to: MEC-022}, {type: derived_from, to: PRI-001}, {type: derived_from, to: PRI-002}]
    history:
      - {from: null, to: proposed, by: ACT-002, authority: proposal_only, change: CHG-050, at: 2026-09-27}
      - {from: proposed, to: coherent, by: ACT-002, authority: "CP-002 (delegated; parent specified, check and trace pass)", change: CHG-050, at: 2026-09-27}
      - {from: coherent, to: specified, by: ACT-002, authority: "CP-002 (delegated; parent specified, check and trace pass)", change: CHG-050, at: 2026-09-27}
