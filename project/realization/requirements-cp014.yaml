  - id: REQ-163
    type: Requirement
    state: proposed
    statement: "An owner of an item shall be able to record a new amount or schedule for it from a date they choose, as an addition to its history that any owner can make without the others' agreement. Everything computed uses the amount in force on each date. The change is sealed to the item's current readers like a balance reading, and removed from anyone who loses access."
    relationships: [{type: derived_from, to: MEC-018}, {type: derived_from, to: PRI-002}]
    note: "CP-015 A (REV-047): stays proposed until the independent security review (DEF-026) has seen its design; its Mechanism is specified then"
    history:
      - {from: null, to: proposed, by: ACT-002, authority: proposal_only, change: CHG-052, at: 2026-09-27}
    provenance: {source: CP-015, created_by: ACT-002, authority: "REV-047 (CP-015 A after review)", inputs: [project/change/CP-015.yaml, project/change/CP-013.yaml], created_at: 2026-09-27}
  - id: REQ-164
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "The saved file (REQ-155) shall also carry which account the member has said each item goes through, where the member owns both the item and the account, and bringing the file in (REQ-156) shall restore them for the new entries. The file names its format version (3); files of earlier versions still come in, without attachments."
    acceptance_criteria:
      - {id: AC-1, criterion: "The saved file carries which account each item goes through, where the member owns both the item and the account, and leaves out attachments where they don't."}
      - {id: AC-2, criterion: "Bringing the file in restores those attachments between the new entries."}
      - {id: AC-3, criterion: "The file names its format version as 3."}
      - {id: AC-4, criterion: "Files of earlier versions (1 and 2) still come in, without attachments (a version 2 file naming attachments is refused)."}
    acceptance_criteria_added: {by: ACT-002, authority: "REV-069; REV-070", derived_in: WI-057, audit: VV-002, change: CHG-071, at: 2026-09-28, note: "the statement is unchanged; interpretations ratified by ACT-001 in REV-070"}
