  - id: REQ-162
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "A member shall be able to see, for each of the next twelve months, the money in and out of the items that count for them (those they have said go through one of the accounts the projection starts from, and those they own and haven't said go through any account; repeating items as their per-month amounts; dated one-off items in their month), the cash at the end of each month starting from the latest balances of the cash accounts they can see, and each debt they can see with its balance growing by a month of interest and falling by its minimum payment, until paid off. The page states these assumptions next to the results, including, for an account others also own, whose items may not be counted."
    acceptance_criteria:
      - {id: AC-1, criterion: "The member sees each of the next twelve months, starting with the month after this one."}
      - {id: AC-2, criterion: "Money in and out counts the items that count for them: those they said go through one of the cash accounts the projection starts from, and those they own and haven't said go through any account."}
      - {id: AC-3, criterion: "Repeating items count at their per-month amounts; a dated one-off counts in its own month only; an undated one-off counts in no month."}
      - {id: AC-4, criterion: "Cash at the end of each month starts from the latest balances of the cash accounts they can see."}
      - {id: AC-5, criterion: "Each debt they can see (their own or shared with them) grows each month by a month's interest and falls by its minimum payment."}
      - {id: AC-6, criterion: "Until paid off: the last payment is only what is owed, the balance reaches zero and stays there with no further interest, and the month it is paid off is shown."}
      - {id: AC-7, criterion: "The page states these assumptions next to the results, and each stated assumption matches what is counted."}
      - {id: AC-8, criterion: "For an account others also own, the page names them and says their items may not be counted."}
    acceptance_criteria_added: {by: ACT-002, authority: "REV-069; REV-070", derived_in: WI-057, audit: VV-002, change: CHG-071, at: 2026-09-28, note: "the statement is unchanged; interpretations ratified by ACT-001 in REV-070"}
