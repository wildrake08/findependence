  - id: REQ-198
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-001, authority: REV-113}
    realized_by: {element: IE-212, work_item: WI-085, evidence: TEST-RUN-028, change: CHG-124, previous_disposition: "outstanding: WI-085 builds it"}
    statement: "The hosted form shall not show or change a household whose records were changed other than through the service."
    acceptance_criteria:
      - {id: AC-1, criterion: "Each household's records (members and their display names, every item's owners, grantees, content, sealed keys, history and readings, requests and agreements, the request counter, personal records, and the household's change counter) carry a code under a key held outside the database (HOUSEHOLD_STATE_KEY), written at every change the service makes."}
      - {id: AC-2, criterion: "Every read checks the code; records that don't match it, have none, or carry another household's are refused with a page saying the records were changed outside the service, and the refusal is logged; nothing is saved."}
      - {id: AC-3, criterion: "A join checks the household's records before adding the member, so it never writes a code over records changed outside the service."}
      - {id: AC-4, criterion: "An operator can write a fresh code over a household's records only with a release command that takes the approved request's reference and is audited with it."}
      - {id: AC-5, criterion: "Each change the service commits advances the household's change counter, which is bound into the block and the code and recorded in an append-only file outside the database (HOUSEHOLD_LEDGER_PATH); a household read with a counter below the one recorded (an earlier copy put back) is refused. The counter is not shown to members: it would count other members' private changes (REQ-106)."}
    acceptance_criteria_changes:
      - {by: ACT-001, review: REV-114, change: CP-029, at: 2026-10-02, note: "AC-5 added (ASSESS-002 FND-209, WI-086): the change counter outside the database; AC-1 extended to the counter"}
    note: "ASSESS-002 FND-201 (DEF-077), stage 1: stops whoever can write only the database; the operator, who holds the key, and a restored whole earlier copy are not stopped (DESIGN-002, stage 2, REV-113 D3)."
    relationships: [{type: derived_from, to: CTX-001}, {type: derived_from, to: PRI-002}]
    history:
      - {from: null, to: proposed, by: ACT-002, authority: proposal_only, change: CHG-124, at: 2026-10-01}
      - {from: proposed, to: coherent, by: ACT-001, authority: REV-113, change: CHG-124, at: 2026-10-01}
      - {from: coherent, to: specified, by: ACT-001, authority: REV-113, change: CHG-124, at: 2026-10-01}
    provenance: {source: CP-028, created_by: ACT-002, authority: "REV-113", inputs: [project/change/CP-028.yaml, project/assurance/security-review/ASSESS-002-implementation-assessment.md], created_at: 2026-10-01}
