  - id: REQ-190
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-001, authority: REV-095}
    realized_by: {element: IE-210, work_item: WI-076, evidence: TEST-RUN-022, change: CHG-104, previous_disposition: "outstanding: WI-073 meets AC-1, AC-2, and AC-3's body limit (TEST-RUN-019); AC-3's 1 MB upload limit comes with bring-in in WI-075, which replaces this disposition with a satisfying ImplementationElement"}
    statement: "The hosted form shall bound what one person, account, or client can make it do: sign-in, recovery, and invitation attempts, request and upload sizes, and the work one request can cause."
    acceptance_criteria:
      - {id: AC-1, criterion: "More than 10 failed sign-in or recovery attempts for one account number from one client, 30 from one client, or 100 for one account number from all clients together, within 15 minutes, are refused for the rest of that time, with the same response for known and unknown account numbers; the 100 doesn't hold back a sign-in from a browser that has signed in to that account before (a signed device cookie, 90 days); the client is the connection's address, or, behind a reverse proxy the deployment lists as trusted, the forwarded address."}
      - {id: AC-2, criterion: "A member can have at most 5 open invitation codes."}
      - {id: AC-3, criterion: "Every request body has a stated size limit and a larger one is refused without being read in full; an uploaded file is at most 1 MB (REQ-157)."}
      - {id: AC-4, criterion: "A member owns at most 2,000 items, and a household holds at most 2,000 items per member; a change that would take the member, or the household, past that is refused with words that say nothing of what others hold, and nothing is saved."}
      - {id: AC-5, criterion: "More than 10 sign-ups from one client within 15 minutes are refused."}
      - {id: AC-6, criterion: "A member makes at most 300 changes in 15 minutes; past that a change is refused and nothing is saved."}
    acceptance_criteria_changes:
