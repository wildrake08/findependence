  - id: REQ-186
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-001, authority: REV-095}
    realized_by: {element: IE-208, work_item: WI-074, evidence: TEST-RUN-020, change: CHG-098, previous_disposition: "outstanding: WI-073 meets AC-1 for its only identifier-taking route (invitations) and AC-2 for its tables (TEST-RUN-019); AC-1 for items, readings, proposals, plans, and members, and AC-2 for their tables, need WI-074, which replaces this disposition with a satisfying ImplementationElement"}
    statement: "Every operation shall act within the signed-in member's own household, taken from server state; an identifier from another household shall be treated as not found, and the database shall refuse to store a row that joins two households."
    acceptance_criteria:
      - {id: AC-1, criterion: "For every route and context operation, a member of one household who sends the identifier of another household's item, reading, proposal, plan, or member gets not found and changes nothing."}
      - {id: AC-2, criterion: "A household's records, stored as one block encrypted with the household's identifier bound in, are refused when put in another household's row; memberships and invitations still refer to their household by constraint."}
    acceptance_criteria_changes:
      - {by: ACT-001, review: REV-114, change: CP-029, at: 2026-10-02, note: "AC-2 amended (WI-086, REQ-200): a household's records are one encrypted block bound to its identifier, which replaces the per-row constraints (the rows no longer exist); previously: inserting a row whose household differs from a row it refers to fails on a constraint"}
    note: "ARCH-003 14; DP-001 7."
    relationships: [{type: derived_from, to: CTX-001}, {type: derived_from, to: MEC-002}]
    history:
