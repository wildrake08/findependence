  - id: REQ-187
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-001, authority: REV-095}
    realized_by: {element: IE-208, work_item: WI-074, evidence: TEST-RUN-020, change: CHG-098, previous_disposition: "outstanding: the hosted form's domain storage is not yet built; WI-074 implements this Requirement and replaces this disposition with a satisfying ImplementationElement (corrected by CHG-096: the reason named WI-072)"}
    statement: "The hosted form shall store item content, readings, ledger details, each member's private records, and the access structure (owners, grantees, requests and agreements) only as ciphertext made by the application: the members' keys as DP-001 section 8.2 describes inside a household block encrypted under a key held outside the database (REQ-200)."
    statement_changes:
      - {by: ACT-001, review: REV-114, change: CP-029, at: 2026-10-02, previous_statement: "The hosted form shall store item content, readings, ledger details, and each member's private records only as ciphertext made by the application, under the keys DP-001 section 8.2 describes, keeping in plain columns only the structure its constraints need."}
    acceptance_criteria:
      - {id: AC-1, criterion: "After a scripted visit that adds items, values, accounts, debts, readings, plans, goals, links, marks, and attachments, a dump of every table contains none of the names, notes, amounts, rates, dates entered, or values typed, and no item kind."}
      - {id: AC-2, criterion: "Each item, reading, and ledger entry key is stored only sealed to the members who may read it (REQ-119, REQ-133, REQ-170), inside the household's encrypted block; a member's session can unseal no key sealed only to another member, and no private record of another member."}
      - {id: AC-3, criterion: "Oban jobs and PubSub messages carry identifiers only; a test finds no content in either."}
    acceptance_criteria_changes:
      - {by: ACT-001, review: REV-114, change: CP-029, at: 2026-10-02, note: "statement and AC-2 amended (WI-086, REQ-200): the structure too is now inside one encrypted block; AC-1 and AC-3 unchanged"}
    relationships: [{type: derived_from, to: MEC-014}, {type: derived_from, to: CTX-001}]
