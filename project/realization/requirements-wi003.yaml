version: 1
artifacts:
  - id: REQ-013
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-001, review: REV-003, decision: 1_authority_policy}
    statement: >
      For every artifact whose type has an entry in authority.yaml, I-012 shall require the following.
      (a) Every transition to canonical is by a human, unless canonicalize.ai is allow.
      (b) A non-human transition past creation is permitted only if the type's specify policy (accept,
      for a Requirement) gives ai either allow or a condition. Under a condition, every parent must be
      specified or canonical: for a Function its enables targets, for a Mechanism its realizes targets,
      for a Requirement its derived_from targets.
      (c) A Requirement whose accepted_by actor is non-human is held to (b).
    relationships:
      - {type: derived_from, to: CON-005}
      - {type: derived_from, to: CON-001}
    history:
      - {from: null, to: proposed, by: ACT-002, authority: "bootstrap.yaml autonomy[requirement_derivation]", change: CHG-008, at: 2026-09-25}
      - {from: proposed, to: coherent, by: ACT-001, authority: "REV-003 decision 1_authority_policy", change: CHG-008, at: 2026-09-25}
      - {from: coherent, to: specified, by: ACT-001, authority: "REV-003 decision 1_authority_policy", change: CHG-008, at: 2026-09-25}
    provenance: {source: WI-003, created_by: ACT-002, authority: "bootstrap.yaml autonomy[requirement_derivation]", inputs: [automation/policies/authority.yaml, project/governance/REV-003.yaml], created_at: 2026-09-25}
