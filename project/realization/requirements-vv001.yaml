  - id: REQ-174
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "With a target income as well, the member shall see the monthly difference between the target and their Social Security estimate, and how long the balance at retirement would last paying that difference each month while growing at the same return: in years and months and the age reached, or that some would remain at age 100, or that the Social Security estimate covers the target. No result is scored or labelled, and none is compared with a figure the member did not set, except the alternatives REQ-153 shows beside it."
    acceptance_criteria:
      - {id: AC-1, criterion: "Without a target income, none of this is shown; the page says a target is needed to compare with."}
      - {id: AC-2, criterion: "With a target, the page shows the monthly difference between the target and the Social Security estimate (none entered counts as none)."}
      - {id: AC-3, criterion: "How long the balance at retirement would last paying that difference each month while growing at the same return is worked out month by month and shown in years and months with the age reached."}
      - {id: AC-4, criterion: "When some would remain at age 100, the page says so instead."}
      - {id: AC-5, criterion: "When the Social Security estimate is at least the target, the page says it covers the target."}
      - {id: AC-6, criterion: "No result is scored or labelled (interpretation: no judgment word, glossary violation, or recommending phrase appears on the page in any of these states)."}
      - {id: AC-7, criterion: "No result is compared with a figure the member did not set, except REQ-153's alternatives: every amount and percentage on the page is one the member entered, a balance read from their accounts, one worked out from those, an alternative REQ-153 shows, or the stated rounding unit."}
    acceptance_criteria_added: {by: ACT-002, authority: "REV-069; REV-070", derived_in: WI-057, audit: VV-002, change: CHG-071, at: 2026-09-28, note: "the statement is unchanged; interpretations ratified by ACT-001 in REV-070"}
    relationships: [{type: derived_from, to: MEC-021}, {type: derived_from, to: PRI-001}, {type: derived_from, to: PRI-002}, {type: supersedes, to: REQ-152}]
