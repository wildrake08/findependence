  - id: REQ-132
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "A member who can read an account or debt (REQ-102) shall be able to read its latest reading; its owners shall be able to read all of its readings. Nobody else can read any reading."
    acceptance_criteria:
      - {id: AC-1, criterion: "A member who can read an account or debt (an owner or a grantee) can read its latest reading."}
      - {id: AC-2, criterion: "Its owners can read all of its readings; a reader who is not an owner cannot read the earlier ones."}
      - {id: AC-3, criterion: "Nobody else can read any reading, through the core or from the stored file."}
    acceptance_criteria_added: {by: ACT-002, authority: "REV-069; REV-070", derived_in: WI-057, audit: VV-002, change: CHG-071, at: 2026-09-28, note: "the statement is unchanged; interpretations ratified by ACT-001 in REV-070"}
