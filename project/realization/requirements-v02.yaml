  - id: REQ-134
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "Accounts and debts shall not count as money in or out in the value distribution (REQ-128), and shall not be linkable to values."
    acceptance_criteria:
      - {id: AC-1, criterion: "Accounts and debts, whether the member owns them or they are shared with them, and whatever readings they have, are not counted in any bucket of the distribution (count, per-month, or one-off)."}
      - {id: AC-2, criterion: "No account or debt can be linked to a value."}
    acceptance_criteria_added: {by: ACT-002, authority: "REV-069; REV-070", derived_in: WI-057, audit: VV-002, change: CHG-071, at: 2026-09-28, note: "the statement is unchanged; interpretations ratified by ACT-001 in REV-070"}
