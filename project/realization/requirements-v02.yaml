  - id: REQ-136
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "When a member adds an item, they may give one date on which it happens. A recurring item then happens on that date and on its schedule from it; a one-off happens on that date; an irregular item has no dates. The date is stored with the item's protected attributes. Items without a date keep working as before."
    relationships: [{type: derived_from, to: MEC-018}, {type: derived_from, to: PRI-002}]
    history:
