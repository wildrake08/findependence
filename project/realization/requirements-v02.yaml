# v0.2.0-alpha Requirements (CAP-010, CAP-011), specified under CP-002 delegation; CP-013 A (REV-039).
artifacts:
  - id: REQ-130
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "An account (checking, savings, or other) or a debt (card, HELOC, loan, or other) shall be an item of its own kind, created and owned by a member, private by default, and subject to REQ-101..REQ-110 and REQ-125 like any other item. Its name and kind are fixed when it is created."
    relationships: [{type: derived_from, to: MEC-017}, {type: derived_from, to: PRI-002}]
