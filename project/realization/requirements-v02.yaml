  - id: REQ-138
    type: Requirement
    state: superseded
    superseded_by: REQ-161
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "Home shall show what is coming up in the next fourteen days, up to the first four days that have something on them and how many more such days follow, with a way to the full view: the dated items the member owns (alone or jointly; items others only share with them are not their obligations), in date order, and, when the member can see a checking account with a reading, the running balance of their visible checking accounts after each day. The balance starts from the sum of those accounts' latest readings and applies every dated occurrence after the most recent of those readings' dates, and the page says which accounts and which date it starts from."
    relationships: [{type: derived_from, to: MEC-018}, {type: derived_from, to: PRI-002}]
    history:
