  - id: REQ-133
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "Each reading shall be encrypted with its own key, sealed only to the members REQ-132 allows, at the time it is written or when they gain that access. A member who loses access shall have their keys to it removed and shall never be given a key to a reading written afterwards; a reader who appears in the file without having been added by the app shall never be given a key (WI-020)."
    acceptance_criteria:
      - {id: AC-1, criterion: "Each reading is encrypted with its own key."}
      - {id: AC-2, criterion: "When written, a reading's key is sealed only to the members REQ-132 allows: the latest to every owner and grantee, earlier ones to owners only."}
      - {id: AC-3, criterion: "A member who gains access is sealed the keys they may now use: a new grantee the latest, a new owner every earlier reading."}
      - {id: AC-4, criterion: "A member who loses access has their keys removed: on revocation, relinquishing, removal from the owners by agreement, leaving the household, and, for a grantee, a reading ceasing to be the latest."}
      - {id: AC-5, criterion: "A member who lost access is never given a key to a reading written afterwards."}
      - {id: AC-6, criterion: "A reader written into the file without the app adding them is never given a reading key."}
    acceptance_criteria_added: {by: ACT-002, authority: "REV-069; REV-070", derived_in: WI-057, audit: VV-002, change: CHG-071, at: 2026-09-28, note: "the statement is unchanged; interpretations ratified by ACT-001 in REV-070"}
