  - id: REQ-131
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "Any owner of an account or debt, and nobody else, shall be able to add a reading without anyone else's consent: for an account, its balance; for a debt, the amount owed, the interest rate, and the minimum payment; each with the date it is as of. Readings are append-only, and each is recorded in the item's history."
    acceptance_criteria:
      - {id: AC-1, criterion: "Any owner of an account or debt, a joint owner included, adds a reading without anyone else's consent: it applies at once and creates no proposal."}
      - {id: AC-2, criterion: "Nobody else can add one: a member it is shared with is refused as not an owner, and anyone who cannot see it is refused as if it did not exist, in the core and at the interface."}
      - {id: AC-3, criterion: "An account's reading is its balance; a debt's is the amount owed (not negative), the interest rate, and the minimum payment; anything else is refused."}
      - {id: AC-4, criterion: "Every reading has the date it is as of; a reading with no date or an invalid one is refused."}
      - {id: AC-5, criterion: "Readings are append-only: after any operation, an item's earlier readings are unchanged and numbered without gaps."}
      - {id: AC-6, criterion: "Each reading is recorded in the item's history."}
    acceptance_criteria_added: {by: ACT-002, authority: "REV-069; REV-070", derived_in: WI-057, audit: VV-002, change: CHG-071, at: 2026-09-28, note: "the statement is unchanged; interpretations ratified by ACT-001 in REV-070"}
