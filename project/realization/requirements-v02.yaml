  - id: REQ-136
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "When a member adds an item, they may give one date on which it happens. A recurring item then happens on that date and on its schedule from it; a one-off happens on that date; an irregular item has no dates. The date is stored with the item's protected attributes. Items without a date keep working as before."
    acceptance_criteria:
      - {id: AC-1, criterion: "Adding an item accepts one date on which it happens, stored on the item (attrs.on)."}
      - {id: AC-2, criterion: "The add-item form offers exactly one date field, and it is optional: an item can be added without a date."}
      - {id: AC-3, criterion: "A recurring item with a date happens on that date and on its schedule from it, never before it."}
      - {id: AC-4, criterion: "A one-off with a date happens on that date only."}
      - {id: AC-5, criterion: "An irregular item has no dates: none is stored even if one is entered, and it has no occurrences."}
      - {id: AC-6, criterion: "The date is kept in the item's protected (encrypted) attributes and does not appear in plaintext in the stored file."}
      - {id: AC-7, criterion: "An item without a date is still added, listed, and counted at its per-month amount in totals and the twelve-month projection; it simply has no dates."}
    acceptance_criteria_added: {by: ACT-002, authority: "REV-069; REV-070", derived_in: WI-057, audit: VV-002, change: CHG-071, at: 2026-09-28, note: "the statement is unchanged; interpretations ratified by ACT-001 in REV-070"}
    relationships: [{type: derived_from, to: MEC-018}, {type: derived_from, to: PRI-002}]
    history:
