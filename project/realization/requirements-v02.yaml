  - id: REQ-140
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "For money-out items the member owns that happen less often than monthly (every two or more months, twice a year, yearly, or irregular), the member shall see the monthly amount that setting aside would take to cover them, and which items it covers."
    acceptance_criteria:
      - {id: AC-1, criterion: "An owned money-out item every two months is covered, at amount / 2 a month."}
      - {id: AC-2, criterion: "An owned money-out item every three months is covered, at amount / 3 a month."}
      - {id: AC-3, criterion: "An owned money-out item twice a year is covered, at amount / 6 a month."}
      - {id: AC-4, criterion: "An owned yearly money-out item is covered, at amount / 12 a month."}
      - {id: AC-5, criterion: "An owned irregular money-out item (a yearly total) is covered, at total / 12 a month."}
      - {id: AC-6, criterion: "Money out that happens monthly or more often (weekly, every two weeks, monthly) and one-off money out are not covered."}
      - {id: AC-7, criterion: "Money in, however often, is not covered."}
      - {id: AC-8, criterion: "Only items the member owns are covered; an item others only share with them is not."}
      - {id: AC-9, criterion: "The member sees the total monthly amount, equal to the sum of the covered items' monthly amounts."}
      - {id: AC-10, criterion: "The member sees which items the amount covers, each by name with its own monthly amount."}
    acceptance_criteria_added: {by: ACT-002, authority: "REV-069; REV-070", derived_in: WI-057, audit: VV-002, change: CHG-071, at: 2026-09-28, note: "the statement is unchanged; interpretations ratified by ACT-001 in REV-070"}
