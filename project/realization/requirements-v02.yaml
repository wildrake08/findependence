  - id: REQ-137
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "An item's dates shall be computed from its date and interval: every N weeks, every 7N days; every N months or years, on the same day of the month, or on the month's last day when the month is shorter."
    acceptance_criteria:
      - {id: AC-1, criterion: "Every N weeks: the dates are the item's date plus 7N, 14N, ... days (N = 1, 2, 3 tested)."}
      - {id: AC-2, criterion: "Every N months: the same day of the month every N months (N = 1, 2, 3, 6 tested)."}
      - {id: AC-3, criterion: "Every N years: the same day of the month every N years (N = 1, 2 tested)."}
      - {id: AC-4, criterion: "When the month is shorter than the item's day, the date is that month's last day, and later dates return to the item's own day."}
    acceptance_criteria_added: {by: ACT-002, authority: "REV-069; REV-070", derived_in: WI-057, audit: VV-002, change: CHG-071, at: 2026-09-28, note: "the statement is unchanged; interpretations ratified by ACT-001 in REV-070"}
