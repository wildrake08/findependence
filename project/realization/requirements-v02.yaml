  - id: REQ-133
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "Each reading shall be encrypted with its own key, sealed only to the members REQ-132 allows, at the time it is written or when they gain that access. A member who loses access shall have their keys to it removed and shall never be given a key to a reading written afterwards; a reader who appears in the file without having been added by the app shall never be given a key (WI-020)."
    relationships: [{type: derived_from, to: MEC-017}, {type: derived_from, to: PRI-002}]
