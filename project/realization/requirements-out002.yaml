      - {from: proposed, to: coherent, by: ACT-001, authority: "REV-032 (CP-012)", change: CHG-043, at: 2026-09-27}
      - {from: coherent, to: specified, by: ACT-001, authority: "REV-032 (CP-012)", change: CHG-043, at: 2026-09-27}
    provenance: {source: CP-012, created_by: ACT-002, authority: "REV-032", inputs: [project/change/CP-012.yaml], created_at: 2026-09-27}
