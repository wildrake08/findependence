      - {from: proposed, to: coherent, by: ACT-001, authority: "REV-020 (CP-007 option B)", change: CHG-032, at: 2026-09-26}
      - {from: coherent, to: specified, by: ACT-001, authority: "REV-020 (CP-007 option B)", change: CHG-032, at: 2026-09-26}
      - {from: specified, to: superseded, by: ACT-001, authority: "REV-032 (CP-012)", change: CHG-043, at: 2026-09-27}
    provenance: {source: CP-007, created_by: ACT-002, authority: "REV-020", inputs: [project/change/CP-007.yaml], created_at: 2026-09-26}
