    statement: "A value shall be an item of kind value, created and owned by a member and subject to REQ-101..REQ-110 like any other item. The System shall provide no predefined values."
    acceptance_criteria:
      - {id: AC-1, criterion: "A value is an item of kind value, in the member's own words, created by a member and owned by them alone."}
      - {id: AC-2, criterion: "Only a member can create a value."}
      - {id: AC-3, criterion: "Values follow the item rules REQ-101..REQ-110 (owner set, grants, owner changes, history, visibility, aggregates, deletion, export, departure)."}
      - {id: AC-4, criterion: "The system provides no values: a new household, and a newly created vault, contain no items at all, so no values, for any member."}
    acceptance_criteria_added: {by: ACT-002, authority: "REV-069; REV-070", derived_in: WI-057, audit: VV-002, change: CHG-071, at: 2026-09-28, note: "the statement is unchanged; interpretations ratified by ACT-001 in REV-070"}
