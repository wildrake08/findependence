  - id: REQ-114
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    history:
      - {from: null, to: proposed, by: ACT-002, authority: proposal_only, change: CHG-012, at: 2026-09-26}
      - {from: proposed, to: coherent, by: ACT-002, authority: "CP-002 (delegated; parent specified, check and trace pass)", change: CHG-013, at: 2026-09-26}
      - {from: coherent, to: specified, by: ACT-002, authority: "CP-002 (delegated; parent specified, check and trace pass)", change: CHG-013, at: 2026-09-26}
    statement: "Losing visibility of an item or value (revocation, relinquishment, deletion, departure) shall silently remove it from the member's distribution, and the member's link records shall not reveal anything about the invisible item."
    acceptance_criteria:
      - {id: AC-1, criterion: "Revocation: when a grant on an item or on a value is revoked, the item leaves the member's distribution, and items linked to a lost value count as unlinked."}
      - {id: AC-2, criterion: "Relinquishment: when the member relinquishes a jointly owned item or a shared value, it leaves their distribution."}
      - {id: AC-3, criterion: "Deletion: when the owner deletes an item or a value the member could see, it leaves the member's distribution."}
      - {id: AC-4, criterion: "Departure: a member who leaves has an empty distribution and no links."}
      - {id: AC-5, criterion: "Silently (interpretation): after any of the four, everything the core returns to the member (distribution, links, export, visible items, pending requests, deletion records, and the answers to link and unlink) is exactly what it would return had they never had that item or link; and after another member revokes or deletes, the member's pages (household pages, their own item and value pages, the lost item's page) are identical, apart from form tokens, to before it was shared."}
      - {id: AC-6, criterion: "Link records reveal nothing (interpretation): no link to an item or value the member can no longer see appears in, or changes, anything the member is shown or given (their link list, the distribution, the export, a value's page, or how link and unlink answer)."}
    acceptance_criteria_added: {by: ACT-002, authority: "REV-069; REV-070", derived_in: WI-057, audit: VV-002, change: CHG-071, at: 2026-09-28, note: "the statement is unchanged; interpretations ratified by ACT-001 in REV-070"}
    relationships: [{type: derived_from, to: MEC-009}, {type: derived_from, to: MEC-010}, {type: derived_from, to: PRI-002}]
    provenance: {source: OBA-002, created_by: ACT-002, authority: proposal_only, inputs: [project/semantic/outcomes.yaml, project/semantic/principles.yaml, project/assurance/analysis/OBA-002-alignment.md], created_at: 2026-09-26}
  - id: REQ-126
    type: Requirement
    state: superseded
    superseded_by: REQ-128
    accepted_by: {actor: ACT-001, review: REV-020, decision: cp007}
    statement: "The value distribution for a member shall be computed only over items visible to that member and that member's own links. For each of the member's visible values, and for an explicit unlinked remainder, it shall report the number of items counted; the per-month sums of money in and of money out over recurring items, where each item's amount is first converted to a per-month amount (weekly x 52/12, every two weeks x 26/12, monthly x 1, yearly / 12) and rounded to the smallest unit; and, separately, the sums of money in and of money out over one-off items. An item with no recorded frequency counts as one-off. The distribution shall contain no score, rank, threshold, or evaluative label."
    relationships: [{type: derived_from, to: MEC-010}, {type: derived_from, to: PRI-001}, {type: derived_from, to: PRI-002}, {type: supersedes, to: REQ-113}]
