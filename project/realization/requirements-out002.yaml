version: 1
# Candidate Requirements, sentinel 2 first slice (CAP-003 + CAP-004). Proposed; they become acceptable under CP-002 once their Capability is specified.
artifacts:
  - id: REQ-111
    type: Requirement
    state: proposed
    statement: "A value shall be an item of kind value, created and owned by a member and subject to REQ-101..REQ-110 like any other item. The System shall provide no predefined values."
    relationships: [{type: derived_from, to: MEC-008}, {type: derived_from, to: PRI-001}]
    provenance: {source: OBA-002, created_by: ACT-002, authority: proposal_only, inputs: [project/semantic/outcomes.yaml, project/semantic/principles.yaml, project/assurance/analysis/OBA-002-alignment.md], created_at: 2026-09-26}
  - id: REQ-112
    type: Requirement
    state: proposed
    statement: "A member shall be able to link, and unlink, any item visible to them to any value visible to them. Links shall belong to that member, and no other member shall ever be able to read them."
    relationships: [{type: derived_from, to: MEC-009}, {type: derived_from, to: PRI-002}]
    provenance: {source: OBA-002, created_by: ACT-002, authority: proposal_only, inputs: [project/semantic/outcomes.yaml, project/semantic/principles.yaml, project/assurance/analysis/OBA-002-alignment.md], created_at: 2026-09-26}
  - id: REQ-113
    type: Requirement
    state: proposed
    statement: "The value distribution for a member shall be computed only over items visible to that member and that member's own links. It shall report per-value sums and counts, plus an explicit unlinked remainder, and shall contain no score, rank, threshold, or evaluative label."
    relationships: [{type: derived_from, to: MEC-010}, {type: derived_from, to: PRI-001}, {type: derived_from, to: PRI-002}]
    provenance: {source: OBA-002, created_by: ACT-002, authority: proposal_only, inputs: [project/semantic/outcomes.yaml, project/semantic/principles.yaml, project/assurance/analysis/OBA-002-alignment.md], created_at: 2026-09-26}
  - id: REQ-114
    type: Requirement
    state: proposed
    statement: "Losing visibility of an item or value (revocation, relinquishment, deletion, departure) shall silently remove it from the member's distribution, and the member's link records shall not reveal anything about the invisible item."
    relationships: [{type: derived_from, to: MEC-009}, {type: derived_from, to: MEC-010}, {type: derived_from, to: PRI-002}]
    provenance: {source: OBA-002, created_by: ACT-002, authority: proposal_only, inputs: [project/semantic/outcomes.yaml, project/semantic/principles.yaml, project/assurance/analysis/OBA-002-alignment.md], created_at: 2026-09-26}
