    statement: "Losing visibility of an item or value (revocation, relinquishment, deletion, departure) shall silently remove it from the member's distribution, and the member's link records shall not reveal anything about the invisible item."
    relationships: [{type: derived_from, to: MEC-009}, {type: derived_from, to: MEC-010}, {type: derived_from, to: PRI-002}]
    provenance: {source: OBA-002, created_by: ACT-002, authority: proposal_only, inputs: [project/semantic/outcomes.yaml, project/semantic/principles.yaml, project/assurance/analysis/OBA-002-alignment.md], created_at: 2026-09-26}
  - id: REQ-126
    type: Requirement
    state: superseded
    superseded_by: REQ-128
    accepted_by: {actor: ACT-001, review: REV-020, decision: cp007}
    statement: "The value distribution for a member shall be computed only over items visible to that member and that member's own links. For each of the member's visible values, and for an explicit unlinked remainder, it shall report the number of items counted; the per-month sums of money in and of money out over recurring items, where each item's amount is first converted to a per-month amount (weekly x 52/12, every two weeks x 26/12, monthly x 1, yearly / 12) and rounded to the smallest unit; and, separately, the sums of money in and of money out over one-off items. An item with no recorded frequency counts as one-off. The distribution shall contain no score, rank, threshold, or evaluative label."
    relationships: [{type: derived_from, to: MEC-010}, {type: derived_from, to: PRI-001}, {type: derived_from, to: PRI-002}, {type: supersedes, to: REQ-113}]
    history:
