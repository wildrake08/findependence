  - id: REQ-123
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "The interface shall listen only on 127.0.0.1. It shall reject requests whose Host header is not the loopback address and port, require a valid CSRF token on every state-changing request, and discard a session's unlocked keys on logout or after 15 minutes idle."
    acceptance_criteria:
      - {id: AC-1, criterion: "The server binds 127.0.0.1 only."}
      - {id: AC-2, criterion: "A request, GET or POST, whose Host is not the loopback address with the server's port is refused (421) before anything is processed; a POST so refused creates no session."}
      - {id: AC-3, criterion: "Every state-changing request needs a valid CSRF token: each of the 35 POST routes the router declares, sent from an unlocked session with a one-time form token but with the CSRF token missing, from another session, or altered, is refused (403, 'That wasn't saved'), the file is unchanged, and the session stays as it was. Requests other than POST change nothing."}
      - {id: AC-4, criterion: "Logging out (Lock) discards the session's unlocked keys."}
      - {id: AC-5, criterion: "The idle limit is 15 minutes: a session idle for 15 minutes still holds its keys; once idle for longer, its keys are discarded without any request, leaving a marker with only its time, within the sweep interval (5 seconds) of the server as started."}
    acceptance_criteria_added: {by: ACT-002, authority: "REV-069; REV-070", derived_in: WI-057, audit: VV-002, change: CHG-071, at: 2026-09-28, note: "the statement is unchanged; interpretations ratified by ACT-001 in REV-070"}
    relationships: [{type: derived_from, to: MEC-015}, {type: derived_from, to: CTX-001}, {type: derived_from, to: PRI-002}]
    history:
      - {from: null, to: proposed, by: ACT-002, authority: proposal_only, change: CHG-017, at: 2026-09-26}
      - {from: proposed, to: coherent, by: ACT-002, authority: "CP-002 (delegated; parents specified, check and trace pass)", change: CHG-017, at: 2026-09-26}
      - {from: coherent, to: specified, by: ACT-002, authority: "CP-002 (delegated; parents specified, check and trace pass)", change: CHG-017, at: 2026-09-26}
    provenance: {source: "CP-006 option B (REV-007) decomposition", created_by: ACT-002, authority: "CP-002 delegation", inputs: [project/change/CP-006.yaml, project/semantic/CTX-001.yaml, project/semantic/principles.yaml], created_at: 2026-09-26}
  - id: REQ-124
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "The system shall make outbound network connections only to destinations declared in its deployment's egress allowlist, and the interface shall load no remote resources."
    acceptance_criteria:
      - {id: AC-1, criterion: "During a member's whole visit (unlock or sign-in and a failed attempt, every kind of page, changes of each main kind, export, bring-in, lock or sign-out, and a second member's visit), no process in the running system calls a TCP, UDP, SCTP, or TLS connect or a host-name lookup except to a destination on the deployment's declared egress allowlist, and each such call goes through an application-owned adapter with a timeout and a response-size limit (ARCH-001 6.4, 9.14). For the local-first form the allowlist is empty. A change to a deployment's egress allowlist needs a recorded change approved by ACT-001. Developer-only tooling never started by the running system (for example the Mix task phx.gen.release, DEF-054) is excluded and listed by name. A test starts the system, exercises every route kind, and fails on a connect or lookup to any destination not on the list, and on a planted call."}
      - {id: AC-2, criterion: "For the local-first form, unchanged: Interpretation of 'load no remote resources': every kind of page the interface serves (31 responses, including error, refusal, confirmation, preview, and export pages) carries a Content-Security-Policy whose default-src is 'none' and whose every source is 'none', 'self', or 'unsafe-inline'; and no page refers to a remote address (absolute or protocol-relative URL, CSS url() or @import). For the hosted form, every page carries a Content-Security-Policy whose sources are only 'self' and 'none' (script-src and connect-src 'self' for LiveView; no 'unsafe-eval'; 'unsafe-inline' only for styles if Petal requires it, with the reason recorded)."}
    acceptance_criteria_added: {by: ACT-002, authority: "REV-069; REV-070", derived_in: WI-057, audit: VV-002, change: CHG-071, at: 2026-09-28, note: "the statement is unchanged; interpretations ratified by ACT-001 in REV-070"}
    restatements:
      - {by: ACT-001, review: REV-079, enacted_by: WI-064, change: CHG-083, at: 2026-09-29, note: "CP-019's drafted wording, amended so a change to an egress allowlist needs ACT-001's recorded approval; enacted after WI-062 closed, as REV-079 set", previous_statement: "The interface shall make no outbound network connections and shall load no remote resources.", previous_ac_1: "Interpretation of 'no outbound network connections': during a member's whole visit through the interface (unlock and a failed unlock, every kind of page, changes of each main kind, export, bring-in, lock, and a second member's visit), no process in the running system calls a TCP, UDP, SCTP, or TLS connect or a host-name lookup; and neither the app nor its dependencies contain an HTTP client or connect call.", previous_ac_2: "Interpretation of 'load no remote resources': every kind of page the interface serves (31 responses, including error, refusal, confirmation, preview, and export pages) carries a Content-Security-Policy whose default-src is 'none' and whose every source is 'none', 'self', or 'unsafe-inline'; and no page refers to a remote address (absolute or protocol-relative URL, CSS url() or @import)."}
    relationships: [{type: derived_from, to: MEC-015}, {type: derived_from, to: CTX-001}]
    history:
      - {from: null, to: proposed, by: ACT-002, authority: proposal_only, change: CHG-017, at: 2026-09-26}
      - {from: proposed, to: coherent, by: ACT-002, authority: "CP-002 (delegated; parents specified, check and trace pass)", change: CHG-017, at: 2026-09-26}
      - {from: coherent, to: specified, by: ACT-002, authority: "CP-002 (delegated; parents specified, check and trace pass)", change: CHG-017, at: 2026-09-26}
