  - id: REQ-122
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "No item attribute, value label, link, ledger entry detail, or deletion record shall appear in plaintext in the stored file."
    acceptance_criteria:
      - {id: AC-1, criterion: "No item attribute appears in the stored file in plaintext: notes, amounts, units, dates, frequencies, kinds, account and debt types, and the names of accounts, debts, and shared plans."}
      - {id: AC-2, criterion: "No value label appears in the stored file in plaintext."}
      - {id: AC-3, criterion: "No link (its item and value together) appears in the stored file in plaintext."}
      - {id: AC-4, criterion: "No ledger entry detail appears in the stored file in plaintext, for every kind of entry (created, granted, grant revoked, owners changed, owner relinquished, grantee departed, reading added)."}
      - {id: AC-5, criterion: "No deletion record appears in the stored file in plaintext."}
    acceptance_criteria_added: {by: ACT-002, authority: "REV-069; REV-070", derived_in: WI-057, audit: VV-002, change: CHG-071, at: 2026-09-28, note: "the statement is unchanged; interpretations ratified by ACT-001 in REV-070"}
