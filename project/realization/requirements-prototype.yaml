version: 1
# Prototype Requirements (CP-006 option B). Accepted under CP-002 delegation.
artifacts:
  - id: REQ-118
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "Each member's private key material shall be stored only encrypted under a key derived from that member's passphrase with PBKDF2-HMAC-SHA256, at least 600,000 iterations, and a random 16-byte salt. A wrong passphrase shall fail authentication and reveal nothing."
    acceptance_criteria:
      - {id: AC-1, criterion: "No member's private key or personal key appears anywhere in the bytes of the stored file."}
      - {id: AC-2, criterion: "Each member's private key material is stored only inside their secret box, which opens under PBKDF2-HMAC-SHA256 of their passphrase with their salt and the vault's iteration count, and under no other derivation; the derivation matches the RFC 7914 PBKDF2-HMAC-SHA256 known answers."}
      - {id: AC-3, criterion: "A vault made for use (setup, or create without the test-only flag) uses at least 600,000 iterations, and deriving or creating with fewer is refused unless the explicit test-only flag is set."}
      - {id: AC-4, criterion: "Each member's salt is 16 random bytes, different from every other member's and every other vault's."}
      - {id: AC-5, criterion: "A wrong passphrase fails authentication: nothing is unlocked and no session is created (401 at the interface)."}
      - {id: AC-6, criterion: "Interpretation of 'reveal nothing': every failed unlock (a wrong, empty, near-miss, or another member's passphrase, or a name that is not a member) gets the identical response (status, headers, cookie names, and page, apart from the random per-page tokens) and the identical log line, and the core returns the same single error for all of them."}
    acceptance_criteria_added: {by: ACT-002, authority: "REV-069; REV-070", derived_in: WI-057, audit: VV-002, change: CHG-071, at: 2026-09-28, note: "the statement is unchanged; interpretations ratified by ACT-001 in REV-070"}
    relationships: [{type: derived_from, to: MEC-013}, {type: derived_from, to: PRI-002}, {type: derived_from, to: CTX-001}]
    history:
      - {from: null, to: proposed, by: ACT-002, authority: proposal_only, change: CHG-017, at: 2026-09-26}
      - {from: proposed, to: coherent, by: ACT-002, authority: "CP-002 (delegated; parents specified, check and trace pass)", change: CHG-017, at: 2026-09-26}
      - {from: coherent, to: specified, by: ACT-002, authority: "CP-002 (delegated; parents specified, check and trace pass)", change: CHG-017, at: 2026-09-26}
    provenance: {source: "CP-006 option B (REV-007) decomposition", created_by: ACT-002, authority: "CP-002 delegation", inputs: [project/change/CP-006.yaml, project/semantic/CTX-001.yaml, project/semantic/principles.yaml], created_at: 2026-09-26}
  - id: REQ-119
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "Every item's content shall be stored only encrypted under a per-item key, and that key shall be stored only sealed to the members who may currently read the item: its owners, its grantees, and, once every current owner has consented under REQ-115, prospective joiners. No other member shall be able to decrypt it from the stored file with their own secrets."
    acceptance_criteria:
      - {id: AC-1, criterion: "Item content (every attribute) is stored only encrypted: no attribute value appears in the bytes of the stored file."}
      - {id: AC-2, criterion: "Each item has its own key, and no item's key opens another item's content."}
      - {id: AC-3, criterion: "The item key is sealed to exactly the item's current owners and grantees: a grant adds a sealed key; revoking, relinquishing, being removed from the owners by agreement, or leaving the household removes it."}
      - {id: AC-4, criterion: "A prospective joiner of a value gets the item key once every current owner has consented, not before, and loses it if the proposal is withdrawn."}
      - {id: AC-5, criterion: "No other member can open the item key or content from the stored file with their own secrets, including one written into the file's reader lists by editing it."}
    acceptance_criteria_added: {by: ACT-002, authority: "REV-069; REV-070", derived_in: WI-057, audit: VV-002, change: CHG-071, at: 2026-09-28, note: "the statement is unchanged; interpretations ratified by ACT-001 in REV-070"}
    relationships: [{type: derived_from, to: MEC-014}, {type: derived_from, to: PRI-002}]
    history:
      - {from: null, to: proposed, by: ACT-002, authority: proposal_only, change: CHG-017, at: 2026-09-26}
      - {from: proposed, to: coherent, by: ACT-002, authority: "CP-002 (delegated; parents specified, check and trace pass)", change: CHG-017, at: 2026-09-26}
      - {from: coherent, to: specified, by: ACT-002, authority: "CP-002 (delegated; parents specified, check and trace pass)", change: CHG-017, at: 2026-09-26}
    provenance: {source: "CP-006 option B (REV-007) decomposition", created_by: ACT-002, authority: "CP-002 delegation", inputs: [project/change/CP-006.yaml, project/semantic/CTX-001.yaml, project/semantic/principles.yaml], created_at: 2026-09-26}
  - id: REQ-120
    type: Requirement
    state: superseded
    superseded_by: REQ-170
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "Every ledger entry shall be stored encrypted and sealed only to the item's owners at the time of appending. Existing entries shall be re-sealed for each member who becomes an owner, including a prospective joiner once every current owner has consented, so that every current owner can read the whole ledger (REQ-105) and non-owners cannot."
    relationships: [{type: derived_from, to: MEC-014}, {type: derived_from, to: PRI-002}]
