  - id: REQ-121
    type: Requirement
    state: specified
    accepted_by: {actor: ACT-002, authority: CP-002, condition: parent_specified_and_check_trace_pass}
    statement: "Each member's links and deletion records shall be stored encrypted under a key that only that member can unlock."
    acceptance_criteria:
      - {id: AC-1, criterion: "A member's links do not appear in the stored file in plaintext."}
      - {id: AC-2, criterion: "A member's deletion records do not appear in the stored file in plaintext."}
      - {id: AC-3, criterion: "Links and deletion records are encrypted under that member's personal key, which is stored only inside their passphrase-protected secret; no other member's secrets open the record."}
    acceptance_criteria_added: {by: ACT-002, authority: "REV-069; REV-070", derived_in: WI-057, audit: VV-002, change: CHG-071, at: 2026-09-28, note: "the statement is unchanged; interpretations ratified by ACT-001 in REV-070"}
