  - id: MEC-017
    type: Mechanism
    name: balances_as_readings
    state: specified
    statement: "Accounts and debts are owned items of their own kinds, reusing the item model (MEC-004, MEC-002, MEC-008 pattern). What changes over time is kept as append-only readings attached to the item; each reading has its own key, sealed to the latest reading's readers or, for earlier readings, the owners, and never to anyone who lost access before it was written (CP-013 A)."
