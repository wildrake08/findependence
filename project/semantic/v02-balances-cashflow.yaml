    type: Mechanism
    name: anchored_schedules
    state: specified
    statement: "An item may carry one date on which it happens; its later dates are computed from that date and its interval, so nothing needs editing as time passes. The running balance starts from the sum of the latest readings of the member's visible checking accounts and applies each dated occurrence after the most recent of those readings' dates."
