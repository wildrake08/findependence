version: 1
# Foundational normative principles. Ratified by ACT-001 (REV-001), canonicalized by ACT-001 (REV-002, GATE-002).
artifacts:
  - id: PRI-001
    type: Principle
    name: non_paternalism
    state: canonical
    ratification: {by: ACT-001, review: REV-001, scope: up_to_specified, canonicalization: {review: REV-002, gate: GATE-002}}
    history:
      - {from: null, to: proposed, by: ACT-002, authority: "bootstrap.yaml autonomy[artifact_creation]", change: CHG-001, at: 2026-09-25}
      - {from: proposed, to: coherent, by: ACT-001, authority: REV-001, change: CHG-002, at: 2026-09-25}
      - {from: coherent, to: specified, by: ACT-001, authority: REV-001, change: CHG-002, at: 2026-09-25}
      - {from: specified, to: canonical, by: ACT-001, authority: REV-002, change: CHG-005, at: 2026-09-25}
    statement: The Subject, not the System, defines which lives are valued; the System does not rank or optimize toward system-chosen valued lives.
    grounding: TEL-001 "the life they value"; PUR-001 "the lives they value"
    relationships: [{type: depends_on, to: TEL-001}]
    provenance:
      source: ORIENT-001
      created_by: ACT-002
      authority: proposal_only (AUT-SEMANTIC-ARCHITECT)
      inputs: [project/bootstrap.yaml@0ab85fc, PROMPT.md@0ab85fc]
      created_at: 2026-09-25

  - id: PRI-002
    type: Principle
    name: member_non_subordination
    state: canonical
    ratification: {by: ACT-001, review: REV-001, scope: up_to_specified, canonicalization: {review: REV-002, gate: GATE-002}}
    history:
      - {from: null, to: proposed, by: ACT-002, authority: "bootstrap.yaml autonomy[artifact_creation]", change: CHG-001, at: 2026-09-25}
      - {from: proposed, to: coherent, by: ACT-001, authority: REV-001, change: CHG-002, at: 2026-09-25}
      - {from: coherent, to: specified, by: ACT-001, authority: REV-001, change: CHG-002, at: 2026-09-25}
      - {from: specified, to: canonical, by: ACT-001, authority: REV-002, change: CHG-005, at: 2026-09-25}
    statement: >
      Household-level capacity gains do not justify reducing any member's agency or
      condition; a member's condition is not reducible to a household aggregate.
    grounding: SUBJ-001 and TEL-001 dual-level scope ("and every person", "and everyone in it")
    addresses: [DEF-002]
    relationships: [{type: depends_on, to: SUBJ-001}]
    provenance:
      source: ORIENT-001
      created_by: ACT-002
      authority: proposal_only (AUT-SEMANTIC-ARCHITECT)
      inputs: [project/bootstrap.yaml@0ab85fc, PROMPT.md@0ab85fc]
      created_at: 2026-09-25

  - id: PRI-003
    type: Principle
    name: agency_preservation_with_chosen_delegation
    state: canonical
    ratification: {by: ACT-001, review: REV-001, scope: up_to_specified, canonicalization: {review: REV-002, gate: GATE-002}}
    history:
      - {from: null, to: proposed, by: ACT-002, authority: "bootstrap.yaml autonomy[artifact_creation]", change: CHG-001, at: 2026-09-25}
      - {from: proposed, to: coherent, by: ACT-001, authority: REV-001, change: CHG-002, at: 2026-09-25}
      - {from: coherent, to: specified, by: ACT-001, authority: REV-001, change: CHG-002, at: 2026-09-25}
      - {from: specified, to: canonical, by: ACT-001, authority: REV-002, change: CHG-005, at: 2026-09-25}
    statement: >
      The System augments rather than supplants the Subject's economic decision-making;
      any delegation or automation is chosen and revocable by the Subject.
    grounding: PUR-001 "capacity ... to deliberately shape"
    addresses: [DEF-005]
    relationships: [{type: depends_on, to: PUR-001}]
    provenance:
      source: ORIENT-001
      created_by: ACT-002
      authority: proposal_only (AUT-SEMANTIC-ARCHITECT)
      inputs: [project/bootstrap.yaml@0ab85fc, PROMPT.md@0ab85fc]
      created_at: 2026-09-25
