version: 1
# Governance constraints that justify framework automation. Their upward path ends at the
# human-ratified Constitution and Governance (canonical-source precedence 2), not at the
# Subject. See ASM-010.
artifacts:
  - id: CON-001
    type: Constraint
    state: specified
    statement: Every invariant in framework/invariants/core.yaml v1 that is declared deterministic must be evaluated by deterministic automation (AUT-CHECK), and the foundational gates depend on that evaluation.
    sources: [framework/invariants/core.yaml, framework/gates/foundational.yaml, automation/registry.yaml#AUT-CHECK, "CONSTITUTION.md#Foundational automation rule"]
    history:
      - {from: null, to: proposed, by: ACT-002, authority: "bootstrap.yaml autonomy[requirement_derivation]", change: CHG-004, at: 2026-09-25}
      - {from: proposed, to: coherent, by: ACT-001, authority: "REV-001 decision 2_check_gate", change: CHG-004, at: 2026-09-25}
      - {from: coherent, to: specified, by: ACT-001, authority: "REV-001 decision 2_check_gate", change: CHG-004, at: 2026-09-25}
    provenance: {source: WI-001, created_by: ACT-002, authority: "bootstrap.yaml autonomy[requirement_derivation]", inputs: [framework/invariants/core.yaml, automation/registry.yaml, CONSTITUTION.md, PROMPT.md], created_at: 2026-09-25}
  - id: CON-002
    type: Constraint
    state: specified
    statement: AUT-CHECK has no side effects.
    sources: [automation/registry.yaml#AUT-CHECK]
    history:
      - {from: null, to: proposed, by: ACT-002, authority: "bootstrap.yaml autonomy[requirement_derivation]", change: CHG-004, at: 2026-09-25}
      - {from: proposed, to: coherent, by: ACT-001, authority: "REV-001 decision 2_check_gate", change: CHG-004, at: 2026-09-25}
      - {from: coherent, to: specified, by: ACT-001, authority: "REV-001 decision 2_check_gate", change: CHG-004, at: 2026-09-25}
    provenance: {source: WI-001, created_by: ACT-002, authority: "bootstrap.yaml autonomy[requirement_derivation]", inputs: [framework/invariants/core.yaml, automation/registry.yaml, CONSTITUTION.md, PROMPT.md], created_at: 2026-09-25}
  - id: CON-003
    type: Constraint
    state: specified
    statement: A deterministic PASS means only that no applicable deterministic invariant failed; passing a lower-level gate does not imply satisfying a higher-level gate.
    sources: ["CONSTITUTION.md#Gate rule", "PROMPT.md#12"]
    history:
      - {from: null, to: proposed, by: ACT-002, authority: "bootstrap.yaml autonomy[requirement_derivation]", change: CHG-004, at: 2026-09-25}
      - {from: proposed, to: coherent, by: ACT-001, authority: "REV-001 decision 2_check_gate", change: CHG-004, at: 2026-09-25}
      - {from: coherent, to: specified, by: ACT-001, authority: "REV-001 decision 2_check_gate", change: CHG-004, at: 2026-09-25}
    provenance: {source: WI-001, created_by: ACT-002, authority: "bootstrap.yaml autonomy[requirement_derivation]", inputs: [framework/invariants/core.yaml, automation/registry.yaml, CONSTITUTION.md, PROMPT.md], created_at: 2026-09-25}
  - id: CON-004
    type: Constraint
    state: specified
    statement: >
      Material implementation must remain traceable upward to its justification, and material
      accepted system responsibility must remain traceable downward to realization or carry an
      explicit outstanding disposition. AUT-TRACE evaluates this deterministically, and the
      implementation_verification gate depends on it.
    sources: ["CONSTITUTION.md#Governing model", automation/registry.yaml#AUT-TRACE, framework/gates/foundational.yaml#implementation_verification]
    history:
      - {from: null, to: proposed, by: ACT-002, authority: "bootstrap.yaml autonomy[requirement_derivation]", change: CHG-006, at: 2026-09-25}
      - {from: proposed, to: coherent, by: ACT-001, authority: "REV-002 decisions.trace", change: CHG-006, at: 2026-09-25}
      - {from: coherent, to: specified, by: ACT-001, authority: "REV-002 decisions.trace", change: CHG-006, at: 2026-09-25}
    provenance: {source: WI-002, created_by: ACT-002, authority: "bootstrap.yaml autonomy[requirement_derivation]", inputs: [CONSTITUTION.md, automation/registry.yaml, framework/gates/foundational.yaml], created_at: 2026-09-25}
