  - id: MEC-021
    type: Mechanism
    name: private_retirement_assumptions
    statement: "Retirement accounts are accounts of their own kinds (401(k), IRA) with readings like any account (MEC-017), never counted as cash. Each member's retirement assumptions (birth year, retirement age, a yearly return after inflation, a monthly contribution to each retirement account they can see, a monthly Social Security estimate from their own statement, and a target monthly income) are kept in their own encrypted personal record with their goals (MEC-019). The projection is computed on request, month by month in today's dollars, and nothing is suggested."
    state: specified
    relationships: [{type: realizes, to: FUN-019}]
