version: 1
# First Capabilities for OUT-001, OUT-004, OUT-007, scoped to the alpha (OBA-003). Proposed only.
artifacts:
  - id: CAP-007
    type: Capability
    name: monthly_picture_and_projection
    state: proposed
    statement: "A member can see, across the items visible to them, what comes in and goes out each month and how that runs over the next twelve months if nothing changes, with no advice, score, or judgment."
    relationships: [{type: contributes_to, to: OUT-001}]
    provenance: {source: OBA-003, created_by: ACT-002, authority: proposal_only, inputs: [project/semantic/outcomes.yaml, project/assurance/analysis/OBA-003-alpha-outcomes.md], created_at: 2026-09-27}
  - id: CAP-008
    type: Capability
    name: agreed_shares_of_joint_items
    state: proposed
    statement: "The owners of a jointly owned item can agree how its amount is shared among them; each owner's own totals count their agreed share, and any change to the shares needs every owner's agreement."
    relationships: [{type: contributes_to, to: OUT-004}]
    provenance: {source: OBA-003, created_by: ACT-002, authority: proposal_only, inputs: [project/semantic/outcomes.yaml, project/assurance/defeaters.yaml, project/assurance/analysis/OBA-003-alpha-outcomes.md], created_at: 2026-09-27}
  - id: CAP-009
    type: Capability
    name: portable_record
    state: proposed
    statement: "A member can bring an export of their own record into a new household file, as items and values they own with their own links, so their record is not locked into one household."
    relationships: [{type: contributes_to, to: OUT-007}]
    provenance: {source: OBA-003, created_by: ACT-002, authority: proposal_only, inputs: [project/semantic/outcomes.yaml, project/semantic/cap002.yaml, project/assurance/analysis/OBA-003-alpha-outcomes.md], created_at: 2026-09-27}
