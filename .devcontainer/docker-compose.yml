services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    volumes:
      - ..:/workspace:cached

    command: sleep infinity

    environment:
      DATABASE_HOST: db
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: postgres

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data: